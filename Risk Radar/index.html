<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Radar — Worked Examples</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e1a;
      color: #e0e6f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: #0d1220;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #4fc3f7;
      text-transform: uppercase;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .example-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .ex-btn {
      padding: 5px 13px;
      background: #1a2235;
      border: 1px solid #2a3550;
      border-radius: 4px;
      color: #8a9bb5;
      cursor: pointer;
      font-size: 0.8rem;
      white-space: nowrap;
      transition: all 0.18s;
    }
    .ex-btn:hover { border-color: #4fc3f7; color: #e0e6f0; }
    .ex-btn.active { background: #1a3a5c; border-color: #4fc3f7; color: #4fc3f7; font-weight: 600; }

    /* ── PESTLE filter bar ── */
    #pestle-bar {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 20px;
      background: #111927;
      border-bottom: 1px solid #243048;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    #pestle-bar.visible { display: flex; }

    .pestle-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #7a8fa8;
      margin-right: 4px;
      white-space: nowrap;
    }

    .pf-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 11px 4px 8px;
      border-radius: 12px;
      border: 1px solid #2e3f58;
      background: #182030;
      color: #c8d8f0;
      cursor: pointer;
      font-size: 0.73rem;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .pf-btn:hover { border-color: #4a6080; background: #1e2a40; color: #e8f0ff; }

    .pf-btn .pf-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pf-btn.off { opacity: 0.4; }
    .pf-btn.off .pf-pip { background: #3a4a60 !important; }

    .pf-sep {
      width: 1px;
      height: 18px;
      background: #243048;
      margin: 0 3px;
    }

    .pf-all {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 4px 10px;
      background: #1e2a40;
      border: 1px solid #3a5070;
      border-radius: 4px;
      color: #a0b8d0;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pf-all:hover { border-color: #4fc3f7; color: #e0f0ff; background: #1a3050; }

    /* ── Main layout ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Radar panel ── */
    #radar-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 16px;
      gap: 10px;
      min-width: 0;
    }

    #radar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    #radar-canvas {
      display: block;
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(79,195,247,0.07);
    }

    /* ── Info panel ── */
    #info-panel {
      width: 360px;
      min-width: 300px;
      background: #0d1220;
      border-left: 1px solid #1e2a40;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Panel tab bar */
    #panel-tabs {
      display: flex;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
    }

    .panel-tab {
      flex: 1;
      padding: 9px 0;
      background: none;
      border: none;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4a5a75;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .panel-tab:hover { color: #8a9bb5; }
    .panel-tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }

    #info-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
    }

    /* ── Chat panel ── */
    #chat-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-panel.visible { display: flex; }

    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-meta {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .chat-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 800;
      flex-shrink: 0;
      letter-spacing: 0;
    }

    .chat-avatar.board  { background: #1a3050; color: #90caf9; border: 1px solid #2a4a70; }
    .chat-avatar.analyst { background: #1a2e20; color: #80cbc4; border: 1px solid #2a4a38; }

    .chat-name {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .chat-name.board   { color: #90caf9; }
    .chat-name.analyst { color: #80cbc4; }

    .chat-time {
      font-size: 0.6rem;
      color: #3a4a60;
      margin-left: auto;
    }

    .chat-bubble {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.76rem;
      line-height: 1.6;
      margin-left: 29px;
    }

    .chat-bubble.board {
      background: #0f1e35;
      border: 1px solid #1e3050;
      color: #c8d8f0;
    }

    .chat-bubble.analyst {
      background: #0d1e18;
      border: 1px solid #1a3028;
      color: #b0ccc8;
    }

    .chat-bubble strong { color: #e0eaf8; }
    .chat-bubble em     { color: #ffa726; font-style: normal; }
    .chat-bubble .hi    { color: #4fc3f7; font-weight: 700; }
    .chat-bubble .warn  { color: #ef5350; font-weight: 700; }
    .chat-bubble .good  { color: #26a69a; font-weight: 700; }

    .chat-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }

    .chat-divider span {
      font-size: 0.6rem;
      color: #2a3a50;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .chat-divider::before, .chat-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1a2438;
    }

    .info-ex-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #4fc3f7;
      margin-bottom: 4px;
    }

    .info-title {
      font-size: 1rem;
      font-weight: 700;
      color: #e0e8f8;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .info-objective {
      font-size: 0.75rem;
      color: #8a9bb5;
      background: rgba(79,195,247,0.06);
      border-left: 2px solid #4fc3f7;
      padding: 7px 10px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .info-objective strong {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4fc3f7;
      margin-bottom: 3px;
    }

    .info-section {
      margin-bottom: 14px;
    }

    .info-section-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a5a75;
      margin-bottom: 6px;
    }

    .info-text {
      font-size: 0.78rem;
      color: #8a9bb5;
      line-height: 1.6;
    }

    .info-text strong { color: #c8d4e8; }
    .info-text em { color: #ffa726; font-style: normal; }

    /* Force breakdown rows */
    .force-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 4px;
    }

    .force-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 5px;
      background: #0f1624;
      border: 1px solid #1a2438;
    }

    .force-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .force-name {
      flex: 1;
      font-size: 0.73rem;
      color: #a0b0c8;
      line-height: 1.3;
    }

    .force-value {
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Distribution table */
    .dist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
      margin-top: 4px;
    }

    .dist-table th {
      text-align: left;
      color: #4a5a75;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 0.62rem;
      padding: 4px 6px;
      border-bottom: 1px solid #1a2438;
    }

    .dist-table td {
      padding: 4px 6px;
      color: #8a9bb5;
      border-bottom: 1px solid #111826;
    }

    .dist-table tr.highlight td { color: #4fc3f7; font-weight: 700; background: rgba(79,195,247,0.05); }
    .dist-table tr.shift-neg td { color: #26a69a; }

    /* Subsidiary aggregation rows */
    .sub-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 4px;
    }

    .sub-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 5px;
      background: #0f1624;
      border: 1px solid #1a2438;
    }

    .sub-name { font-size: 0.73rem; color: #a0b0c8; }
    .sub-bearing { font-size: 0.73rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sub-weight { font-size: 0.68rem; color: #4a5a75; }

    /* Cascade table */
    .cascade-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
      margin-top: 4px;
    }

    .cascade-table th {
      text-align: left;
      color: #4a5a75;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-size: 0.62rem;
      padding: 4px 6px;
      border-bottom: 1px solid #1a2438;
    }

    .cascade-table td {
      padding: 4px 6px;
      color: #8a9bb5;
      border-bottom: 1px solid #111826;
      vertical-align: top;
    }

    .cascade-table td:first-child { color: #c8d4e8; }

    /* Result callout */
    .result-box {
      background: #0f1930;
      border: 1px solid #2a4060;
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 10px;
    }

    .result-box-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a5a75;
      margin-bottom: 4px;
    }

    .result-bearing {
      font-size: 1.3rem;
      font-weight: 700;
      color: #4fc3f7;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 4px;
    }

    .result-sub {
      font-size: 0.72rem;
      color: #6a7a95;
      line-height: 1.5;
    }

    /* Issue badge */
    .issue-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(41,182,246,0.12);
      border: 1px solid rgba(41,182,246,0.35);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.7rem;
      color: #29b6f6;
      margin-bottom: 8px;
    }

    .issue-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #29b6f6;
      box-shadow: 0 0 5px #ef5350;
      flex-shrink: 0;
    }

    /* Regime badge */
    .regime-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .regime-1 { background: rgba(79,195,247,0.12); color: #4fc3f7; border: 1px solid rgba(79,195,247,0.3); }
    .regime-2 { background: rgba(255,167,38,0.12); color: #ffa726; border: 1px solid rgba(255,167,38,0.3); }
    .regime-3 { background: rgba(239,83,80,0.12); color: #ef5350; border: 1px solid rgba(239,83,80,0.3); }

    /* Divider */
    .info-divider {
      height: 1px;
      background: #1a2438;
      margin: 12px 0;
    }

    /* Percentile bar visual */
    .pct-bar-wrap {
      margin-top: 6px;
      background: #0f1624;
      border: 1px solid #1a2438;
      border-radius: 5px;
      padding: 8px 10px;
    }

    .pct-bar-track {
      position: relative;
      height: 8px;
      background: #1a2438;
      border-radius: 4px;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    .pct-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #26a69a, #ffa726, #ef5350);
    }

    .pct-marker {
      position: absolute;
      top: -14px;
      transform: translateX(-50%);
      font-size: 0.62rem;
      font-weight: 700;
      color: #4fc3f7;
      white-space: nowrap;
    }

    .pct-marker::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 8px;
      background: #4fc3f7;
    }

    .pct-axis {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      color: #4a5a75;
    }

    /* ── Tooltip ── */
    #radar-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 200;
      width: 270px;
      background: #0d1525;
      border: 1px solid #2a3a55;
      border-radius: 8px;
      padding: 13px 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      display: none;
    }

    #radar-tooltip.visible { display: block; }

    .tt-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tt-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    .tt-label { font-size: 0.85rem; font-weight: 700; color: #e0e8f8; flex: 1; }

    .tt-badge {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 8px;
    }

    .tt-badge.threat      { background: rgba(239,83,80,0.15); color: #ef5350; border: 1px solid rgba(239,83,80,0.3); }
    .tt-badge.opportunity { background: rgba(38,166,154,0.15); color: #26a69a; border: 1px solid rgba(38,166,154,0.3); }
    .tt-badge.issue       { background: rgba(41,182,246,0.15); color: #29b6f6; border: 1px solid rgba(41,182,246,0.4); }
    .tt-badge.subsidiary  { background: rgba(121,134,203,0.15); color: #7986cb; border: 1px solid rgba(121,134,203,0.3); }

    .tt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 8px;
    }

    .tt-cell {
      background: #131e33;
      border-radius: 4px;
      padding: 5px 7px;
    }

    .tt-cell-label {
      font-size: 0.6rem;
      color: #4a5a75;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 2px;
    }

    .tt-cell-value {
      font-size: 0.78rem;
      font-weight: 700;
      color: #c8d4e8;
    }

    .tt-cell-value.high   { color: #ef5350; }
    .tt-cell-value.medium { color: #ffa726; }
    .tt-cell-value.low    { color: #26a69a; }
    .tt-cell-value.pos    { color: #26a69a; }
    .tt-cell-value.neg    { color: #ef5350; }

    .tt-bearing {
      font-size: 0.73rem;
      color: #7986cb;
      margin-bottom: 7px;
      padding: 5px 8px;
      background: rgba(121,134,203,0.08);
      border-left: 2px solid #7986cb;
      border-radius: 0 3px 3px 0;
      line-height: 1.45;
    }

    .tt-rationale {
      font-size: 0.72rem;
      color: #6a7a95;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div id="app" style="display:flex;flex-direction:column;height:100vh;">
  <header id="toolbar">
    <span class="brand">Risk Radar</span>
    <div class="example-tabs">
      <button class="ex-btn active" data-ex="1">Ex 1 — Tier 0 Raw Inputs</button>
      <button class="ex-btn" data-ex="2">Ex 2 — Tier Aggregation</button>
      <button class="ex-btn" data-ex="3">Ex 3 — North Cascade</button>
      <button class="ex-btn" data-ex="4">Ex 4 — Regime 1: Volatility</button>
      <button class="ex-btn" data-ex="5">Ex 5 — Regime 2: Shocks</button>
      <button class="ex-btn" data-ex="6">Ex 6 — Regime 3: Issue</button>
      <button class="ex-btn" data-ex="6a">Ex 6a — PESTLE Stress Test</button>
    </div>
  </header>

  <div id="pestle-bar">
    <span class="pestle-label">Filter:</span>
    <button class="pf-all" id="pf-all-btn">All on</button>
    <div class="pf-sep"></div>
    <button class="pf-btn" data-pestle="P"><span class="pf-pip" style="background:#ab47bc"></span>Political</button>
    <button class="pf-btn" data-pestle="E"><span class="pf-pip" style="background:#ef5350"></span>Economic</button>
    <button class="pf-btn" data-pestle="S"><span class="pf-pip" style="background:#ffa726"></span>Social</button>
    <button class="pf-btn" data-pestle="T"><span class="pf-pip" style="background:#26a69a"></span>Technology</button>
    <button class="pf-btn" data-pestle="L"><span class="pf-pip" style="background:#7986cb"></span>Legal</button>
    <button class="pf-btn" data-pestle="En"><span class="pf-pip" style="background:#66bb6a"></span>Environmental</button>
    <div class="pf-sep"></div>
    <button class="pf-btn" data-pestle="type-threat"><span class="pf-pip" style="background:#ef5350"></span>Threats</button>
    <button class="pf-btn" data-pestle="type-opportunity"><span class="pf-pip" style="background:#26a69a"></span>Opportunities</button>
    <button class="pf-btn" data-pestle="type-issue"><span class="pf-pip" style="background:#29b6f6"></span>Issues</button>
  </div>

  <main id="main">
    <section id="radar-panel">
      <div id="radar-wrap">
        <canvas id="radar-canvas" width="660" height="660"></canvas>
      </div>
    </section>

    <div id="radar-tooltip">
      <div class="tt-header">
        <div class="tt-dot" id="tt-dot"></div>
        <span class="tt-label" id="tt-label"></span>
        <span class="tt-badge" id="tt-badge"></span>
      </div>
      <div class="tt-grid" id="tt-grid"></div>
      <div class="tt-bearing" id="tt-bearing"></div>
      <div class="tt-rationale" id="tt-rationale"></div>
    </div>

    <section id="info-panel">
      <div id="panel-tabs">
        <button class="panel-tab active" data-tab="analysis">Analysis</button>
        <button class="panel-tab" data-tab="chat">Board Q&amp;A</button>
      </div>
      <div id="info-scroll"></div>
      <div id="chat-panel">
        <div id="chat-scroll"></div>
      </div>
    </section>
  </main>
</div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const CW = 660, CH = 660;
const CX = CW / 2, CY = CH / 2;
const MAX_R = 295;

// ─── Geometry helpers ────────────────────────────────────────────────────────
function toRad(deg) { return deg * Math.PI / 180; }
function bearingToAngle(deg) { return toRad(deg - 90); }
function polarXY(bearingDeg, fraction) {
  const a = bearingToAngle(bearingDeg);
  const r = fraction * MAX_R;
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
}

// ─── Example data ────────────────────────────────────────────────────────────
const EXAMPLES = {

  // ── Example 1 ──────────────────────────────────────────────────────────────
  1: {
    bearing: 105,
    anchorBearing: null,
    coneP50: 95,
    coneP80: 105,
    coneHalf: 30,
    asymmetric: false,
    showSubsidiaries: false,

// ─── Filter helpers ──────────────────────────────────────────────────────────
function visibleBlip(b) {
  if(activeEx !== '6a') return true;
  if(!typeActive[b.type]) return false;
  if(b.pestle && !pestleActive[b.pestle]) return false;
  return true;
}

function visibleIssue(i) {
  if(activeEx !== '6a') return true;
  if(!typeActive['issue']) return false;
  if(i.pestle && !pestleActive[i.pestle]) return false;
  return true;
}

// ─── State ───────────────────────────────────────────────────────────────────
let activeEx = 1;

// PESTLE filter state — all on by default
const pestleActive = { P: true, E: true, S: true, T: true, L: true, En: true };
const typeActive   = { threat: true, opportunity: true, issue: true };

// ─── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('radar-canvas');
const ctx    = canvas.getContext('2d');

function drawBg() {
  ctx.beginPath(); ctx.arc(CX, CY, MAX_R + 2, 0, Math.PI*2);
  ctx.fillStyle = '#070b14'; ctx.fill();
  const g = ctx.createRadialGradient(CX,CY,0,CX,CY,MAX_R);
  g.addColorStop(0,'rgba(79,195,247,0.06)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(CX,CY,MAX_R,0,Math.PI*2);
  ctx.fillStyle = g; ctx.fill();
  for (let b=0;b<360;b+=30) {
    const p=polarXY(b,1);
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(p.x,p.y);
    ctx.strokeStyle='rgba(79,195,247,0.05)'; ctx.lineWidth=1; ctx.stroke();
  }
}

const ISSUE_RANGE = 0.12; // Issues always render on the innermost "Current" ring

function drawRings(ex) {
  // Innermost ring: Current state — Issues live here
  const cr = ISSUE_RANGE * MAX_R;
  ctx.beginPath(); ctx.arc(CX,CY,cr,0,Math.PI*2);
  ctx.strokeStyle='rgba(41,182,246,0.30)'; ctx.lineWidth=1; ctx.setLineDash([3,4]); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(41,182,246,0.55)'; ctx.font='10px Segoe UI';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('Now', CX+cr+5, CY-4);

  // Horizon rings
  const rings = [
    {f:0.25,label:'6 mo'},{f:0.50,label:'1 yr'},{f:0.75,label:'2 yr'},{f:1.00,label:'5 yr'}
  ];
  rings.forEach(r => {
    ctx.beginPath(); ctx.arc(CX,CY,r.f*MAX_R,0,Math.PI*2);
    ctx.strokeStyle='rgba(79,195,247,0.13)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(79,195,247,0.35)'; ctx.font='10px Segoe UI';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(r.label, CX+r.f*MAX_R+5, CY-4);
  });
}

function drawCompass(northLabel) {
  const cards = [{b:0,l:'N',hi:true},{b:90,l:'E'},{b:180,l:'S'},{b:270,l:'W'}];
  cards.forEach(c => {
    const p=polarXY(c.b,1.09);
    ctx.fillStyle = c.hi ? '#4fc3f7' : 'rgba(79,195,247,0.38)';
    ctx.font = c.hi ? 'bold 13px Segoe UI' : '11px Segoe UI';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.l, p.x, p.y);
  });
  ctx.fillStyle='rgba(79,195,247,0.45)'; ctx.font='9px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(northLabel||'TRUE NORTH', CX, CY-MAX_R-14);
  ctx.beginPath(); ctx.moveTo(CX,CY-MAX_R); ctx.lineTo(CX,CY-MAX_R-10);
  ctx.strokeStyle='#4fc3f7'; ctx.lineWidth=2; ctx.stroke();
}

function drawConeSymmetric(bearing, halfAngle, color, alpha0) {
  const bands = [
    {o:0.25,i:0,a:alpha0},{o:0.50,i:0.25,a:alpha0*0.7},
    {o:0.75,i:0.50,a:alpha0*0.45},{o:1.00,i:0.75,a:alpha0*0.25}
  ];
  bands.forEach(b => {
    const oH = halfAngle * b.o, iH = halfAngle * b.i;
    const sO=bearingToAngle(bearing-oH), eO=bearingToAngle(bearing+oH);
    const sI=bearingToAngle(bearing-iH), eI=bearingToAngle(bearing+iH);
    ctx.beginPath(); ctx.arc(CX,CY,b.o*MAX_R,sO,eO);
    if(b.i===0) ctx.lineTo(CX,CY);
    else ctx.arc(CX,CY,b.i*MAX_R,eI,sI,true);
    ctx.closePath();
    const hex = Math.round(b.a*255).toString(16).padStart(2,'0');
    ctx.fillStyle = color+hex; ctx.fill();
  });
  [bearing-halfAngle,bearing+halfAngle].forEach(edge=>{
    const p=polarXY(edge,1);
    ctx.setLineDash([4,5]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(p.x,p.y);
    ctx.strokeStyle=color+'55'; ctx.stroke(); ctx.setLineDash([]);
  });
}

function drawConeAsymmetric(medianBearing, leftDeg, rightDeg, color) {
  // leftDeg = how far the cone extends left (west) of median
  // rightDeg = how far the cone extends right (east) of median
  const leftBearing  = medianBearing - leftDeg;
  const rightBearing = medianBearing + rightDeg;
  const frac = [0.25,0.50,0.75,1.00];
  const alphas = [0.22,0.15,0.09,0.05];
  frac.forEach((f,i) => {
    const lH = leftDeg  * f;
    const rH = rightDeg * f;
    const startA = bearingToAngle(medianBearing - lH);
    const endA   = bearingToAngle(medianBearing + rH);
    ctx.beginPath();
    ctx.arc(CX,CY,f*MAX_R,startA,endA);
    ctx.lineTo(CX,CY);
    ctx.closePath();
    const hex = Math.round(alphas[i]*255).toString(16).padStart(2,'0');
    ctx.fillStyle = color+hex; ctx.fill();
  });
  const pL=polarXY(medianBearing-leftDeg,1), pR=polarXY(medianBearing+rightDeg,1);
  ctx.setLineDash([4,5]); ctx.lineWidth=1;
  [pL,pR].forEach(p=>{
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(p.x,p.y);
    ctx.strokeStyle=color+'55'; ctx.stroke();
  });
  ctx.setLineDash([]);
}

function drawArrow(bearing, color, glow) {
  const tip = polarXY(bearing, 0.82);
  const a = bearingToAngle(bearing);
  ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(tip.x,tip.y);
  ctx.strokeStyle=color; ctx.lineWidth=2.5;
  if(glow){ctx.shadowColor=color; ctx.shadowBlur=10;}
  ctx.stroke(); ctx.shadowBlur=0;
  const al=14;
  ctx.beginPath();
  ctx.moveTo(tip.x,tip.y);
  ctx.lineTo(tip.x-al*Math.cos(a-0.28),tip.y-al*Math.sin(a-0.28));
  ctx.lineTo(tip.x-al*Math.cos(a+0.28),tip.y-al*Math.sin(a+0.28));
  ctx.closePath(); ctx.fillStyle=color;
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=8;}
  ctx.fill(); ctx.shadowBlur=0;
}

function drawAnchorLine(anchorBearing, color) {
  // dashed line from centre to anchor position, then main arrow continues
  const anchorPt = polarXY(anchorBearing, 0.32);
  ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(anchorPt.x,anchorPt.y);
  ctx.setLineDash([3,4]); ctx.lineWidth=2; ctx.strokeStyle=color+'99'; ctx.stroke();
  ctx.setLineDash([]);
  // small anchor dot
  ctx.beginPath(); ctx.arc(anchorPt.x,anchorPt.y,5,0,Math.PI*2);
  ctx.fillStyle=color+'cc'; ctx.fill();
}

function drawIssueDiamond(bearing, label, pestle) {
  const p = polarXY(bearing, ISSUE_RANGE);
  const s = 9;
  const col = pestle ? PESTLE_COLOR[pestle] : '#29b6f6';
  // Direction arrow (issues also point in their bearing direction)
  drawForceArrow(p.x, p.y, bearing, col, s * 2.4);
  // Glow fill
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - s*1.5);
  ctx.lineTo(p.x + s*1.5, p.y);
  ctx.lineTo(p.x, p.y + s*1.5);
  ctx.lineTo(p.x - s*1.5, p.y);
  ctx.closePath();
  ctx.fillStyle = hexToRgba(col, 0.15); ctx.fill();
  // Diamond body
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - s);
  ctx.lineTo(p.x + s, p.y);
  ctx.lineTo(p.x, p.y + s);
  ctx.lineTo(p.x - s, p.y);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.strokeStyle = hexToRgba(col, 0.6); ctx.lineWidth=1.5;
  ctx.shadowColor = col; ctx.shadowBlur=10; ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
  // Label
  ctx.fillStyle = hexToRgba(col, 0.85); ctx.font='9px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(label, p.x, p.y - s - 3);
}

// Draw a small directional arrow from (px,py) pointing in bearingDeg.
// stem = total arrow length in px; used by blips and subsidiaries.
function drawForceArrow(px, py, bearingDeg, color, stem) {
  const a   = bearingToAngle(bearingDeg);
  const tip = { x: px + stem * Math.cos(a), y: py + stem * Math.sin(a) };
  const hw  = stem * 0.32; // arrowhead half-width angle
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(tip.x, tip.y);
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.5;
  ctx.globalAlpha = 0.75;
  ctx.stroke();
  // Arrowhead
  const hl = stem * 0.38;
  ctx.beginPath();
  ctx.moveTo(tip.x, tip.y);
  ctx.lineTo(tip.x - hl * Math.cos(a - 0.38), tip.y - hl * Math.sin(a - 0.38));
  ctx.lineTo(tip.x - hl * Math.cos(a + 0.38), tip.y - hl * Math.sin(a + 0.38));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function blipColor(t) {
  if(t.pestle) return PESTLE_COLOR[t.pestle] || TYPE_COLOR[t.type] || '#ef5350';
  return TYPE_COLOR[t.type] || '#ef5350';
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawBlip(t) {
  const p = polarXY(t.bearing, t.range);
  const color = blipColor(t);
  const glow  = hexToRgba(color, 0.28);
  // Direction arrow — stem length scaled to blip size
  drawForceArrow(p.x, p.y, t.bearing, color, t.size * 1.6);
  // Glow halo
  ctx.beginPath(); ctx.arc(p.x,p.y,t.size*0.72,0,Math.PI*2);
  ctx.fillStyle=glow; ctx.fill();
  // Core dot
  ctx.beginPath(); ctx.arc(p.x,p.y,t.size*0.38,0,Math.PI*2);
  ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=6; ctx.fill(); ctx.shadowBlur=0;
  // Label
  ctx.fillStyle='rgba(220,232,248,0.72)'; ctx.font='9px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(t.label, p.x, p.y - t.size*0.42 - 3);
}

function drawSubsidiary(s, showNewNorth) {
  const p = polarXY(s.bearing, s.range);
  const r = 13;
  // Direction arrow
  drawForceArrow(p.x, p.y, s.bearing, s.color, r * 2.2);
  // Glow
  ctx.beginPath(); ctx.arc(p.x,p.y,r*1.4,0,Math.PI*2);
  ctx.fillStyle = s.color+'22'; ctx.fill();
  // Main circle
  ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fillStyle = s.color; ctx.shadowColor=s.color; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
  // Issue ring
  if(s.issue) {
    ctx.beginPath(); ctx.arc(p.x,p.y,r+4,0,Math.PI*2);
    ctx.strokeStyle='#29b6f6'; ctx.lineWidth=2;
    ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
  }
  // Label
  ctx.fillStyle='rgba(220,232,248,0.8)'; ctx.font='bold 9px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(s.label, p.x, p.y - r - 3);
  // Deviation label
  const devText = (showNewNorth && s.newDeviation!=null) ?
    `${s.newDeviation>0?'+':''}${s.newDeviation}°` :
    `${s.bearing>0?'+':''}${s.bearing}°`;
  ctx.fillStyle = s.color; ctx.font='bold 9px Segoe UI';
  ctx.textBaseline='top';
  ctx.fillText(devText, p.x, p.y + r + 3);
}

function drawNewNorthLine(northDelta) {
  // Draw the new True North direction
  const newNorthBearing = northDelta; // delta from 0
  const tip = polarXY(newNorthBearing, 1.0);
  ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(tip.x,tip.y);
  ctx.setLineDash([6,5]); ctx.lineWidth=2;
  ctx.strokeStyle='rgba(79,195,247,0.4)'; ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(79,195,247,0.6)'; ctx.font='bold 9px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const labelPt = polarXY(newNorthBearing, 1.12);
  ctx.fillText('NEW NORTH', labelPt.x, labelPt.y);
}

function drawOrigin() {
  ctx.beginPath(); ctx.arc(CX,CY,12,0,Math.PI*2);
  ctx.strokeStyle='rgba(79,195,247,0.18)'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2);
  ctx.fillStyle='#4fc3f7'; ctx.shadowColor='#4fc3f7'; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;
}

function drawBorder() {
  ctx.beginPath(); ctx.arc(CX,CY,MAX_R,0,Math.PI*2);
  ctx.strokeStyle='rgba(79,195,247,0.2)'; ctx.lineWidth=2; ctx.stroke();
}

function drawBearingLabel(bearing, color) {
  const abs=Math.abs(Math.round(bearing));
  const dir = bearing===0 ? 'True North' : bearing>0 ? `+${abs}° east of True North` : `−${abs}° west of True North`;
  ctx.fillStyle=color; ctx.font='bold 11px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(`Bearing: ${dir}`, CX, CY+MAX_R+12);
}

function drawP50marker(bearing) {
  // Show P50 bearing as a thin line
  const tip = polarXY(bearing, 0.75);
  ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(tip.x,tip.y);
  ctx.setLineDash([2,4]); ctx.lineWidth=1.5;
  ctx.strokeStyle='rgba(79,195,247,0.4)'; ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(79,195,247,0.5)'; ctx.font='9px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  const lp = polarXY(bearing, 0.78);
  ctx.fillText('P50', lp.x, lp.y-2);
}

// ─── Main render ─────────────────────────────────────────────────────────────
function renderRadar() {
  ctx.clearRect(0,0,CW,CH);
  const ex = EXAMPLES[activeEx];

  drawBg();
  drawRings(ex);
  drawCompass('TRUE NORTH');

  // Cone
  const coneColor = '#4fc3f7';
  if(ex.asymmetric) {
    drawConeAsymmetric(ex.coneP50, ex.coneLeft, ex.coneRight, coneColor);
  } else if(ex.coneHalf) {
    drawConeSymmetric(ex.coneP80, ex.coneHalf, coneColor, 0.18);
  } else {
    // derive half from P50/P80 spread
    const spread = Math.max(Math.abs(ex.coneP80 - ex.coneP50)*2, 6);
    drawConeSymmetric(ex.coneP80, spread, coneColor, 0.18);
  }

  // New north line (ex 3)
  if(ex.showNorthDelta && ex.northDelta) drawNewNorthLine(ex.northDelta);

  // Subsidiaries
  if(ex.showSubsidiaries && ex.subsidiaries) {
    ex.subsidiaries.forEach(s => drawSubsidiary(s, ex.showNorthDelta));
  }

  // Blips — filtered by PESTLE/type when in 6a
  if(ex.blips) {
    ex.blips.filter(b => visibleBlip(b)).forEach(b => drawBlip(b));
  }

  // Issues — filtered by type when in 6a
  if(ex.issues && ex.issues.length) {
    ex.issues.filter(i => visibleIssue(i)).forEach(i => drawIssueDiamond(i.bearing, i.label, i.pestle));
  }

  // Anchor displacement line (ex 6)
  if(ex.anchorBearing != null) {
    drawAnchorLine(ex.anchorBearing, '#29b6f6');
  }

  // P50 dashed indicator (ex 4,5,6,6a)
  if(ex.coneP50 != null && (activeEx >= 4 || activeEx === '6a')) {
    drawP50marker(ex.coneP50);
  }

  // Main bearing arrow
  drawArrow(ex.bearing, '#4fc3f7', true);

  drawOrigin();
  drawBorder();
  drawBearingLabel(ex.bearing, '#4fc3f7');
}

      <div class="info-text">
        S1 is removed from the shock inventory and added to the ActiveDeviation register. The +28° displacement is now applied <strong>deterministically to every simulation run</strong> before stochastic variation begins. The cone anchor shifts east; the cone itself <em>narrows</em>.
      </div>
    </div>
    <div class="info-section">
      <div class="info-section-title">Distribution before vs after</div>
      <table class="dist-table">
        <tr><th>Pct</th><th>Before (Ex5)</th><th>After (Ex6)</th><th>Shift</th></tr>
        <tr><td>P10</td><td>21.1°</td><td>20.8°</td><td>−0.3°</td></tr>
        <tr><td>P25</td><td>24.2°</td><td>24.0°</td><td>−0.2°</td></tr>
        <tr class="highlight"><td>P50</td><td>28.9°</td><td>29.1°</td><td>+0.2°</td></tr>
        <tr class="highlight shift-neg"><td>P80 ★</td><td>48.7°</td><td>37.5°</td><td>−11.2°</td></tr>
        <tr class="shift-neg"><td>P90</td><td>57.3°</td><td>46.0°</td><td>−11.3°</td></tr>
        <tr class="shift-neg"><td>P95</td><td>63.8°</td><td>51.6°</td><td>−12.2°</td></tr>
      </table>
    </div>
    <div class="info-section">
      <div class="info-section-title">Why the cone narrows when bad news is confirmed</div>
      <div class="info-text">
        Before: S1 triggered in 35% of runs (+28°) and did not trigger in 65% of runs (0°). That difference was a major source of variance. The P80 was dominated by runs where S1 <em>and</em> something else went wrong.<br><br>
        After: S1 is +28° in <em>every</em> run. It is no longer a source of variance. Certainty about a bad outcome reduces uncertainty about the future. Only S2 and O1 remain stochastic — a much smaller variance pool.
      </div>
    </div>
    <div class="result-box">
      <div class="result-box-label">Resolution path</div>
      <div class="result-bearing">~+14° at 9 months</div>
      <div class="result-sub">If action A1 (regulatory counsel) resolves the Ofgem review favourably in 9 months, the anchor decays linearly: +28° × (1 − 9/18) = +14°. Projected bearing at resolution: +14° to +20°. The board watches the arrow return toward north as the action succeeds.</div>
    </div>
  `,

  '6a': () => {
    const ex = EXAMPLES['6a'];
    const visible = ex.blips.filter(b => visibleBlip(b));
    const threats = visible.filter(b => b.type==='threat');
    const opps    = visible.filter(b => b.type==='opportunity');
    const issues  = ex.issues.filter(i => visibleIssue(i));
    const pestleCounts = {};
    [...visible, ...issues].forEach(b => {
      if(b.pestle) pestleCounts[b.pestle] = (pestleCounts[b.pestle]||0)+1;
    });
    const pestleNames = {P:'Political',E:'Economic',S:'Social',T:'Technology',L:'Legal',En:'Environmental'};
    const legend = Object.entries(pestleCounts).map(([k,n]) =>
      `<span style="color:${PESTLE_COLOR[k]};font-weight:700">${pestleNames[k]}</span> ${n}`
    ).join(' &nbsp;·&nbsp; ');
    return `
    <div class="info-ex-label">Example 6a — PESTLE Stress Test</div>
    <div class="info-title">Full Risk Landscape: Meridian Group</div>
    <div class="info-objective">
      <strong>True North</strong>
      Deliver regulated infrastructure projects generating £180m revenue by FY28, maintaining investment-grade credit rating. Three confirmed Issues active.
    </div>
    <div class="info-section">
      <div class="info-section-title">Visible risks</div>
      <div class="info-text">
        <strong>${threats.length}</strong> threats &nbsp;·&nbsp;
        <strong>${opps.length}</strong> opportunities &nbsp;·&nbsp;
        <strong>${issues.length}</strong> confirmed issues<br>
        <span style="font-size:0.7rem;margin-top:4px;display:block">${legend||'No PESTLE filters active'}</span>
      </div>
    </div>
    <div class="info-section">
      <div class="info-section-title">Confirmed issues (Now ring)</div>
      <div class="force-list">
        ${ex.issues.map(i => `
        <div class="force-row" style="opacity:${visibleIssue(i)?1:0.3}">
          <div class="force-dot" style="background:${PESTLE_COLOR[i.pestle]||'#29b6f6'};border-radius:2px;transform:rotate(45deg)"></div>
          <div class="force-name"><strong>${i.label}</strong><br><span style="font-size:0.65rem;color:#4a5a75">${i.action}</span></div>
          <div class="force-value" style="color:${PESTLE_COLOR[i.pestle]||'#29b6f6'}">${pestleNames[i.pestle]||''}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="info-section">
      <div class="info-section-title">Dominant threat forces</div>
      <div class="force-list">
        ${threats.slice(0,5).map(t => `
        <div class="force-row">
          <div class="force-dot" style="background:${PESTLE_COLOR[t.pestle]||'#ef5350'}"></div>
          <div class="force-name">${t.label}</div>
          <div class="force-value" style="color:${PESTLE_COLOR[t.pestle]||'#ef5350'}">${t.direction}</div>
        </div>`).join('')}
        ${threats.length > 5 ? `<div class="info-text" style="padding:4px 8px;color:#4a5a75">+${threats.length-5} more threats filtered in</div>` : ''}
      </div>
    </div>
    <div class="info-section">
      <div class="info-section-title">Corrective opportunities</div>
      <div class="force-list">
        ${opps.map(o => `
        <div class="force-row">
          <div class="force-dot" style="background:${PESTLE_COLOR[o.pestle]||'#26a69a'}"></div>
          <div class="force-name">${o.label}</div>
          <div class="force-value" style="color:${PESTLE_COLOR[o.pestle]||'#26a69a'}">${o.direction}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="result-box">
      <div class="result-box-label">Group bearing (P80, all filters on)</div>
      <div class="result-bearing">+52° east</div>
      <div class="result-sub">With the full PESTLE risk landscape visible, the group bearing is worse than Ex 6 alone because the Economic, Social, and Environmental threat clusters add eastward force beyond the confirmed Ofgem issue. Use the filter bar to isolate categories and see which PESTLE dimension is the primary contributor.</div>
    </div>
  `; },
};

function renderInfo() {
  const panel = document.getElementById('info-scroll');
  panel.innerHTML = INFO[activeEx]();
}

// ─── Chat render ──────────────────────────────────────────────────────────────
function renderChat() {
  const scroll = document.getElementById('chat-scroll');
  const msgs = CHATS[activeEx] || [];
  scroll.innerHTML = msgs.map((m, i) => {
    const isBoard = m.role === 'board';
    const initials = m.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    // Insert a divider before the first analyst response after a board question
    const divider = (i > 0 && isBoard && CHATS[activeEx][i-1].role === 'analyst')
      ? `<div class="chat-divider"><span>Exchange</span></div>` : '';
    return `${divider}<div class="chat-msg">
      <div class="chat-meta">
        <div class="chat-avatar ${m.role}">${initials}</div>
        <span class="chat-name ${m.role}">${m.name}</span>
        <span class="chat-time">${m.time}</span>
      </div>
      <div class="chat-bubble ${m.role}">${m.text}</div>
    </div>`;
  }).join('');
  scroll.scrollTop = 0;
}

// ─── Panel tab switching ──────────────────────────────────────────────────────
let activeTab = 'analysis';

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.panel-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  const infoScroll  = document.getElementById('info-scroll');
  const chatPanel   = document.getElementById('chat-panel');
  if(tab === 'analysis') {
    infoScroll.style.display = '';
    chatPanel.classList.remove('visible');
  } else {
    infoScroll.style.display = 'none';
    chatPanel.classList.add('visible');
    renderChat();
  }
}

document.querySelectorAll('.panel-tab').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
});

// ─── Tooltip ─────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('radar-tooltip');

function canvasCoords(cx, cy) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (cx - rect.left) * (CW / rect.width),
    y: (cy - rect.top)  * (CH / rect.height),
  };
}

function hitTest(mx, my) {
  const ex = EXAMPLES[activeEx];
  // Test blips (respect filter in 6a)
  if(ex.blips) {
    for(const t of ex.blips) {
      if(!visibleBlip(t)) continue;
      const p = polarXY(t.bearing, t.range);
      const hr = Math.max(t.size*0.7, 16);
      if((mx-p.x)**2+(my-p.y)**2 <= hr*hr) return {kind:'blip',data:t};
    }
  }
  // Test subsidiaries
  if(ex.showSubsidiaries && ex.subsidiaries) {
    for(const s of ex.subsidiaries) {
      const p = polarXY(s.bearing, s.range);
      if((mx-p.x)**2+(my-p.y)**2 <= 18*18) return {kind:'subsidiary',data:s};
    }
  }
  // Test issues (respect filter in 6a)
  if(ex.issues && ex.issues.length) {
    for(const i of ex.issues) {
      if(!visibleIssue(i)) continue;
      const p = polarXY(i.bearing, ISSUE_RANGE);
      if((mx-p.x)**2+(my-p.y)**2 <= 18*18) return {kind:'issue',data:i};
    }
  }
  return null;
}

function vcls(v) {
  if(v==='High'||v==='high') return 'high';
  if(v==='Medium'||v==='medium') return 'medium';
  if(v==='Low'||v==='low') return 'low';
  if(parseFloat(v)<0) return 'pos';
  return '';
}

function showTip(hit, mx, my) {
  const d = hit.data;
  let color, badgeClass, badgeText;

  const pestleNames = {P:'Political',E:'Economic',S:'Social',T:'Technology',L:'Legal',En:'Environmental'};
  if(hit.kind==='issue') {
    color = d.pestle ? PESTLE_COLOR[d.pestle] : '#29b6f6';
    badgeClass='issue';
    badgeText = d.pestle ? `Issue · ${pestleNames[d.pestle]}` : 'Active Issue';
  } else if(hit.kind==='subsidiary') {
    color=d.color; badgeClass='subsidiary'; badgeText='Subsidiary';
  } else {
    const isOpp=d.type==='opportunity', isKRI=d.type==='kri';
    color = d.pestle ? PESTLE_COLOR[d.pestle] : isOpp?'#26a69a':isKRI?'#7986cb':'#ef5350';
    const typeLabel = isOpp?'Opportunity':isKRI?'KRI Indicator':'Threat';
    badgeClass = isOpp?'opportunity':isKRI?'kri':'threat';
    badgeText  = d.pestle ? `${typeLabel} · ${pestleNames[d.pestle]}` : typeLabel;
  }

  document.getElementById('tt-dot').style.background = color;
  document.getElementById('tt-label').textContent = d.label || d.name || '';
  const badge = document.getElementById('tt-badge');
  badge.textContent = badgeText; badge.className = `tt-badge ${badgeClass}`;

  // Build grid cells
  const grid = document.getElementById('tt-grid');
  grid.innerHTML = '';

  function cell(label, value, cls) {
    return `<div class="tt-cell"><div class="tt-cell-label">${label}</div><div class="tt-cell-value ${cls||''}">${value}</div></div>`;
  }

  if(hit.kind==='issue') {
    grid.innerHTML =
      cell('Status','Confirmed','high') +
      cell('Category', d.pestle ? pestleNames[d.pestle] : '—') +
      cell('Onset', d.onset||'—') +
      cell('Resolution', d.resolution||'—');
    // Show action as rationale
    document.getElementById('tt-rationale').textContent = d.action || '';
  } else if(hit.kind==='subsidiary') {
    const dev = (EXAMPLES[activeEx].showNorthDelta && d.newDeviation!=null) ? d.newDeviation : d.bearing;
    const devStr = dev>0 ? `+${dev}°` : `${dev}°`;
    grid.innerHTML =
      cell('Bearing', devStr, dev>45?'high':dev>20?'medium':'low') +
      cell('Weight', d.weight||'—') +
      cell('Revenue', d.revenue||'—') +
      (d.cascadeWeight!=null ? cell('Cascade wt', d.cascadeWeight) : cell('Issue', d.issue?'Yes':'No', d.issue?'high':'low'));
  } else {
    grid.innerHTML =
      cell('Magnitude', d.magnitude||'—', vcls(d.magnitude)) +
      cell('Direction', d.direction||'—') +
      (d.completeness ? cell('Completeness', d.completeness) : '') +
      (d.capability   ? cell('Capability', d.capability, vcls(d.capability)) : '');
  }

  document.getElementById('tt-bearing').textContent   = d.bearing_effect || '';
  document.getElementById('tt-rationale').textContent = d.rationale || '';

  const TW=280, TH=240, vw=window.innerWidth, vh=window.innerHeight;
  let left=mx+16, top=my-20;
  if(left+TW>vw-12) left=mx-TW-12;
  if(top+TH>vh-12) top=vh-TH-12;
  if(top<8) top=8;
  tooltip.style.left=left+'px'; tooltip.style.top=top+'px';
  tooltip.classList.add('visible');
}

function hideTip() { tooltip.classList.remove('visible'); }

canvas.addEventListener('mousemove', e => {
  const {x,y}=canvasCoords(e.clientX,e.clientY);
  const hit=hitTest(x,y);
  if(hit){ canvas.style.cursor='pointer'; showTip(hit,e.clientX,e.clientY); }
  else   { canvas.style.cursor='';        hideTip(); }
});
canvas.addEventListener('mouseleave', hideTip);

// ─── Resize ───────────────────────────────────────────────────────────────────
function resizeCanvas() {
  const panel = document.getElementById('radar-panel');
  const avail = Math.min(panel.clientWidth - 32, panel.clientHeight - 32);
  const sz = Math.max(280, Math.min(660, avail));
  canvas.style.width  = sz+'px';
  canvas.style.height = sz+'px';
}

window.addEventListener('resize', () => { resizeCanvas(); renderRadar(); });

// ─── Example switching ────────────────────────────────────────────────────────
function setEx(n) {
  activeEx = n;
  document.querySelectorAll('.ex-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.ex === String(n));
  });
  // Show PESTLE filter bar only for 6a
  document.getElementById('pestle-bar').classList.toggle('visible', n === '6a');
  hideTip();
  renderRadar();
  if(activeTab === 'analysis') renderInfo();
  else renderChat();
}

document.querySelectorAll('.ex-btn').forEach(b => {
  b.addEventListener('click', () => {
    const v = b.dataset.ex;
    setEx(v === '6a' ? '6a' : parseInt(v));
  });
});

// ─── PESTLE filter wiring ────────────────────────────────────────────────────
function syncFilterButtons() {
  document.querySelectorAll('.pf-btn[data-pestle]').forEach(b => {
    const k = b.dataset.pestle;
    const isType = k.startsWith('type-');
    const active = isType ? typeActive[k.replace('type-','')] : pestleActive[k];
    b.classList.toggle('off', !active);
  });
}

document.querySelectorAll('.pf-btn[data-pestle]').forEach(b => {
  b.addEventListener('click', () => {
    const k = b.dataset.pestle;
    if(k.startsWith('type-')) {
      const t = k.replace('type-','');
      typeActive[t] = !typeActive[t];
    } else {
      pestleActive[k] = !pestleActive[k];
    }
    syncFilterButtons();
    renderRadar();
  });
});

document.getElementById('pf-all-btn').addEventListener('click', () => {
  ['P','E','S','T','L','En'].forEach(k => pestleActive[k] = true);
  ['threat','opportunity','issue'].forEach(k => typeActive[k] = true);
  syncFilterButtons();
  renderRadar();
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
resizeCanvas();
renderRadar();
renderInfo();
</script>
</body>
</html>
