<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Radar — Strategic Navigation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e1a;
      color: #e0e6f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Toolbar */
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: #0d1220;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #4fc3f7;
      text-transform: uppercase;
    }

    .scenario-switcher {
      display: flex;
      gap: 8px;
    }

    .scenario-btn {
      padding: 6px 16px;
      background: #1a2235;
      border: 1px solid #2a3550;
      border-radius: 4px;
      color: #8a9bb5;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .scenario-btn:hover { border-color: #4fc3f7; color: #e0e6f0; }
    .scenario-btn.active { background: #1a3a5c; border-color: #4fc3f7; color: #4fc3f7; }

    /* Main layout */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Radar panel */
    #radar-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 20px;
      gap: 16px;
    }

    #radar-canvas {
      max-width: min(700px, calc(100vh - 160px));
      max-height: min(700px, calc(100vh - 160px));
      width: 100%;
      height: auto;
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(79, 195, 247, 0.08);
    }

    /* Branch controls */
    #branch-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .branch-label {
      font-size: 0.75rem;
      color: #4a5a75;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-right: 4px;
    }

    .branch-btn {
      padding: 5px 14px;
      background: #1a2235;
      border: 1px solid #2a3550;
      border-radius: 20px;
      color: #8a9bb5;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .branch-btn:hover { border-color: #7986cb; color: #e0e6f0; }
    .branch-btn.active { background: #1f2b4a; border-color: #7986cb; color: #b0beff; }

    /* Objectives panel */
    #objectives-panel {
      width: 320px;
      min-width: 280px;
      background: #0d1220;
      border-left: 1px solid #1e2a40;
      padding: 24px 20px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #objectives-panel h2 {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4fc3f7;
      margin-bottom: 4px;
    }

    .objectives-subtitle {
      font-size: 0.75rem;
      color: #4a5a75;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #objectives-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Objective items */
    .obj-item {
      border-radius: 6px;
      overflow: hidden;
    }

    .obj-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.15s;
      background: #131a2e;
      border: 1px solid #1e2a40;
      border-radius: 6px;
    }

    .obj-header:hover { background: #18213a; }
    .obj-header.expanded { border-radius: 6px 6px 0 0; border-bottom-color: transparent; }

    .obj-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.4s;
    }

    .obj-name {
      flex: 1;
      font-size: 0.82rem;
      color: #c8d4e8;
      line-height: 1.3;
    }

    .obj-status {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.4s;
    }

    .obj-expand-icon {
      font-size: 0.6rem;
      color: #4a5a75;
      transition: transform 0.2s;
    }

    .obj-header.expanded .obj-expand-icon { transform: rotate(180deg); }

    /* Sub-objectives */
    .obj-children {
      display: none;
      flex-direction: column;
      gap: 2px;
      background: #0f1624;
      border: 1px solid #1e2a40;
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 4px 8px 8px;
    }

    .obj-children.open { display: flex; }

    .obj-child {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 4px;
    }

    .obj-child-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.4s;
    }

    .obj-child-name {
      flex: 1;
      font-size: 0.77rem;
      color: #8a9bb5;
    }

    .obj-child-status {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      transition: color 0.4s;
    }

    /* Legend */
    #legend {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #1e2a40;
    }

    #legend p {
      font-size: 0.7rem;
      color: #4a5a75;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .legend-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #6a7a95;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Hover tooltip */
    #radar-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      width: 260px;
      background: #0d1525;
      border: 1px solid #2a3a55;
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(79,195,247,0.08);
      display: none;
    }

    #radar-tooltip.visible { display: block; }

    .tt-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tt-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tt-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e0e8f8;
      flex: 1;
    }

    .tt-type {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .tt-type.threat      { background: rgba(239,83,80,0.15); color: #ef5350; border: 1px solid rgba(239,83,80,0.3); }
    .tt-type.opportunity { background: rgba(38,166,154,0.15); color: #26a69a; border: 1px solid rgba(38,166,154,0.3); }

    .tt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tt-cell {
      background: #131e33;
      border-radius: 5px;
      padding: 6px 8px;
      text-align: center;
    }

    .tt-cell-label {
      font-size: 0.62rem;
      color: #4a5a75;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 3px;
    }

    .tt-cell-value {
      font-size: 0.78rem;
      font-weight: 600;
      color: #c8d4e8;
    }

    .tt-cell-value.high     { color: #ef5350; }
    .tt-cell-value.medium   { color: #ffa726; }
    .tt-cell-value.low      { color: #26a69a; }

    .tt-bearing {
      font-size: 0.75rem;
      color: #7986cb;
      margin-bottom: 8px;
      line-height: 1.4;
      padding: 6px 8px;
      background: rgba(121,134,203,0.08);
      border-left: 2px solid #7986cb;
      border-radius: 0 4px 4px 0;
    }

    .tt-rationale {
      font-size: 0.73rem;
      color: #6a7a95;
      line-height: 1.5;
    }

    .tt-objective {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #1e2a40;
      font-size: 0.72rem;
      color: #4a5a75;
    }

    .tt-objective span { color: #8a9bb5; }

    /* Bearing rationale panel */
    #bearing-rationale {
      margin-top: 10px;
      padding: 10px 14px;
      background: #0d1220;
      border: 1px solid #1e2a40;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #6a7a95;
      line-height: 1.55;
      max-width: 560px;
      text-align: center;
    }

    #bearing-rationale strong {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4a5a75;
      margin-bottom: 4px;
    }
  </style>
</head>

        </div>
      </section>
    </main>
  </div>

      { name: 'Innovation Pipeline',    children: ['2 new products in development', 'R&D budget at 15% revenue'] },
      { name: 'Market Positioning',     children: ['Analyst recognition (Gartner/Forrester)', 'Thought leadership content'] },
      { name: 'ESG Commitments',        children: ['Carbon neutral by 2027', 'Diversity targets met'] },
      { name: 'Risk Management',        children: ['Board risk appetite statement', 'Quarterly ERM review cycle'] },
    ];

    const STATUS_LABELS  = ['Strong', 'Moderate', 'Weak', 'Critical'];
    const STATUS_CLASSES = ['strong', 'moderate', 'weak', 'critical'];
    const STATUS_COLORS  = ['#26a69a', '#ffa726', '#ef5350', '#b71c1c'];

    // ─── State ───────────────────────────────────────────────────────────────
    let activeScenario = 'A';
    let activeBranch   = 0;

    // ─── Canvas ──────────────────────────────────────────────────────────────
    const canvas = document.getElementById('radar-canvas');
    const ctx    = canvas.getContext('2d');
    const CX     = canvas.width  / 2;   // 350
    const CY     = canvas.height / 2;   // 350
    const MAX_R  = 300;

    function bearingToAngle(deg) {
      return (deg - 90) * Math.PI / 180;
    }

    function polarPoint(bearing, fraction) {
      const a = bearingToAngle(bearing);
      const r = fraction * MAX_R;
      return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
    }

    function drawBackground() {
      // Base fill
      ctx.beginPath();
      ctx.arc(CX, CY, MAX_R + 2, 0, Math.PI * 2);
      ctx.fillStyle = '#070b14';
      ctx.fill();

      // Radial gradient glow
      const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, MAX_R);
      grad.addColorStop(0,   'rgba(79, 195, 247, 0.06)');
      grad.addColorStop(0.5, 'rgba(79, 195, 247, 0.02)');
      grad.addColorStop(1,   'rgba(0, 0, 0, 0)');
      ctx.beginPath();
      ctx.arc(CX, CY, MAX_R, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Subtle spokes every 30°
      for (let b = 0; b < 360; b += 30) {
        const p = polarPoint(b, 1.0);
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = 'rgba(79, 195, 247, 0.05)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawRangeRings() {
      const rings = [
        { fraction: 0.25, label: '6 months' },
        { fraction: 0.50, label: '1 year'   },
        { fraction: 0.75, label: '2 years'  },
        { fraction: 1.00, label: '5 years'  },
      ];
      rings.forEach(ring => {
        ctx.beginPath();
        ctx.arc(CX, CY, ring.fraction * MAX_R, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(79, 195, 247, 0.14)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = 'rgba(79, 195, 247, 0.35)';
        ctx.font = '10px Segoe UI, system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(ring.label, CX + ring.fraction * MAX_R + 6, CY - 5);
      });
    }

    function drawCompassRose() {
      const cardinals = [
        { bearing: 0,   label: 'N', highlight: true  },
        { bearing: 90,  label: 'E', highlight: false },
        { bearing: 180, label: 'S', highlight: false },
        { bearing: 270, label: 'W', highlight: false },
      ];
      cardinals.forEach(c => {
        const outer = polarPoint(c.bearing, 1.08);
        ctx.fillStyle   = c.highlight ? '#4fc3f7' : 'rgba(79, 195, 247, 0.4)';
        ctx.font        = c.highlight ? 'bold 13px Segoe UI' : '11px Segoe UI';
        ctx.textAlign   = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c.label, outer.x, outer.y);
      });

      // True North label
      ctx.fillStyle   = 'rgba(79, 195, 247, 0.5)';
      ctx.font        = '9px Segoe UI';
      ctx.textAlign   = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('TRUE NORTH', CX, CY - MAX_R - 14);

      // North tick
      ctx.beginPath();
      ctx.moveTo(CX, CY - MAX_R);
      ctx.lineTo(CX, CY - MAX_R - 10);
      ctx.strokeStyle = '#4fc3f7';
      ctx.lineWidth   = 2;
      ctx.stroke();
    }

    function drawCone(branch) {
      const bearing    = branch.projectedBearing;
      const halfAngle  = branch.coneHalfAngle;
      const color      = branch.color;

      // Four time bands — cone widens as range increases
      const bands = [
        { outerFraction: 0.25, innerFraction: 0,    alpha: 0.22 },
        { outerFraction: 0.50, innerFraction: 0.25, alpha: 0.16 },
        { outerFraction: 0.75, innerFraction: 0.50, alpha: 0.10 },
        { outerFraction: 1.00, innerFraction: 0.75, alpha: 0.06 },
      ];

      bands.forEach(band => {
        const outerHalf = halfAngle * band.outerFraction;
        const innerHalf = halfAngle * band.innerFraction;

        const startOuter = bearingToAngle(bearing - outerHalf);
        const endOuter   = bearingToAngle(bearing + outerHalf);
        const startInner = bearingToAngle(bearing - innerHalf);
        const endInner   = bearingToAngle(bearing + innerHalf);

        ctx.beginPath();
        ctx.arc(CX, CY, band.outerFraction * MAX_R, startOuter, endOuter);
        if (band.innerFraction === 0) {
          ctx.lineTo(CX, CY);
        } else {
          ctx.arc(CX, CY, band.innerFraction * MAX_R, endInner, startInner, true);
        }
        ctx.closePath();

        const alphaHex = Math.round(band.alpha * 255).toString(16).padStart(2, '0');
        ctx.fillStyle  = color + alphaHex;
        ctx.fill();
      });

      // Cone boundary lines
      const leftEdge  = polarPoint(bearing - halfAngle, 1.0);
      const rightEdge = polarPoint(bearing + halfAngle, 1.0);

      ctx.setLineDash([4, 5]);
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(leftEdge.x, leftEdge.y);
      ctx.strokeStyle = color + '66';
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(rightEdge.x, rightEdge.y);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function drawTrackHistory(scenario) {
      const track = scenario.trackHistory;
      if (track.length < 2) return;

      // Oldest point at outer edge, newest near centre
      const points = track.map((t, i) => {
        const fraction = 0.90 - (i / (track.length - 1)) * 0.82;
        return polarPoint(t.bearing, fraction);
      });

      // Trail line
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      points.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
      ctx.strokeStyle = 'rgba(200, 215, 240, 0.18)';
      ctx.lineWidth   = 1.5;
      ctx.setLineDash([3, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Assessment dots
      points.forEach((p, i) => {
        const alpha = 0.18 + (i / (points.length - 1)) * 0.55;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 215, 240, ${alpha.toFixed(2)})`;
        ctx.fill();
      });

      // Labels
      ctx.fillStyle    = 'rgba(200, 215, 240, 0.3)';
      ctx.font         = '9px Segoe UI';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('−12mo', points[0].x, points[0].y - 5);

      ctx.textBaseline = 'middle';
      ctx.textAlign    = 'left';
      ctx.fillText('Now', points[points.length - 1].x + 6, points[points.length - 1].y);
    }

    function drawBearingArrow(bearing, color) {
      const tip = polarPoint(bearing, 0.84);
      const a   = bearingToAngle(bearing);
      const arrowLen = 14;

      // Shaft
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(tip.x, tip.y);
      ctx.strokeStyle = color;
      ctx.lineWidth   = 2.5;
      ctx.shadowColor = color;
      ctx.shadowBlur  = 8;
      ctx.stroke();
      ctx.shadowBlur  = 0;

      // Arrowhead
      ctx.beginPath();
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(tip.x - arrowLen * Math.cos(a - 0.28), tip.y - arrowLen * Math.sin(a - 0.28));
      ctx.lineTo(tip.x - arrowLen * Math.cos(a + 0.28), tip.y - arrowLen * Math.sin(a + 0.28));
      ctx.closePath();
      ctx.fillStyle  = color;
      ctx.shadowColor = color;
      ctx.shadowBlur  = 6;
      ctx.fill();
      ctx.shadowBlur  = 0;
    }

    function drawThreats(threats) {
      threats.forEach(t => {
        const p     = polarPoint(t.bearing, t.range);
        const isOpp = t.type === 'opportunity';
        const color = isOpp ? '#26a69a' : '#ef5350';
        const glow  = isOpp ? 'rgba(38,166,154,0.25)' : 'rgba(239,83,80,0.25)';

        // Glow halo
        ctx.beginPath();
        ctx.arc(p.x, p.y, t.size * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // Blip
        ctx.beginPath();
        ctx.arc(p.x, p.y, t.size * 0.38, 0, Math.PI * 2);
        ctx.fillStyle   = color;
        ctx.shadowColor = color;
        ctx.shadowBlur  = 6;
        ctx.fill();
        ctx.shadowBlur  = 0;

        // Label
        ctx.fillStyle    = 'rgba(220, 232, 248, 0.7)';
        ctx.font         = '9px Segoe UI';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(t.label, p.x, p.y - t.size * 0.42 - 3);
      });
    }

    function drawOrigin() {
      // Inner pulse rings
      ctx.beginPath();
      ctx.arc(CX, CY, 12, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(79, 195, 247, 0.2)';
      ctx.lineWidth   = 1;
      ctx.stroke();

      // Centre dot
      ctx.beginPath();
      ctx.arc(CX, CY, 5, 0, Math.PI * 2);
      ctx.fillStyle   = '#4fc3f7';
      ctx.shadowColor = '#4fc3f7';
      ctx.shadowBlur  = 10;
      ctx.fill();
      ctx.shadowBlur  = 0;
    }

    function drawBearingInfo(branch) {
      const deg  = Math.round(branch.projectedBearing);
      const absDeg = Math.abs(deg);
      const dir  = deg === 0 ? 'True North' : deg > 0 ? `${absDeg}° east of True North` : `${absDeg}° west of True North`;

      ctx.fillStyle    = branch.color;
      ctx.font         = 'bold 11px Segoe UI';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(`Bearing: ${dir}`, CX, CY + MAX_R + 14);
    }

    function drawScopeBorder() {
      ctx.beginPath();
      ctx.arc(CX, CY, MAX_R, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(79, 195, 247, 0.22)';
      ctx.lineWidth   = 2;
      ctx.stroke();
    }

    function renderRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const scenario = SCENARIOS[activeScenario];
      const branch   = scenario.branches[activeBranch];

      drawBackground();
      drawRangeRings();
      drawCompassRose();
      drawCone(branch);
      drawTrackHistory(scenario);
      drawThreats(scenario.threats);
      drawBearingArrow(branch.projectedBearing, branch.color);
      drawOrigin();
      drawScopeBorder();
      drawBearingInfo(branch);
    }

    // ─── Objectives Panel ─────────────────────────────────────────────────────

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function dotColor(status)  { return STATUS_COLORS[status]; }

    function renderObjectives() {
      const scenario = SCENARIOS[activeScenario];
      const branch   = scenario.branches[activeBranch];
      const list     = document.getElementById('objectives-list');

      // Preserve which items are open
      const openIndexes = new Set(
        [...document.querySelectorAll('.obj-children.open')].map(el => parseInt(el.dataset.index, 10))
      );

      list.innerHTML = '';

      OBJECTIVES.forEach((obj, i) => {
        const status = clamp(scenario.baseObjectiveStatus[i] + branch.objectiveImpact[i], 0, 3);
        const color  = dotColor(status);
        const label  = STATUS_LABELS[status];

        const li = document.createElement('li');
        li.className = 'obj-item';

        const header = document.createElement('div');
        header.className = 'obj-header';
        if (openIndexes.has(i)) header.classList.add('expanded');

        header.innerHTML = `
          <div class="obj-dot" style="background:${color}${status === 3 ? ';box-shadow:0 0 5px ' + color : ''}"></div>
          <span class="obj-name">${obj.name}</span>
          <span class="obj-status" style="color:${color}">${label}</span>
          <span class="obj-expand-icon">▼</span>
        `;

        const children = document.createElement('div');
        children.className = 'obj-children';
        children.dataset.index = i;
        if (openIndexes.has(i)) children.classList.add('open');

        obj.children.forEach((childName, j) => {
          // Odd children get a slight nudge toward parent status to show variation
          const childStatus = clamp(status + (j % 2 === 1 && branch.objectiveImpact[i] < 0 ? 1 : 0), 0, 3);
          const cColor = dotColor(childStatus);
          const cLabel = STATUS_LABELS[childStatus];

          const child = document.createElement('div');
          child.className = 'obj-child';
          child.innerHTML = `
            <div class="obj-child-dot" style="background:${cColor}"></div>
            <span class="obj-child-name">${childName}</span>
            <span class="obj-child-status" style="color:${cColor}">${cLabel}</span>
          `;
          children.appendChild(child);
        });

        header.addEventListener('click', () => {
          const isOpen = children.classList.contains('open');
          document.querySelectorAll('.obj-children.open').forEach(el => el.classList.remove('open'));
          document.querySelectorAll('.obj-header.expanded').forEach(el => el.classList.remove('expanded'));
          if (!isOpen) {
            children.classList.add('open');
            header.classList.add('expanded');
          }
        });

        li.appendChild(header);
        li.appendChild(children);
        list.appendChild(li);
      });
    }

    // ─── Interaction ──────────────────────────────────────────────────────────

    function syncBranchButtons() {
      const scenario = SCENARIOS[activeScenario];
      document.querySelectorAll('.branch-btn').forEach(btn => {
        const idx = parseInt(btn.dataset.branch, 10);
        btn.textContent = scenario.branches[idx].label;
        btn.classList.toggle('active', idx === activeBranch);
      });
    }

    function setActiveScenario(key) {
      activeScenario = key;
      activeBranch   = 0;
      document.querySelectorAll('.scenario-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.scenario === key);
      });
      syncBranchButtons();
      renderRadar();
      renderObjectives();
      renderBearingRationale();
      hideTooltip();
    }

    function setActiveBranch(index) {
      activeBranch = index;
      syncBranchButtons();
      renderRadar();
      renderObjectives();
      renderBearingRationale();
    }

    document.querySelectorAll('.scenario-btn').forEach(btn => {
      btn.addEventListener('click', () => setActiveScenario(btn.dataset.scenario));
    });

    document.querySelectorAll('.branch-btn').forEach(btn => {
      btn.addEventListener('click', () => setActiveBranch(parseInt(btn.dataset.branch, 10)));
    });

    // ─── Responsive canvas ────────────────────────────────────────────────────

    function resizeCanvas() {
      const panel     = document.getElementById('radar-panel');
      const available = Math.min(panel.clientWidth - 40, panel.clientHeight - 100);
      const size      = Math.max(300, Math.min(700, available));
      canvas.style.width  = size + 'px';
      canvas.style.height = size + 'px';
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      renderRadar();
    });

    // ─── Tooltip ─────────────────────────────────────────────────────────────

    const tooltip = document.getElementById('radar-tooltip');

    function valueClass(v) {
      if (v === 'High')   return 'high';
      if (v === 'Medium') return 'medium';
      if (v === 'Low')    return 'low';
      return '';
    }

    // Returns canvas-space coordinates of a blip given the current CSS display size
    function canvasCoords(clientX, clientY) {
      const rect  = canvas.getBoundingClientRect();
      const scaleX = canvas.width  / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top)  * scaleY,
      };
    }

    function hitTestThreats(cx, cy) {
      const scenario = SCENARIOS[activeScenario];
      for (const t of scenario.threats) {
        const p       = polarPoint(t.bearing, t.range);
        const hitR    = Math.max(t.size * 0.7, 16); // generous hit area
        const dx      = cx - p.x;
        const dy      = cy - p.y;
        if (dx * dx + dy * dy <= hitR * hitR) return t;
      }
      return null;
    }

    function showTooltip(t, mouseX, mouseY) {
      const isOpp  = t.type === 'opportunity';
      const color  = isOpp ? '#26a69a' : '#ef5350';

      document.getElementById('tt-dot').style.background = color;
      document.getElementById('tt-label').textContent    = t.label;

      const typeEl = document.getElementById('tt-type');
      typeEl.textContent  = isOpp ? 'Opportunity' : 'Threat';
      typeEl.className    = `tt-type ${t.type}`;

      const lhEl = document.getElementById('tt-likelihood');
      lhEl.textContent  = t.likelihood;
      lhEl.className    = `tt-cell-value ${valueClass(t.likelihood)}`;

      const impEl = document.getElementById('tt-impact');
      impEl.textContent = t.impact;
      impEl.className   = `tt-cell-value ${valueClass(t.impact)}`;

      // Capability: for threats, low capability = high risk = red; invert the colour scale
      const capInvert = { High: 'Low', Medium: 'Medium', Low: 'High' };
      const capEl = document.getElementById('tt-capability');
      capEl.textContent = t.capability;
      capEl.className   = `tt-cell-value ${isOpp ? valueClass(t.capability) : valueClass(capInvert[t.capability])}`;

      document.getElementById('tt-bearing').textContent   = t.bearingEffect;
      document.getElementById('tt-rationale').textContent = t.rationale;
      document.getElementById('tt-objective').textContent = t.objective;
      document.getElementById('tt-horizon').textContent   = t.horizon;

      // Position tooltip: prefer right of cursor, flip left if near right edge
      const TW = 280;
      const TH = 220;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let left = mouseX + 16;
      let top  = mouseY - 20;
      if (left + TW > vw - 12) left = mouseX - TW - 12;
      if (top  + TH > vh - 12) top  = vh - TH - 12;
      if (top < 8)              top  = 8;

      tooltip.style.left = left + 'px';
      tooltip.style.top  = top  + 'px';
      tooltip.classList.add('visible');
    }

    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    canvas.addEventListener('mousemove', e => {
      const { x, y } = canvasCoords(e.clientX, e.clientY);
      const hit = hitTestThreats(x, y);
      if (hit) {
        canvas.style.cursor = 'pointer';
        showTooltip(hit, e.clientX, e.clientY);
      } else {
        canvas.style.cursor = '';
        hideTooltip();
      }
    });

    canvas.addEventListener('mouseleave', hideTooltip);

    // ─── Bearing rationale ────────────────────────────────────────────────────

    function renderBearingRationale() {
      const scenario = SCENARIOS[activeScenario];
      const branch   = scenario.branches[activeBranch];
      document.getElementById('bearing-rationale-text').textContent = branch.bearingRationale;
    }

    // ─── Boot ─────────────────────────────────────────────────────────────────
    resizeCanvas();
    syncBranchButtons();
    renderRadar();
    renderObjectives();
    renderBearingRationale();
  </script>
</body>
</html>
