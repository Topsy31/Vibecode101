<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e0e6f0;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.pf-btn{padding:2px 8px;border-radius:3px;border:1px solid #2e3f58;background:#151f30;cursor:pointer;font-size:.68rem;font-weight:600;color:#c8d8f0;transition:all .15s}
.pf-btn:hover{opacity:.85}
.pf-btn.off{opacity:.25;filter:grayscale(.7)}
#main{display:flex;flex:1;overflow:hidden;min-height:0;position:relative}

canvas{display:block;image-rendering:crisp-edges}
#blade-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:20;background:#0d1b2e;border:1px solid #1e2a40;border-right:none;color:#dd1d21;cursor:pointer;padding:10px 5px;border-radius:5px 0 0 5px;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;writing-mode:vertical-rl;transition:background .15s}
#blade-toggle:hover{background:#1e2a40}
#info-panel{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:90vw;background:#0a0f1c;border-left:1px solid #1e2a40;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;z-index:15}
#info-panel.open{transform:translateX(0)}
.tab-bar{display:flex;border-bottom:1px solid #1e2a40;flex-shrink:0}
.tab-btn{flex:1;padding:8px 4px;background:none;border:none;border-bottom:2px solid transparent;color:#4a6080;cursor:pointer;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:all .15s}
.tab-btn:hover{color:#e0e6f0}
.tab-btn.active{color:#dd1d21;border-bottom-color:#dd1d21}
.tab-content{display:none;flex:1;overflow-y:auto;padding:16px}

.tab-content::-webkit-scrollbar{width:4px}
.tab-content::-webkit-scrollbar-track{background:#0a0e1a}

.info-header{margin-bottom:14px}
.info-title{font-size:1rem;font-weight:700;color:#fff;margin-bottom:3px}
.info-subtitle{font-size:.72rem;color:#5a7090;line-height:1.4}
.status-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.status-active{background:rgba(239,83,80,.18);color:#ef5350;border:1px solid rgba(239,83,80,.35)}
.status-elevated{background:rgba(255,152,0,.18);color:#ffa726;border:1px solid rgba(255,152,0,.35)}

.info-section{margin-bottom:14px}
.info-section-head{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#4a6080;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #1e2a40}
.info-body{font-size:.75rem;color:#8090a8;line-height:1.55}
.bearing-stat{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid #131c2e}
.bearing-label{font-size:.72rem;color:#7a90a8}
.bearing-value{font-size:1.1rem;font-weight:800;color:#fff;font-family:monospace}
.risk-list{list-style:none;display:flex;flex-direction:column;gap:5px}

.risk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.risk-name{flex:1;color:#c8d8f0}
.risk-rank{font-size:.65rem;color:#5a7090;white-space:nowrap}
.source-cite{font-size:.65rem;color:#3a5060;font-style:italic;margin-top:3px}
.conf-badge{display:inline-block;padding:1px 6px;border-radius:2px;font-size:.62rem;font-weight:700;text-transform:uppercase;margin-left:5px}
.conf-high{background:rgba(102,187,106,.15);color:#66bb6a;border:1px solid rgba(102,187,106,.3)}
.conf-medium{background:rgba(255,152,0,.15);color:#ffa726;border:1px solid rgba(255,152,0,.3)}
.conf-low{background:rgba(239,83,80,.15);color:#ef5350;border:1px solid rgba(239,83,80,.3)}
.causal-chain{background:#0d1525;border:1px solid #1a2a3a;border-radius:4px;padding:10px;margin-bottom:8px}
.chain-path{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.chain-node{background:#1a2535;border:1px solid #2a3848;border-radius:3px;padding:2px 7px;font-size:.68rem;color:#c0d0e0}
.chain-arrow{color:#dd1d21;font-size:.8rem;font-weight:700}
.chain-weight{font-size:.6rem;color:#dd1d21;vertical-align:super}
.chain-effect{font-size:.68rem;color:#607080;line-height:1.4}
.kri-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid #0f1825;font-size:.72rem}
.kri-name{color:#8a9fb5}
.kri-val{font-family:monospace;color:#fff;font-size:.7rem}
.kri-trend-up{color:#66bb6a}
.kri-trend-down{color:#ef5350}
.kri-trend-flat{color:#ffa726}
.decision-row{background:#0d1525;border-left:3px solid #dd1d21;padding:8px 10px;margin-bottom:7px;border-radius:0 3px 3px 0}
.decision-bearing{font-size:1.3rem;font-weight:800;color:#60a5fa;font-family:monospace}
.decision-title{font-size:.75rem;font-weight:600;color:#fff;margin-bottom:3px}
.decision-body{font-size:.68rem;color:#607080;line-height:1.4}
.chat-msg{margin-bottom:10px}
.chat-role{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.chat-role.board{color:#60a5fa}
.chat-role.analyst{color:#dd1d21}
.chat-text{font-size:.73rem;color:#8a9fb5;line-height:1.5;background:#0d1525;border-radius:4px;padding:8px}
.diverg-box{margin-top:8px;padding:8px 10px;border-radius:3px;border-left:3px solid;font-size:.7rem;line-height:1.4}
.diverg-box.warn{border-color:#ff9800;background:rgba(255,152,0,.07);color:#ffb74d}
.diverg-box.good{border-color:#4caf50;background:rgba(76,175,80,.07);color:#a5d6a7}
#radar-tooltip{position:fixed;z-index:100;pointer-events:none;width:280px;background:#0d1525;border:1px solid #2a3a52;border-radius:5px;padding:10px 12px;opacity:0;transition:opacity .12s;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#radar-tooltip.visible{opacity:1}
.tt-header{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.tt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tt-label{font-size:.8rem;font-weight:700;color:#fff;flex:1}
.tt-badge{font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:10px;text-transform:uppercase}
.tt-badge.threat{background:rgba(239,83,80,.2);color:#ef5350;border:1px solid rgba(239,83,80,.3)}
.tt-badge.opportunity{background:rgba(38,166,154,.2);color:#26a69a;border:1px solid rgba(38,166,154,.3)}
.tt-badge.issue{background:rgba(41,182,246,.2);color:#29b6f6;border:1px solid rgba(41,182,246,.3)}
.tt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.tt-cell{background:#111c2e;border-radius:3px;padding:4px 6px}
.tt-cell-label{font-size:.58rem;color:#4a6080;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.tt-cell-value{font-size:.7rem;color:#c8d8f0;font-weight:600}
.tt-cell-value.high{color:#ef5350}
.tt-cell-value.medium{color:#ffa726}
.tt-cell-value.low{color:#66bb6a}
.tt-bearing{font-size:.68rem;color:#dd1d21;margin-bottom:4px;font-weight:600}
.tt-rationale{font-size:.65rem;color:#6a8090;line-height:1.4;margin-bottom:4px}
.tt-causal{font-size:.65rem;margin-top:5px;padding-top:5px;border-top:1px solid #1a2a3a}
.tt-causal-head{color:#4a6080;font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;font-weight:700}
.tt-causal-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.tt-causal-src{color:#8a9fb5;flex:1}
.tt-causal-delta{font-weight:700}
.tt-causal-delta.pos{color:#ef5350}
.tt-causal-note{font-size:.6rem;color:#4a6080;margin-bottom:4px;line-height:1.3}
</style>

<div id="toolbar">
  <div style="display:flex;flex-direction:column;gap:1px;flex-shrink:0;margin-right:6px">

<div id="filter-bar">
  <span class="fb-label">Type</span>

  <button class="pf-btn" data-cat="opportunity" style="border-color:#26a69a;color:#26a69a">Opportunities</button>

  <button class="pf-btn" data-cat="Strategic"   style="border-color:#ef5350;color:#ef5350">Strategic</button>
  <button class="pf-btn" data-cat="Operational" style="border-color:#a78bfa;color:#a78bfa">Operational</button>

</div>

<div id="main">
  <div id="radar-panel">
    <canvas id="radar" width="660" height="660"></canvas>
  </div>
  <button id="blade-toggle" onclick="toggleBlade()">Analysis</button>
  <section id="info-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="analysis">Analysis</button>
      <button class="tab-btn" data-tab="network">Risk Network</button>
      <button class="tab-btn" data-tab="decisions">Decisions</button>
      <button class="tab-btn" data-tab="chat">Board Q&amp;A</button>
    </div>
    <div class="tab-content active" id="tab-analysis"></div>
    <div class="tab-content" id="tab-network"></div>
    <div class="tab-content" id="tab-decisions"></div>
    <div class="tab-content" id="tab-chat"></div>
  </section>
</div>

<div id="radar-tooltip">
  <div class="tt-header">
    <div class="tt-dot" id="tt-dot"></div>
    <div class="tt-label" id="tt-label"></div>
    <span class="tt-badge" id="tt-badge"></span>
  </div>
  <div class="tt-grid" id="tt-grid"></div>
  <div class="tt-bearing" id="tt-bearing"></div>
  <div class="tt-rationale" id="tt-rationale"></div>
  <div class="tt-causal" id="tt-causal" style="display:none"></div>
</div>

<script>
const CW=660,CH=660,CX=330,CY=330,MAX_R=290;
const SHELL_RED='#dd1d21', SHELL_YELLOW='#fbce07';
const CAT_COLOR={Strategic:'#ef5350',Operational:'#a78bfa',Conduct:'#fbbf24'};
const STATUS_COLOR={active:'#ef5350',elevated:'#ffa726',managed:'#66bb6a',emerging:'#29b6f6'};

function toRad(d){return d*Math.PI/180;}
function bearingToAngle(deg){return toRad(deg-90);}
function polarXY(b,f){const a=bearingToAngle(b),r=f*MAX_R;return{x:CX+r*Math.cos(a),y:CY+r*Math.sin(a)};}
function vcls(v){if(!v)return'';const s=String(v).toLowerCase();if(s==='high'||s==='critical')return'high';if(s==='medium'||s==='moderate')return'medium';if(s==='low')return'low';return'';}

// ── DATA ──────────────────────────────────────────────────────────────────────
// All bearings derived from Shell Annual Report disclosed risk severity language.
// Bearing scale: 0° = True North. Each degree east = deflection from strategic objective.
// High/High severity → 50–65°. High/Med → 38–50°. Med/Med → 25–38°. Low/Med → 15–25°.
// Causal links cite AR2025 pp.125-140 risk interdependency disclosures.
const DATA = {
  north:'Deliver more value with less emissions — world\'s leading integrated energy company, net-zero by 2050',
  status:'elevated',
  statusNote:'Aggregate bearing across 9 principal risks (AR 2025). Climate/ET, Portfolio and Reputation/LTO carry highest combined strategic exposure per Shell\'s own disclosed severity rankings.',
  bearing:42, coneP50:36, coneP80:58, coneHalf:20,
  headline:'Shell navigates a dual mandate — maximise near-term cash returns while accelerating the energy transition — against elevated external headwinds. Aggregate bearing: +42° east of True North.',
  history:[
    {year:2021,bearing:38,status:'elevated',note:'Hague ruling; Russia exposure; Powering Progress launch'},
    {year:2022,bearing:48,status:'elevated',note:'Russia exit; record earnings mask transition risk; Ukraine energy crisis'},
    {year:2023,bearing:44,status:'elevated',note:'CMD 2023 strategy reset; ET execution risk dominant; headcount reduction'},
    {year:2024,bearing:44,status:'elevated',note:'Earnings decline; SPDC sale; cyber elevated; engagement score falls'},
    {year:2025,bearing:42,status:'elevated',note:'Portfolio consolidation; LNG growth central; CSRD in scope'},
  ],
  blips:[
    // ── THREATS ──
    {label:'Climate/ET',bearing:52,range:.56,size:16,type:'threat',cat:'Strategic',
     severity:'High/High',arYear:'AR2025 p.128',confidence:'Medium',
     bearing_effect:'Highest strategic exposure. Regulatory, commercial, societal/litigation and physical sub-risks simultaneously active.',
     rationale:'Shell discloses Climate/ET as a principal risk across four dimensions: commercial demand destruction, regulatory (CSRD, carbon pricing), societal/litigation (Milieudefensie Hague ruling), and physical asset damage. NCI 71 gCO2e/MJ (2024); target –15–20% by 2030. Source: AR 2025 p.128.',
     causes:[{label:'Portfolio Risk',delta:'+0.20',note:'ET pace determines portfolio stranding — long-payback assets face accelerated impairment if transition accelerates (AR 2025 p.126)'}],
     caused_by:[{label:'Litigation & Regulatory',delta:'+0.18',note:'Climate litigation and CSRD obligations are regulatory transmission mechanisms that amplify ET risk (AR 2025 p.135)'}]},

    {label:'Portfolio Risk',bearing:46,range:.45,size:14,type:'threat',cat:'Strategic',
     severity:'High/Med',arYear:'AR2025 p.126',confidence:'High',
     bearing_effect:'Macro price volatility and competitive pressure dominate near-term. LNG FID execution risk elevated.',
     rationale:'Sub-risks: macro/commodity price, competitive forces, capital projects, country/JV risk, technology transition. Adj Earnings: $40bn (2022) → $18.5bn (2024). CFFO: $68.4bn (2022) → $42.9bn (2024). SPDC Nigeria divested Mar 2025. Source: AR 2025 p.126.',
     causes:[{label:'Financial Risk',delta:'+0.18',note:'Portfolio price volatility directly drives earnings volatility and Financial framework stress (AR 2025 p.131)'}],
     caused_by:[{label:'Climate/ET',delta:'+0.20',note:'Accelerating ET creates stranded-asset risk within Portfolio — the binding constraint on capital allocation (AR 2025 p.128)'}]},

    {label:'Litigation & Reg',bearing:42,range:.50,size:12,type:'threat',cat:'Conduct',
     severity:'High/High',arYear:'AR2025 p.135',confidence:'Medium',
     bearing_effect:'Hague appeal pending. CSRD in scope 2025. 343 confirmed Code of Conduct breaches 2024. 110 employees dismissed.',
     rationale:'Milieudefensie v Royal Dutch Shell (2021): District Court ordered 45% Scope 1-3 reduction by 2030. Shell appealing. EU CSRD now applies to Shell plc. 2,025 Code of Conduct reports received; 343 confirmed breaches; 110 dismissed. Source: AR 2025 pp.125, 135.',
     causes:[{label:'Reputation/LTO',delta:'+0.15',note:'Regulatory enforcement and court rulings directly amplify reputational risk and erode social licence (AR 2025 p.136)'}],
     caused_by:[{label:'Climate/ET',delta:'+0.18',note:'ET regulatory tightening (CSRD, carbon pricing) is the primary driver of litigation risk growth (AR 2025 p.128, 135)'}]},

    {label:'Reputation/LTO',bearing:45,range:.40,size:13,type:'threat',cat:'Strategic',
     severity:'Med/High',arYear:'AR2025 p.136',confidence:'Low',
     bearing_effect:'Engagement score declined to 75 (2024) from 79 (2023); benchmark 80. NGO/investor pressure increasing. SPDC sale reduces one LTO exposure.',
     rationale:'Shell discloses Reputation and Licence to Operate as a principal risk. People Survey score 75 in 2024 (benchmark 80). SPDC Nigeria divested Mar 2025. Brand value ~$48bn. "Too fast / too slow" transition creates simultaneous reputation risk from both directions. Source: AR 2025 p.136, AR 2024 pp.114-121.',
     causes:[{label:'People & Culture',delta:'+0.12',note:'Declining employee engagement undermines internal culture — a Reputation/LTO sub-risk (AR 2025 p.136)'}],
     caused_by:[{label:'Litigation & Reg',delta:'+0.15',note:'Court rulings and enforcement are primary LTO amplifiers (AR 2025 p.135)'}]},

    {label:'IT/Cyber',bearing:40,range:.46,size:11,type:'threat',cat:'Operational',
     severity:'Med/High',arYear:'AR2025 p.134',confidence:'Low',
     bearing_effect:'Elevated to standalone principal risk. AI risks added in 2025. OT/IT convergence at LNG and chemicals parks creates industrial cyber exposure.',
     rationale:'IT/Cyber first disclosed as standalone principal risk in 2023. AI risks formally added in AR 2025. T-Pulse AI safety system at 26 sites (20,000+ alerts; 1,300+ harm-preventing interventions in 2024). "A cyberattack on our OT systems could result in an HSSE incident" — AR 2025 p.134. No public quantitative KRI for cyber incidents.',
     causes:[{label:'HSSE',delta:'+0.15',note:'Cyberattack on OT systems is a disclosed pathway to HSSE incidents — explicitly stated in AR 2025 p.134'}],
     caused_by:[]},

    {label:'HSSE',bearing:35,range:.34,size:12,type:'threat',cat:'Operational',
     severity:'High/High',arYear:'AR2025 p.133',confidence:'High',
     bearing_effect:'Goal Zero unachieved. 2 contractor fatalities 2024. Process safety events up to 90 Tier 1+2 (from 63 in 2023). SIF-F improved to 1.5.',
     rationale:'2 contractor fatalities in 2024 (Netherlands, India). 90 Tier 1+2 process safety events (up 43% from 63 in 2023; increase concentrated in Downstream/RES). Operational spills 1.23kt (vs 0.37kt 2023, partly due to Gulf of America storm). SIF-F improved from 2.6 (2023) to 1.5 (2024). Data externally assured by LRQA Group Ltd. Source: AR 2025 p.133.',
     causes:[{label:'Reputation/LTO',delta:'+0.12',note:'HSSE incidents directly damage Shell\'s social licence — disclosed causal pathway (AR 2025 p.133, 136)'}],
     caused_by:[{label:'IT/Cyber',delta:'+0.15',note:'OT cyberattack is a disclosed pathway to HSSE incidents (AR 2025 p.134)'}]},

    {label:'Trading Risk',bearing:30,range:.40,size:10,type:'threat',cat:'Conduct',
     severity:'Med/Med',arYear:'AR2025 p.132',confidence:'Medium',
     bearing_effect:'Commodity price volatility, compliance and conduct risk managed within FCA/CFTC regulated framework. 2022 Russia/Ukraine crisis created unprecedented market stress.',
     rationale:'Sub-risks: commodity price/market risk, compliance, conduct. Chief Compliance Officer reports to FCA (UK) and CFTC (US). Trading & Supply Compliance Manual. 2022: 194 LNG cargoes diverted to Europe in energy crisis. Source: AR 2025 p.132.',
     causes:[],
     caused_by:[{label:'Financial Risk',delta:'+0.10',note:'Commodity price volatility in Trading is a Financial risk sub-component (AR 2025 p.131-132)'}]},

    {label:'Financial Risk',bearing:28,range:.38,size:10,type:'threat',cat:'Operational',
     severity:'Med/Low',arYear:'AR2025 p.131',confidence:'High',
     bearing_effect:'Well-managed. Net debt $53bn (2021) → $38.3bn (2024). AA credit rating maintained. Liquidity strong.',
     rationale:'Sub-risks: liquidity, FX, credit, pension. Net debt: $53bn (2021) → $44.8bn (2022) → $38.3bn (2024). CFFO: $45.1bn (2021) → $68.4bn (2022) → $42.9bn (2024). AA credit rating maintained. Gearing ratio declined from 23% (2021) to 17% (2024). Source: AR 2025 p.131, AR 2022 pp.29-35.',
     causes:[],
     caused_by:[{label:'Portfolio Risk',delta:'+0.18',note:'Portfolio earnings volatility is primary driver of financial framework stress (AR 2025 p.126, 131)'}]},

    {label:'People & Culture',bearing:35,range:.42,size:10,type:'threat',cat:'Operational',
     severity:'Med/Med',arYear:'AR2025 p.137',confidence:'Medium',
     bearing_effect:'Standalone risk since 2023. Engagement score 75 (below benchmark 80). Headcount -7k in 2024. ET skills gap widening.',
     rationale:'People Survey 2024: engagement score 75 (down from 79 in 2023; top quartile benchmark = 80). Employees: 82k (2021) → 103k (2023) → 96k (2024). Turnover 7.6% (2024). 3,156 experienced hires (37% women). Graduate intake 57% women. 264k training days. Source: AR 2025 p.137, AR 2024 pp.114-121.',
     causes:[{label:'Reputation/LTO',delta:'+0.12',note:'Declining engagement is a disclosed Reputation/LTO sub-risk — internal culture affects external brand (AR 2025 p.136)'}],

  portfolio: ['Portfolio Risk','LNG Growth','Downstream Transform','Financial Risk'],

  financial: ['Financial Risk','Portfolio Risk','Trading Risk'],
  trading:   ['Trading Risk','Financial Risk'],
  hsse:      ['HSSE','IT/Cyber','Reputation/LTO'],
  cyber:     ['IT/Cyber','HSSE','Reputation/LTO'],
  legal:     ['Litigation & Reg','Climate/ET','Reputation/LTO'],

  people:    ['People & Culture','Reputation/LTO','HSSE'],
};

let activeView='all', bladeOpen=false, activeTab='analysis';
let hiddenCats=new Set();
const canvas=document.getElementById('radar');
const ctx=canvas.getContext('2d');
let hitRegistry=[];

function registerHit(x,y,r,data,kind){hitRegistry.push({x,y,r,data,kind});}
function hitTest(x,y){for(let i=hitRegistry.length-1;i>=0;i--){const h=hitRegistry[i];if(Math.hypot(x-h.x,y-h.y)<=h.r)return h;}return null;}
function canvasCoords(cx,cy){const r=canvas.getBoundingClientRect(),sx=CW/r.width,sy=CH/r.height;return{x:(cx-r.left)*sx,y:(cy-r.top)*sy};}

function drawRadar(){
  hitRegistry=[];
  ctx.clearRect(0,0,CW,CH);

  // Background
  const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,MAX_R+20);
  bg.addColorStop(0,'#0d1628');bg.addColorStop(1,'#060c18');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(CX,CY,MAX_R+20,0,Math.PI*2);ctx.fill();

  // Rings
  const horizons=['Now','Near (1–3y)','Mid (3–7y)','Long (7–15y)'];
  for(let i=1;i<=4;i++){
    const r=(MAX_R*i)/4;
    ctx.strokeStyle=i===4?'rgba(221,29,33,.18)':'rgba(255,255,255,.06)';
    ctx.lineWidth=i===4?1.5:.75;
    ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.font='10px Segoe UI';ctx.textAlign='left';
    const lp=polarXY(8,i/4);ctx.fillText(horizons[i-1],lp.x+2,lp.y-2);
  }

  // Bearing lines
  for(let a=0;a<360;a+=30){
    const rad=bearingToAngle(a);
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+(MAX_R+2)*Math.cos(rad),CY+(MAX_R+2)*Math.sin(rad));ctx.stroke();
  }

  // East threat shading
  ctx.save();ctx.globalAlpha=.05;ctx.fillStyle=SHELL_RED;
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,MAX_R,bearingToAngle(0),bearingToAngle(90));ctx.closePath();ctx.fill();
  ctx.restore();

  // True North
  ctx.strokeStyle='rgba(251,206,7,.5)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX,CY-MAX_R-10);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=SHELL_YELLOW;ctx.font='bold 13px Segoe UI';ctx.textAlign='center';
  ctx.fillText('N',CX,CY-MAX_R-14);

  // Filter blips for active view
  let blips=DATA.blips;
  if(activeView!=='all'&&VIEW_FOCUS[activeView]){
    const focus=VIEW_FOCUS[activeView];
    blips=blips.filter(b=>focus.some(f=>b.label.startsWith(f.slice(0,6))));
  }
  blips=blips.filter(b=>{
    if(b.type==='threat'&&hiddenCats.has('threat'))return false;
    if(b.type==='opportunity'&&hiddenCats.has('opportunity'))return false;
    if(b.cat&&hiddenCats.has(b.cat))return false;
    return true;
  });

  // Bearing cone (from threat blips average)
  const threats=blips.filter(b=>b.type==='threat');
  const aggBearing=threats.length?threats.reduce((s,b)=>s+b.bearing,0)/threats.length:DATA.bearing;
  drawCone(aggBearing,DATA.coneHalf);
  drawHistoryTrack(DATA.history);
  blips.forEach(b=>drawBlip(b));
  if(!hiddenCats.has('issue'))DATA.issues.forEach(iss=>drawIssueDot(iss));
  drawBearingArrow(aggBearing);
  drawBearingLabel(aggBearing);

  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CX,CY,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=SHELL_RED;ctx.beginPath();ctx.arc(CX,CY,1.5,0,Math.PI*2);ctx.fill();
}

function drawCone(bearing,half){
  ctx.save();
  ctx.globalAlpha=.09;ctx.fillStyle=SHELL_RED;
  ctx.beginPath();ctx.moveTo(CX,CY);
  ctx.arc(CX,CY,MAX_R*.9,bearingToAngle(bearing-half),bearingToAngle(bearing+half));
  ctx.closePath();ctx.fill();
  ctx.globalAlpha=.16;ctx.fillStyle=SHELL_RED;
  ctx.beginPath();ctx.moveTo(CX,CY);
  ctx.arc(CX,CY,MAX_R*.58,bearingToAngle(bearing-half*.5),bearingToAngle(bearing+half*.5));
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawHistoryTrack(history){
  if(!history||history.length<2)return;
  const OUTER=MAX_R,INNER=MAX_R-12,LABEL_R=MAX_R+20;
  const groups=[];
  history.forEach(h=>{
    const prev=groups[groups.length-1];
    if(prev&&prev.bearing===h.bearing){prev.endYear=h.year;}
    else{groups.push({...h,startYear:h.year,endYear:h.year});}
  });
  ctx.save();ctx.strokeStyle='rgba(221,29,33,.3)';ctx.lineWidth=1;ctx.setLineDash([2,3]);
  ctx.beginPath();
  groups.forEach((g,i)=>{
    const mid=(OUTER+INNER)/2,a=bearingToAngle(g.bearing);
    const x=CX+mid*Math.cos(a),y=CY+mid*Math.sin(a);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
  ctx.font='bold 9px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';
  groups.forEach(g=>{
    const a=bearingToAngle(g.bearing),sc=STATUS_COLOR[g.status]||'#ffa726';
    const s=String(g.startYear).slice(2),e=String(g.endYear).slice(2);
    const lbl=s===e?s:`${s}–${e}`;
    const ox=CX+OUTER*Math.cos(a),oy=CY+OUTER*Math.sin(a);
    const ix=CX+INNER*Math.cos(a),iy=CY+INNER*Math.sin(a);
    ctx.strokeStyle=sc;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ix,iy);ctx.lineTo(ox,oy);ctx.stroke();
    ctx.fillStyle=sc;ctx.beginPath();ctx.arc(ix,iy,2.5,0,Math.PI*2);ctx.fill();
    const lx=CX+LABEL_R*Math.cos(a),ly=CY+LABEL_R*Math.sin(a);
    ctx.lineWidth=3;ctx.strokeStyle='#060c18';ctx.strokeText(lbl,lx,ly);
    ctx.fillStyle=sc;ctx.fillText(lbl,lx,ly);
  });
  ctx.textBaseline='alphabetic';
}

function drawBlip(b){
  const pos=polarXY(b.bearing,b.range);
  const r=b.size||10;
  const col=CAT_COLOR[b.cat]||(b.type==='opportunity'?'#26a69a':'#ef5350');
  ctx.save();
  if(b.type==='opportunity'){
    ctx.fillStyle=col+'30';ctx.strokeStyle=col;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(pos.x,pos.y-r);ctx.lineTo(pos.x+r,pos.y);
    ctx.lineTo(pos.x,pos.y+r);ctx.lineTo(pos.x-r,pos.y);ctx.closePath();
    ctx.fill();ctx.stroke();
  } else {
    const grad=ctx.createRadialGradient(pos.x-r*.3,pos.y-r*.3,0,pos.x,pos.y,r);
    grad.addColorStop(0,col+'cc');grad.addColorStop(1,col+'44');
    ctx.fillStyle=grad;ctx.strokeStyle=col;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(pos.x,pos.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.strokeStyle=col+'40';ctx.lineWidth=.8;
    ctx.beginPath();ctx.arc(pos.x,pos.y,r+4,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 8px Segoe UI';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const abbr=b.label.split(/[\s\/]/)[0].slice(0,4);
  ctx.fillText(abbr,pos.x,pos.y);
  ctx.textBaseline='alphabetic';ctx.restore();
  registerHit(pos.x,pos.y,r+5,b,b.type);
}

function drawIssueDot(iss){
  const pos=polarXY(iss.bearing,0.13);
  const col=STATUS_COLOR.active;
  ctx.save();
  ctx.fillStyle=col+'50';ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(pos.x,pos.y,7,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(pos.x,pos.y,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
  registerHit(pos.x,pos.y,12,iss,'issue');
}

function drawBearingArrow(bearing){
  const a=bearingToAngle(bearing);
  const tip=polarXY(bearing,.88);
  const sx=CX+20*Math.cos(a),sy=CY+20*Math.sin(a);
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tip.x,tip.y);ctx.stroke();
  const hl=10,ha=.38;
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.beginPath();ctx.moveTo(tip.x,tip.y);
  ctx.lineTo(tip.x-hl*Math.cos(a-ha),tip.y-hl*Math.sin(a-ha));
  ctx.lineTo(tip.x-hl*Math.cos(a+ha),tip.y-hl*Math.sin(a+ha));
  ctx.closePath();ctx.fill();
}

function drawBearingLabel(bearing){
  const pos=polarXY(bearing,.58);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 22px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#000';ctx.shadowBlur=8;
  ctx.fillText(Math.round(bearing)+'°',pos.x,pos.y);
  ctx.shadowBlur=0;ctx.textBaseline='alphabetic';
}

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
const tooltip=document.getElementById('radar-tooltip');
function showTip(hit,mx,my){
  const d=hit.data;
  let color,badgeClass,badgeText;
  if(hit.kind==='issue'){color=STATUS_COLOR.active;badgeClass='issue';badgeText='Active Issue';}
  else if(hit.kind==='opportunity'){color='#26a69a';badgeClass='opportunity';badgeText=`Opportunity · ${d.cat||''}`;}
  else{color=CAT_COLOR[d.cat]||'#ef5350';badgeClass='threat';badgeText=`Threat · ${d.cat||''}`;}
  document.getElementById('tt-dot').style.background=color;
  document.getElementById('tt-label').textContent=d.label||'';
  const badge=document.getElementById('tt-badge');
  badge.textContent=badgeText;badge.className=`tt-badge ${badgeClass}`;
  const grid=document.getElementById('tt-grid');grid.innerHTML='';
  function cell(l,v,cls){return`<div class="tt-cell"><div class="tt-cell-label">${l}</div><div class="tt-cell-value ${cls||''}">${v}</div></div>`;}
  if(hit.kind==='issue'){
    grid.innerHTML=cell('Status','Active','high')+cell('Category',d.cat||'—')+cell('Onset',d.onset||'—')+cell('Resolution',(d.resolution||'—').slice(0,30));
    document.getElementById('tt-bearing').textContent='';
    document.getElementById('tt-rationale').textContent=d.action||'';
  } else {
    grid.innerHTML=cell('Severity',d.severity||'—',vcls((d.severity||'').split('/')[0]))+cell('Confidence',d.confidence||'—',vcls(d.confidence))+cell('Source',d.arYear||'—')+cell('Capability',d.capability||'—');
    document.getElementById('tt-bearing').textContent=d.bearing_effect||'';
    document.getElementById('tt-rationale').textContent=d.rationale||'';
  }
  const causalEl=document.getElementById('tt-causal');
  const hasCauses=d.causes&&d.causes.length>0,hasCausedBy=d.caused_by&&d.caused_by.length>0;
  if(hasCauses||hasCausedBy){
    let html='';
    if(hasCausedBy){html+='<div class="tt-causal-head">Driven by</div>';d.caused_by.forEach(e=>{html+=`<div class="tt-causal-row"><span class="tt-causal-src">${e.label}</span><span class="tt-causal-delta pos">${e.delta}</span></div><div class="tt-causal-note">${e.note}</div>`;});}
    if(hasCauses){html+='<div class="tt-causal-head">Drives</div>';d.causes.forEach(e=>{html+=`<div class="tt-causal-row"><span class="tt-causal-src">${e.label}</span><span class="tt-causal-delta pos">${e.delta}</span></div><div class="tt-causal-note">${e.note}</div>`;});}
    causalEl.innerHTML=html;causalEl.style.display='block';
  } else {causalEl.style.display='none';}
  const TW=280,TH=440,vw=window.innerWidth,vh=window.innerHeight;
  let left=mx+16,top=my-20;
  if(left+TW>vw-12)left=mx-TW-12;
  if(top+TH>vh-12)top=vh-TH-12;
  if(top<8)top=8;
  tooltip.style.left=left+'px';tooltip.style.top=top+'px';
  tooltip.classList.add('visible');
}
function hideTip(){tooltip.classList.remove('visible');}
canvas.addEventListener('mousemove',e=>{const{x,y}=canvasCoords(e.clientX,e.clientY);const hit=hitTest(x,y);if(hit){canvas.style.cursor='pointer';showTip(hit,e.clientX,e.clientY);}else{canvas.style.cursor='default';hideTip();}});
canvas.addEventListener('mouseleave',hideTip);
canvas.addEventListener('click',e=>{const{x,y}=canvasCoords(e.clientX,e.clientY);const hit=hitTest(x,y);if(hit&&!bladeOpen)toggleBlade();});

  document.getElementById('info-panel').classList.toggle('open',bladeOpen);

  if(bladeOpen)renderAll();
}
function setTab(name){
  activeTab=name;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+name));
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

function setView(id){
  activeView=id;
  const ids=['all','portfolio','climate','financial','trading','hsse','cyber','legal','reputation','people'];
  document.querySelectorAll('.rtab').forEach((b,i)=>b.classList.toggle('active',ids[i]===id));
  drawRadar();
  if(bladeOpen)renderAll();
}

document.querySelectorAll('.pf-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    const cat=b.dataset.cat;
    if(hiddenCats.has(cat)){hiddenCats.delete(cat);b.classList.remove('off');}
    else{hiddenCats.add(cat);b.classList.add('off');}
    drawRadar();
  });
});

function renderAnalysis(){
  const d=DATA;
  let html=`<div class="info-header">
    <div class="info-title">Shell plc — Principal Risks (2025)</div>
    <div class="info-subtitle" style="margin-top:3px">${statusPill(d.status)}</div>
    <div class="info-subtitle" style="margin-top:6px">${d.statusNote}</div>
  </div>
  <div class="info-section">
    <div class="info-section-head">True North</div>
    <div class="info-body" style="color:#c8d8f0;font-style:italic">"${d.north}"</div>
  </div>
  <div class="info-section">
    <div class="info-section-head">Strategic Bearing</div>
    <div class="bearing-stat"><span class="bearing-label">Current (2025)</span><span class="bearing-value">+${d.bearing}°</span></div>
    <div class="bearing-stat"><span class="bearing-label">P50 expected</span><span class="bearing-value" style="font-size:.9rem;color:#8aa4c8">+${d.coneP50}°</span></div>
    <div class="bearing-stat"><span class="bearing-label">P80 stressed</span><span class="bearing-value" style="font-size:.9rem;color:#ef5350">+${d.coneP80}°</span></div>
    <div class="info-body" style="margin-top:8px">${d.headline}</div>
  </div>`;

  html+=`<div class="info-section"><div class="info-section-head">Active Issues (Now Ring)</div><ul class="risk-list">`;
  d.issues.forEach(i=>{
    html+=`<li><span class="risk-dot" style="background:#ef5350"></span><span class="risk-name">${i.label}</span><span class="risk-rank">${i.onset}</span></li>`;
    html+=`<li style="border:none;padding:2px 0 6px 16px"><span style="font-size:.68rem;color:#5a7090">${i.action}</span></li>`;
  });
  html+=`</ul></div>`;

  const threats=d.blips.filter(b=>b.type==='threat').sort((a,b)=>b.bearing-a.bearing);
  html+=`<div class="info-section"><div class="info-section-head">Principal Threats — East of North</div><ul class="risk-list">`;
  threats.forEach(b=>{
    html+=`<li><span class="risk-dot" style="background:${CAT_COLOR[b.cat]||'#ef5350'}"></span><span class="risk-name">${b.label}</span><span class="risk-rank">${b.bearing}° ${confBadge(b.confidence)}</span></li>`;
    html+=`<li style="border:none;padding:2px 0 6px 16px"><span class="source-cite">${b.arYear}</span></li>`;
  });
  html+=`</ul></div>`;

  const opps=d.blips.filter(b=>b.type==='opportunity');
  html+=`<div class="info-section"><div class="info-section-head">Strategic Opportunities — North-West</div><ul class="risk-list">`;
  opps.forEach(b=>{
    html+=`<li><span class="risk-dot" style="background:#26a69a;border-radius:0"></span><span class="risk-name">${b.label}</span><span class="risk-rank">Capability: ${b.capability||'—'}</span></li>`;
    html+=`<li style="border:none;padding:2px 0 6px 16px"><span class="source-cite">${b.arYear}</span></li>`;
  });
  html+=`</ul></div>`;

  html+=`<div class="info-section"><div class="info-section-head">Key Risk Indicators</div>`;
  d.kris.forEach(k=>{
    const years=Object.keys(k.values).sort();
    const last=years[years.length-1],prev=years[years.length-2];
    const ti=k.trend==='up'?'↑':k.trend==='down'?'↓':'→';
    const tc=k.trend==='up'?'kri-trend-up':k.trend==='down'?'kri-trend-down':'kri-trend-flat';
    html+=`<div class="kri-row"><span class="kri-name">${k.name}</span><span class="kri-val">${k.values[last]} <span class="${tc}">${ti}</span> <span style="font-size:.6rem;color:#3a5060">(${prev}: ${k.values[prev]})</span></span></div>`;
    html+=`<div class="source-cite">${k.source}</div>`;
  });
  html+=`</div>`;

  html+=`<div class="info-section"><div class="info-section-head">Bearing Methodology &amp; Caveats</div>
    <div class="info-body">Bearings derived exclusively from Shell plc Annual Report disclosures 2021–2025. Severity mapping: High/High = 50–65°; High/Med = 38–50°; Med/Med = 25–38°; Low/Med = 15–25°. Each blip cites its AR source page. No editorial inference applied to severity.</div>
    <div class="diverg-box warn" style="margin-top:8px">The aggregate bearing (+${d.bearing}°) is an unweighted directional sum. Shell does not publish a quantified risk weighting. Treat as indicative of risk posture, not a precise measurement. Individual blips carry higher analytical confidence than the aggregate vector.</div>
  </div>`;

  document.getElementById('tab-analysis').innerHTML=html;
}

function renderNetwork(){
  const net=DATA.network;
  let html=`<div class="info-header">
    <div class="info-title">Shell Risk Network</div>
    <div class="info-subtitle">Causal chains derived exclusively from Shell Annual Report risk interdependency disclosures. Every link cites its source. No external network model used.</div>
  </div>
  <div class="info-section"><div class="info-section-head">Network Assessment</div><div class="info-body">${net.headline}</div></div>
  <div class="info-section"><div class="info-section-head">Principal Causal Chains</div>`;
  net.chains.forEach(chain=>{
    html+=`<div class="causal-chain"><div class="chain-path">`;
    chain.path.forEach((node,i)=>{
      html+=`<span class="chain-node">${node}</span>`;
      if(i<chain.path.length-1){const w=chain.weights[i]||1;html+=`<span class="chain-arrow">→<span class="chain-weight">${w}</span></span>`;}
    });
    html+=`</div><div class="chain-effect">${chain.effect}</div></div>`;
  });
  html+=`</div><div class="info-section"><div class="info-section-head">Risk Node Connections</div><ul class="risk-list">`;
  DATA.blips.filter(b=>b.type==='threat').forEach(b=>{
    html+=`<li><span class="risk-dot" style="background:${CAT_COLOR[b.cat]||'#ef5350'}"></span><span class="risk-name">${b.label}</span><span class="risk-rank">${confBadge(b.confidence)}</span></li>`;
    if(b.causes&&b.causes.length)html+=`<li style="border:none;padding:1px 0 2px 16px"><span style="font-size:.65rem;color:#5a7090">Drives: ${b.causes.map(c=>c.label).join(', ')}</span></li>`;
    if(b.caused_by&&b.caused_by.length)html+=`<li style="border:none;padding:1px 0 5px 16px"><span style="font-size:.65rem;color:#4a6080">Driven by: ${b.caused_by.map(c=>c.label).join(', ')}</span></li>`;
  });
  html+=`</ul></div>`;
  html+=`<div class="info-section"><div class="info-section-head">Evidence Basis</div>
    <div class="info-body">All causal links are drawn from Shell Annual Report 2025 pp.125–140 risk interdependency statements. For example: "a cyberattack on our operational technology systems could result in an HSSE incident" (p.134). "Climate/energy transition risk underpins and may amplify all other principal risks" (p.128). No Cytoscape or external model used.</div>
    <div class="source-cite" style="margin-top:5px">Shell AR 2025 pp.125–140; AR 2022 pp.15–26; AR 2021 pp.22–33</div>
  </div>`;
  document.getElementById('tab-network').innerHTML=html;
}

function renderDecisions(){
  let html=`<div class="info-header">
    <div class="info-title">Decision Simulations</div>
    <div class="info-subtitle">Each option modelled as a candidate bearing shift vs. current +${DATA.bearing}°. Source: Shell CMD 2023 and AR 2025 strategy disclosures. Directional approximations only.</div>
  </div><div class="info-section"><div class="info-section-head">Route Options</div>`;
  DATA.decisions.forEach(d=>{
    const delta=d.bearing-DATA.bearing;
    const dstr=delta<=0?`${delta}° improvement`:`+${delta}° increase`;
    html+=`<div class="decision-row">
      <div class="decision-bearing">${d.bearing}°</div>
      <div class="decision-title">${d.title}</div>
      <div style="font-size:.65rem;color:#60a5fa;margin-bottom:4px">Bearing shift: ${dstr}</div>
      <div class="decision-body">${d.body}</div>
    </div>`;
  });
  html+=`</div><div class="info-section"><div class="info-section-head">How to Read</div>
    <div class="info-body">A decision bearing below current +${DATA.bearing}° moves Shell closer to True North. Bearing estimates are directional approximations from disclosed risk language, not quantitative optimisation models.</div>
    <div class="diverg-box good" style="margin-top:8px">All three modelled decisions sit below the current aggregate bearing, consistent with Shell\'s stated strategic direction. Key uncertainty: LNG demand materialisation and Hague ruling outcome on Scope 3 flexibility.</div>
  </div>`;
  document.getElementById('tab-decisions').innerHTML=html;
}

function renderChat(){
  let html=`<div class="info-header"><div class="info-title">Board Q&amp;A</div><div class="info-subtitle">Director-level questions with analyst responses grounded in Shell AR 2021–2025 disclosures.</div></div>`;
  DATA.chat.forEach(m=>{
    html+=`<div class="chat-msg"><div class="chat-role ${m.role}">${m.role==='board'?'Director':'Risk Analyst'}</div><div class="chat-text">${m.text}</div></div>`;
  });
  html+=`<div class="info-section" style="margin-top:12px"><div class="info-section-head">Sources</div><div class="info-body">Shell AR 2025 pp.1–20, 125–140<br>Shell AR 2024 pp.1–20, 107–124<br>Shell AR 2023 pp.98–115<br>Shell AR 2022 pp.1–20, 15–26<br>Shell AR 2021 pp.1–20, 22–33<br>All disclosures: Shell plc only. No third-party data or editorial inference applied.</div></div>`;
  document.getElementById('tab-chat').innerHTML=html;
}

drawRadar();
</script>
</body>
</html>
