<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Radar — WEF Global Risks × SDG Objectives</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0e1a;
      color: #e0e6f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #0d1220;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .brand {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #4fc3f7;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .brand-sub {
      font-size: 0.68rem;
      color: #4a6080;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .sdg-tabs {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }
    .sdg-btn {
      padding: 4px 10px;
      background: #1a2235;
      border: 1px solid #2a3550;
      border-radius: 4px;
      color: #8a9bb5;
      cursor: pointer;
      font-size: 0.75rem;
      white-space: nowrap;
      transition: all 0.18s;
    }
    .sdg-btn:hover { border-color: #4fc3f7; color: #e0e6f0; }
    .sdg-btn.active { background: #1a3a5c; border-color: #4fc3f7; color: #4fc3f7; font-weight: 600; }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: #111927;
      border-bottom: 1px solid #243048;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .fb-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4a6080;
      margin-right: 2px;
    }
    .fb-sep { width: 1px; height: 18px; background: #1e2d42; margin: 0 4px; }
    .pf-btn {
      padding: 3px 9px;
      border-radius: 3px;
      border: 1px solid #2e3f58;
      background: #151f30;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      color: #c8d8f0;
      transition: all 0.15s;
    }
    .pf-btn:hover { opacity: 0.85; }
    .pf-btn.off { opacity: 0.28; filter: grayscale(0.7); }

    /* ── Main layout ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    #radar-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      padding: 16px;
      min-width: 340px;
    }
    canvas { display: block; image-rendering: crisp-edges; }

    /* ── Right panel ── */
    #info-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #1e2a40;
      overflow: hidden;
      min-width: 0;
    }
    .tab-bar {
      display: flex;
      border-bottom: 1px solid #1e2a40;
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 8px 18px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #4a6080;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: #8aa4c8; }
    .tab-btn.active { color: #4fc3f7; border-bottom-color: #4fc3f7; }

    .tab-content { display: none; flex: 1; overflow-y: auto; padding: 20px; }
    .tab-content.active { display: block; }

    /* ── Info panel content ── */
    .info-header { margin-bottom: 16px; }
    .info-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #e0e6f0;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .info-subtitle {
      font-size: 0.75rem;
      color: #4a6080;
      line-height: 1.5;
    }
    .info-section { margin-bottom: 18px; }
    .info-section-head {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a6080;
      margin-bottom: 8px;
      border-bottom: 1px solid #1e2a40;
      padding-bottom: 4px;
    }
    .info-body {
      font-size: 0.78rem;
      color: #8aa4c8;
      line-height: 1.6;
    }
    .bearing-stat {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .bearing-label { font-size: 0.72rem; color: #6a7a95; }
    .bearing-value { font-size: 1.1rem; font-weight: 700; color: #4fc3f7; }

    .risk-list { list-style: none; }
    .risk-list li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px solid #111927;
      font-size: 0.74rem;
    }
    .risk-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .risk-name { flex: 1; color: #8aa4c8; }
    .risk-rank { color: #4a6080; font-size: 0.68rem; }

    .progress-bar-wrap { margin-bottom: 8px; }
    .progress-bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.68rem; color: #6a7a95; margin-bottom: 3px;
    }
    .progress-bar-track {
      height: 6px; background: #1a2235; border-radius: 3px; overflow: hidden;
    }
    .progress-bar-fill { height: 100%; border-radius: 3px; }

    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-on-track   { background: rgba(38,166,154,0.2); color: #26a69a; }
    .status-moderate   { background: rgba(255,193,7,0.2);  color: #ffc107; }
    .status-marginal   { background: rgba(255,167,38,0.2); color: #ffa726; }
    .status-stagnation { background: rgba(120,100,60,0.2); color: #a08050; }
    .status-regression { background: rgba(239,83,80,0.2);  color: #ef5350; }

    .causal-chain { margin-top: 10px; }
    .causal-chain-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-size: 0.72rem;
      padding: 3px 0;
      border-bottom: 1px solid #111927;
    }
    .causal-arrow { color: #2e3f58; font-size: 0.8rem; }
    .causal-node { color: #8aa4c8; flex: 1; }
    .causal-weight {
      font-size: 0.65rem; font-weight: 700;
      padding: 1px 5px; border-radius: 3px;
    }
    .cw-3 { background: rgba(239,83,80,0.25); color: #ef5350; }
    .cw-2 { background: rgba(255,167,38,0.20); color: #ffa726; }
    .cw-1 { background: rgba(74,96,128,0.25); color: #6a7a95; }

    /* ── Chat panel ── */
    .chat-container { display: flex; flex-direction: column; gap: 12px; }
    .chat-msg { display: flex; flex-direction: column; gap: 3px; max-width: 88%; }
    .chat-msg.board { align-self: flex-end; }
    .chat-msg.analyst { align-self: flex-start; }
    .chat-speaker {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .chat-msg.board .chat-speaker { color: #7986cb; text-align: right; }
    .chat-msg.analyst .chat-speaker { color: #26a69a; }
    .chat-bubble {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.76rem;
      line-height: 1.55;
    }
    .chat-msg.board .chat-bubble {
      background: #1a2040;
      border: 1px solid #2a3560;
      color: #c0cce0;
    }
    .chat-msg.analyst .chat-bubble {
      background: #0f1e18;
      border: 1px solid #1a3028;
      color: #a0c8b8;
    }

    /* ── Tooltip ── */
    #radar-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 200;
      width: 290px;
      background: #0d1525;
      border: 1px solid #2a3a55;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.75);
      display: none;
    }
    #radar-tooltip.visible { display: block; }
    .tt-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tt-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .tt-label { font-size: 0.82rem; font-weight: 700; color: #e0e6f0; flex: 1; line-height: 1.3; }
    .tt-badge {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; padding: 2px 6px; border-radius: 3px;
    }
    .tt-badge.threat      { background: rgba(239,83,80,0.2);   color: #ef5350; }
    .tt-badge.opportunity { background: rgba(38,166,154,0.2);  color: #26a69a; }
    .tt-badge.issue       { background: rgba(41,182,246,0.2);  color: #29b6f6; }
    .tt-badge.econ        { background: rgba(33,150,243,0.2);  color: #2196f3; }
    .tt-badge.env         { background: rgba(76,175,80,0.2);   color: #4caf50; }
    .tt-badge.geo         { background: rgba(255,152,0,0.2);   color: #ff9800; }
    .tt-badge.soc         { background: rgba(233,30,99,0.2);   color: #e91e63; }
    .tt-badge.tech        { background: rgba(156,39,176,0.2);  color: #9c27b0; }
    .tt-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 5px; margin-bottom: 8px;
    }
    .tt-cell { background: #111d2e; border-radius: 4px; padding: 5px 7px; }
    .tt-cell-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: #3a5070; margin-bottom: 2px; }
    .tt-cell-value { font-size: 0.75rem; font-weight: 600; color: #c0d0e0; }
    .tt-cell-value.high   { color: #ef5350; }
    .tt-cell-value.medium { color: #ffa726; }
    .tt-cell-value.low    { color: #66bb6a; }
    .tt-bearing { font-size: 0.72rem; color: #7986cb; margin-bottom: 6px; }
    .tt-rationale { font-size: 0.71rem; color: #6a7a95; line-height: 1.5; }
    .tt-causal { margin-top: 8px; border-top: 1px solid #1e2d42; padding-top: 6px; display: none; }
    .tt-causal-head {
      font-size: 0.62rem; text-transform: uppercase;
      letter-spacing: 0.05em; color: #3a5070; margin-bottom: 3px; margin-top: 4px;
    }
    .tt-causal-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.69rem; margin-bottom: 1px;
    }
    .tt-causal-src { color: #7a94b8; }
    .tt-causal-delta { font-weight: 600; font-size: 0.66rem; }
    .tt-causal-delta.pos { color: #ef5350; }
    .tt-causal-delta.neg { color: #26a69a; }
    .tt-causal-note {
      font-size: 0.64rem; color: #3a5070; line-height: 1.4;
      margin-bottom: 3px; padding-left: 4px; border-left: 2px solid #1e2d42;
    }

    /* scrollbars */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #1e2d42; border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────────────────────── -->
<div id="toolbar">
  <div style="display:flex;flex-direction:column;gap:1px;flex-shrink:0;margin-right:8px;">
    <div class="brand">Risk Radar</div>
    <div class="brand-sub">WEF Global Risks × UN Sustainable Development Goals · 2026</div>
  </div>
  <div class="sdg-tabs" id="sdg-tabs">
    <!-- injected by JS -->
  </div>
</div>

<!-- ── Filter bar ────────────────────────────────────────────────────────── -->
<div id="filter-bar">
  <span class="fb-label">WEF Category</span>
  <button class="pf-btn" data-cat="Economic"      style="border-color:#2196f3;color:#2196f3">Economic</button>
  <button class="pf-btn" data-cat="Environmental" style="border-color:#4caf50;color:#4caf50">Environmental</button>
  <button class="pf-btn" data-cat="Geopolitical"  style="border-color:#ff9800;color:#ff9800">Geopolitical</button>
  <button class="pf-btn" data-cat="Societal"      style="border-color:#e91e63;color:#e91e63">Societal</button>
  <button class="pf-btn" data-cat="Technological" style="border-color:#9c27b0;color:#9c27b0">Technological</button>
  <div class="fb-sep"></div>
  <span class="fb-label">Type</span>
  <button class="pf-btn" data-type="threat"      style="border-color:#ef5350;color:#ef5350">Threats</button>
  <button class="pf-btn" data-type="opportunity" style="border-color:#26a69a;color:#26a69a">Opportunities</button>
  <button class="pf-btn" data-type="issue"       style="border-color:#29b6f6;color:#29b6f6">Active Issues</button>
</div>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<div id="main">
  <div id="radar-panel">
    <canvas id="radar" width="660" height="660"></canvas>
  </div>

  <section id="info-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="analysis">Analysis</button>
      <button class="tab-btn"        data-tab="network">Risk Network</button>
      <button class="tab-btn"        data-tab="chat">Board Q&A</button>
    </div>
    <div class="tab-content active" id="tab-analysis"></div>
    <div class="tab-content"        id="tab-network"></div>
    <div class="tab-content"        id="tab-chat"></div>
  </section>
</div>

<!-- ── Tooltip ──────────────────────────────────────────────────────────── -->
<div id="radar-tooltip">
  <div class="tt-header">
    <div class="tt-dot" id="tt-dot"></div>
    <div class="tt-label" id="tt-label"></div>
    <span class="tt-badge" id="tt-badge"></span>
  </div>
  <div class="tt-grid" id="tt-grid"></div>
  <div class="tt-bearing" id="tt-bearing"></div>
  <div class="tt-rationale" id="tt-rationale"></div>
  <div class="tt-causal" id="tt-causal"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONSTANTS & HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const CW = 660, CH = 660, CX = CW/2, CY = CH/2, MAX_R = 290;
const ISSUE_RANGE = 0.10;

const CAT_COLOR = {
  Economic:      '#2196f3',
  Environmental: '#4caf50',
  Geopolitical:  '#ff9800',
  Societal:      '#e91e63',
  Technological: '#9c27b0',
};

// SDG official colours
const SDG_COLOR = {
  1:'#e5243b', 2:'#dda63a', 3:'#4c9f38',  4:'#c5192d',  5:'#ff3a21',
  6:'#26bde2', 7:'#fcc30b', 8:'#a21942',  9:'#fd6925',  10:'#dd1367',
  11:'#fd9d24',12:'#bf8b2e',13:'#3f7e44', 14:'#0a97d9', 15:'#56c02b',
  16:'#00689d',17:'#19486a',
};

function toRad(d) { return d * Math.PI / 180; }
function bearingToAngle(deg) { return toRad(deg - 90); }
function polarXY(bearingDeg, fraction) {
  const a = bearingToAngle(bearingDeg), r = fraction * MAX_R;
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
}
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function vcls(v) {
  if(!v) return '';
  const s = String(v).toLowerCase();
  if(s==='high'||s==='critical') return 'high';
  if(s==='medium'||s==='moderate') return 'medium';
  if(s==='low') return 'low';
  return '';
}

// ═══════════════════════════════════════════════════════════════════════════
// WEF 2016 RISK NETWORK (Cytoscape — assumed extant)
// Source: WEF Global Risks Report 2016, Cytoscape import file
// 29 nodes, 170 directed edges, weight 1–3
// ═══════════════════════════════════════════════════════════════════════════
const WEF_NODES = {
  N1:  { name:'Profound social instability',                     cat:'Societal' },
  N2:  { name:'Large scale involuntary migration',               cat:'Societal' },
  N3:  { name:'Water crisis',                                    cat:'Societal' },
  N4:  { name:'Food crisis',                                     cat:'Societal' },
  N5:  { name:'Spread of infectious disease',                    cat:'Societal' },
  N6:  { name:'Failure of urban planning',                       cat:'Societal' },
  N7:  { name:'Failure of climate-change mitigation & adaptation', cat:'Environmental' },
  N8:  { name:'Extreme weather events',                          cat:'Environmental' },
  N9:  { name:'Natural catastrophes',                            cat:'Environmental' },
  N10: { name:'Biodiversity loss & ecosystem collapse',          cat:'Environmental' },
  N11: { name:'Man-made environmental catastrophe',              cat:'Environmental' },
  N12: { name:'Failure of critical infrastructure',              cat:'Economic' },
  N13: { name:'Unemployment or underemployment',                 cat:'Economic' },
  N14: { name:'Fiscal crisis',                                   cat:'Economic' },
  N15: { name:'Illicit trade',                                   cat:'Economic' },
  N16: { name:'Asset bubble',                                    cat:'Economic' },
  N17: { name:'Energy price shock',                              cat:'Economic' },
  N18: { name:'Unmanageable inflation',                          cat:'Economic' },
  N19: { name:'Deflation',                                       cat:'Economic' },
  N20: { name:'Failure of financial mechanisms',                 cat:'Economic' },
  N21: { name:'Failure of national governance',                  cat:'Geopolitical' },
  N22: { name:'Interstate conflict',                             cat:'Geopolitical' },
  N23: { name:'State collapse or crisis',                        cat:'Geopolitical' },
  N24: { name:'Weapons of mass destruction',                     cat:'Geopolitical' },
  N25: { name:'Terrorist attacks',                               cat:'Geopolitical' },
  N26: { name:'Adverse consequences of technological advances',  cat:'Technological' },
  N27: { name:'Critical information infrastructure breakdown',   cat:'Technological' },
  N28: { name:'Cyberattacks',                                    cat:'Technological' },
  N29: { name:'Data fraud or theft',                             cat:'Technological' },
};

// Directed edges: [source, target, weight]
const WEF_EDGES = [
  ['N1','N13',3],['N1','N23',2],['N1','N2',2],['N1','N21',2],['N1','N4',1],
  ['N1','N3',1],['N1','N6',1],['N1','N18',1],['N1','N14',1],['N1','N20',1],
  ['N1','N22',1],['N1','N29',1],['N1','N27',1],['N1','N11',1],['N1','N7',1],['N1','N8',1],
  ['N2','N5',1],['N2','N20',1],['N2','N15',1],['N2','N21',1],['N2','N25',1],
  ['N2','N22',3],['N2','N23',3],['N2','N7',1],['N2','N10',1],['N2','N8',1],
  ['N2','N9',1],['N2','N3',1],['N2','N4',1],
  ['N3','N5',1],['N3','N21',1],['N3','N22',1],['N3','N20',1],['N3','N7',3],
  ['N3','N10',1],['N3','N8',1],['N3','N4',3],
  ['N4','N5',1],['N4','N18',1],['N4','N17',1],['N4','N13',1],['N4','N22',1],
  ['N4','N23',1],['N4','N26',1],['N4','N7',2],['N4','N11',1],['N4','N8',2],
  ['N4','N10',2],['N4','N9',1],
  ['N5','N6',1],['N5','N26',1],['N5','N12',1],['N5','N7',1],['N5','N11',1],['N5','N9',1],
  ['N6','N13',1],['N6','N21',1],['N6','N27',1],['N6','N12',2],['N6','N7',1],['N6','N8',1],
  ['N7','N8',3],['N7','N9',2],['N7','N6',1],['N7','N17',1],['N7','N19',1],
  ['N7','N21',1],['N7','N11',1],['N7','N10',3],
  ['N8','N9',2],['N8','N14',1],['N8','N12',1],['N8','N11',1],['N8','N10',2],
  ['N9','N12',1],['N9','N27',1],['N9','N11',1],['N9','N10',1],
  ['N10','N21',1],['N10','N15',1],['N10','N11',1],
  ['N11','N21',1],['N11','N15',1],['N11','N26',1],
  ['N12','N14',1],['N12','N21',1],['N12','N13',1],['N12','N25',1],
  ['N12','N29',1],['N12','N28',1],['N12','N27',1],
  ['N13','N21',1],['N13','N17',1],['N13','N18',1],['N13','N14',2],
  ['N13','N16',1],['N13','N19',2],['N13','N15',1],['N13','N20',1],
  ['N13','N25',1],['N13','N26',2],['N13','N22',1],['N13','N23',1],
  ['N14','N17',1],['N14','N18',1],['N14','N16',2],['N14','N19',2],
  ['N14','N20',2],['N14','N29',1],['N14','N21',1],['N14','N23',1],
  ['N15','N16',1],['N15','N20',1],['N15','N25',1],['N15','N28',1],
  ['N15','N22',1],['N15','N23',1],['N15','N21',1],

function blipVisible(b) {

  if(b.cat && !catActive[b.cat]) return false;
  return true;
}

// CANVAS SETUP

const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════════════════════
// DRAWING PRIMITIVES
// ═══════════════════════════════════════════════════════════════════════════
function drawBg() {
  const grad = ctx.createRadialGradient(CX,CY,0,CX,CY,MAX_R);
  grad.addColorStop(0,'rgba(15,25,48,1)');
  grad.addColorStop(1,'rgba(5,8,18,1)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,CW,CH);
}

function drawRings(sdg) {
  // Now ring
  const nr = ISSUE_RANGE * MAX_R;
  ctx.beginPath(); ctx.arc(CX,CY,nr,0,Math.PI*2);
  ctx.strokeStyle='rgba(41,182,246,0.30)'; ctx.lineWidth=1;
  ctx.setLineDash([3,4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(41,182,246,0.5)'; ctx.font='9px Segoe UI';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('Now', CX+nr+4, CY-4);

  // Time horizon rings
  const rings = [
    { r:0.25, label:'2yr' }, { r:0.50, label:'5yr' },
    { r:0.75, label:'10yr' }, { r:1.00, label:'2030+' }
  ];
  rings.forEach(({r,label}) => {
    const pr = r * MAX_R;
    ctx.beginPath(); ctx.arc(CX,CY,pr,0,Math.PI*2);
    ctx.strokeStyle='rgba(79,195,247,0.10)'; ctx.lineWidth=1;
    ctx.setLineDash([2,5]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='rgba(79,195,247,0.35)'; ctx.font='9px Segoe UI';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(label, CX+pr+4, CY-4);
  });
}

function drawCompass(northLabel) {
  const tip = polarXY(0, 1.07);
  ctx.fillStyle='rgba(79,195,247,0.5)'; ctx.font='bold 10px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(northLabel, CX, tip.y-2);
  [0,90,180,270].forEach(d => {
    const p = polarXY(d,1.04);
    ctx.strokeStyle='rgba(79,195,247,0.12)'; ctx.lineWidth=1;
    ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.setLineDash([]);
  });
}

function drawCone(coneP80, coneHalf, color) {
  const a0 = bearingToAngle(coneP80 - coneHalf);
  const a1 = bearingToAngle(coneP80 + coneHalf);
  ctx.beginPath(); ctx.moveTo(CX,CY);
  ctx.arc(CX,CY,MAX_R,a0,a1);
  ctx.closePath();
  ctx.fillStyle = hexToRgba(color, 0.08); ctx.fill();
  ctx.strokeStyle = hexToRgba(color, 0.25); ctx.lineWidth=1;
  ctx.setLineDash([3,4]); ctx.stroke(); ctx.setLineDash([]);
}

function drawArrow(bearingDeg, color) {
  const tip = polarXY(bearingDeg, 0.82);
  const base = polarXY(bearingDeg, 0.05);
  const a = bearingToAngle(bearingDeg);
  ctx.beginPath(); ctx.moveTo(base.x,base.y); ctx.lineTo(tip.x,tip.y);
  ctx.strokeStyle = color; ctx.lineWidth=2.5; ctx.globalAlpha=0.9;
  ctx.stroke(); ctx.globalAlpha=1;
  const hl=16,hw=7;
  ctx.beginPath(); ctx.moveTo(tip.x,tip.y);
  ctx.lineTo(tip.x-hl*Math.cos(a-0.38),tip.y-hl*Math.sin(a-0.38));
  ctx.lineTo(tip.x-hl*Math.cos(a+0.38),tip.y-hl*Math.sin(a+0.38));
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
}

function drawForceArrow(px,py,bearingDeg,color,stem) {
  const a = bearingToAngle(bearingDeg);
  const tip = { x:px+stem*Math.cos(a), y:py+stem*Math.sin(a) };
  const hw = stem*0.32, hl = stem*0.38;
  ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(tip.x,tip.y);
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.globalAlpha=0.75; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tip.x,tip.y);
  ctx.lineTo(tip.x-hl*Math.cos(a-0.38),tip.y-hl*Math.sin(a-0.38));
  ctx.lineTo(tip.x-hl*Math.cos(a+0.38),tip.y-hl*Math.sin(a+0.38));
  ctx.closePath(); ctx.fillStyle=color; ctx.fill(); ctx.globalAlpha=1;
}

function drawBlip(b) {
  const p = polarXY(b.bearing, b.range);
  const color = CAT_COLOR[b.cat] || (b.type==='opportunity'?'#26a69a':'#ef5350');
  drawForceArrow(p.x,p.y,b.bearing,color,b.size*2.2);
  // glow
  ctx.save();
  ctx.shadowColor=color; ctx.shadowBlur=12;
  ctx.beginPath(); ctx.arc(p.x,p.y,b.size/2+1,0,Math.PI*2);
  ctx.fillStyle=hexToRgba(color,0.15); ctx.fill(); ctx.restore();
  // dot
  ctx.beginPath(); ctx.arc(p.x,p.y,b.size/2,0,Math.PI*2);
  if(b.type==='opportunity') {
    ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.fillStyle=hexToRgba(color,0.25); ctx.fill(); ctx.stroke();
  } else {
    ctx.fillStyle=color; ctx.fill();
  }
  // label
  ctx.fillStyle='rgba(200,216,240,0.85)'; ctx.font='9px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='top';
  const words = b.label.split(' ');
  const line1 = words.slice(0,2).join(' ');
  const line2 = words.slice(2,4).join(' ');
  ctx.fillText(line1, p.x, p.y+b.size/2+3);
  if(line2) ctx.fillText(line2, p.x, p.y+b.size/2+13);
}

function drawIssueDiamond(issue) {
  const p = polarXY(issue.bearing, ISSUE_RANGE);
  const col = CAT_COLOR[issue.pestle] || '#29b6f6';
  const s = 9;
  drawForceArrow(p.x,p.y,issue.bearing,col,s*2.4);
  ctx.save();
  ctx.shadowColor=col; ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y-s); ctx.lineTo(p.x+s,p.y);
  ctx.lineTo(p.x,p.y+s); ctx.lineTo(p.x-s,p.y); ctx.closePath();
  ctx.fillStyle=hexToRgba(col,0.25); ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle=hexToRgba(col,0.8); ctx.font='8px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='top';
  const words = issue.label.split(' ');
  ctx.fillText(words.slice(0,2).join(' '), p.x, p.y+s+3);
  if(words.length>2) ctx.fillText(words.slice(2,4).join(' '), p.x, p.y+s+12);
}

function drawCausalLinks(visibleBlips) {
  if(!visibleBlips || visibleBlips.length < 2) return;
  const byLabel = {};
  visibleBlips.forEach(b => { byLabel[b.label] = b; });
  ctx.save(); ctx.setLineDash([4,5]); ctx.lineWidth=1;
  visibleBlips.forEach(src => {
    if(!src.causes || src.causes.length===0) return;
    const ps = polarXY(src.bearing,src.range);
    src.causes.forEach(edge => {
      const tgt = byLabel[edge.label];
      if(!tgt) return;
      const pt = polarXY(tgt.bearing,tgt.range);
      const baseCol = CAT_COLOR[src.cat] || '#ef5350';
      ctx.strokeStyle = hexToRgba(baseCol,0.40);
      ctx.beginPath(); ctx.moveTo(ps.x,ps.y); ctx.lineTo(pt.x,pt.y); ctx.stroke();
      const dx=pt.x-ps.x, dy=pt.y-ps.y, len=Math.hypot(dx,dy);
      if(len<1) return;
      const ux=dx/len, uy=dy/len, hl=8, hw=4;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(pt.x,pt.y);
      ctx.lineTo(pt.x-hl*ux+hw*uy, pt.y-hl*uy-hw*ux);
      ctx.lineTo(pt.x-hl*ux-hw*uy, pt.y-hl*uy+hw*ux);
      ctx.closePath(); ctx.fillStyle=hexToRgba(baseCol,0.40); ctx.fill();
      ctx.setLineDash([4,5]);
    });
  });
  ctx.restore();
}

function drawTrueNorthLabel(sdg) {
  const sdgCol = SDG_COLOR[sdg.id] || '#4fc3f7';
  ctx.fillStyle = sdgCol; ctx.font = 'bold 11px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(`SDG ${sdg.id}: ${sdg.name}`, CX, CY - MAX_R - 8);
}

function drawOrigin() {
  ctx.beginPath(); ctx.arc(CX,CY,12,0,Math.PI*2);
  ctx.strokeStyle='rgba(79,195,247,0.18)'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2);
  ctx.fillStyle='#4fc3f7'; ctx.shadowColor='#4fc3f7'; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;
}

function drawBorder() {
  ctx.beginPath(); ctx.arc(CX,CY,MAX_R,0,Math.PI*2);
  ctx.strokeStyle='rgba(79,195,247,0.18)'; ctx.lineWidth=2; ctx.stroke();
}

function drawBearingLabel(bearing) {
  const abs=Math.abs(Math.round(bearing));
  const dir = bearing===0?'True North':bearing>0?`+${abs}° east of True North`:`−${abs}° west of True North`;
  ctx.fillStyle='#4fc3f7'; ctx.font='bold 10px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(`Strategic bearing: ${dir}`, CX, CY+MAX_R+12);
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════════
function renderRadar() {
  ctx.clearRect(0,0,CW,CH);
  const sdg = SDGs[activeSdg];
  if(!sdg) return;

  drawBg();
  drawRings(sdg);
  drawCompass('TRUE NORTH — 2030');
  drawCone(sdg.coneP80, sdg.coneHalf, '#4fc3f7');
  drawTrueNorthLabel(sdg);

  // Causal links under blips
  const vb = (sdg.blips||[]).filter(b=>blipVisible(b));
  drawCausalLinks(vb);

  // Blips
  vb.forEach(b => drawBlip(b));

  // Issues (Now ring)
  (sdg.issues||[]).filter(i=>issueVisible(i)).forEach(i=>drawIssueDiamond(i));

  // Main bearing arrow
  drawArrow(sdg.bearing, SDG_COLOR[sdg.id]||'#4fc3f7');

  drawOrigin();
  drawBorder();
  drawBearingLabel(sdg.bearing);
}

// ═══════════════════════════════════════════════════════════════════════════
// TOOLTIP SYSTEM
// ═══════════════════════════════════════════════════════════════════════════
const tooltip = document.getElementById('radar-tooltip');

function canvasCoords(cx,cy) {
  const rect = canvas.getBoundingClientRect();
  const sx = CW/rect.width, sy = CH/rect.height;
  return { x:(cx-rect.left)*sx, y:(cy-rect.top)*sy };
}

function hitTest(mx,my) {
  const sdg = SDGs[activeSdg];
  if(!sdg) return null;

  // Test issues (Now ring diamonds)
  for(const iss of (sdg.issues||[]).filter(i=>issueVisible(i))) {
    const p = polarXY(iss.bearing, ISSUE_RANGE);
    if(Math.hypot(mx-p.x,my-p.y)<14) return {kind:'issue',data:iss};
  }

  // Test blips
  for(const b of (sdg.blips||[]).filter(b=>blipVisible(b))) {
    const p = polarXY(b.bearing, b.range);
    if(Math.hypot(mx-p.x,my-p.y) < b.size/2+4) return {kind:'blip',data:b};
  }
  return null;
}

const catBadgeClass = { Economic:'econ', Environmental:'env', Geopolitical:'geo', Societal:'soc', Technological:'tech' };

function showTip(hit,mx,my) {
  const d = hit.data;
  let color, badgeClass, badgeText;
  if(hit.kind==='issue') {
    color = CAT_COLOR[d.pestle]||'#29b6f6';
    badgeClass='issue'; badgeText='Active Issue';
    if(d.pestle) badgeText += ` · ${d.pestle}`;
  } else {
    color = CAT_COLOR[d.cat]||(d.type==='opportunity'?'#26a69a':'#ef5350');
    const typeLabel = d.type==='opportunity'?'Opportunity':'Threat';
    badgeClass = d.type==='opportunity'?'opportunity':(catBadgeClass[d.cat]||'threat');
    badgeText  = d.cat ? `${typeLabel} · ${d.cat}` : typeLabel;
  }

  document.getElementById('tt-dot').style.background=color;
  document.getElementById('tt-label').textContent=d.label||'';
  const badge=document.getElementById('tt-badge');
  badge.textContent=badgeText; badge.className=`tt-badge ${badgeClass}`;

  const grid=document.getElementById('tt-grid');
  grid.innerHTML='';
  function cell(label,value,cls) {
    return `<div class="tt-cell"><div class="tt-cell-label">${label}</div><div class="tt-cell-value ${cls||''}">${value}</div></div>`;
  }

  if(hit.kind==='issue') {
    grid.innerHTML=cell('Status','Confirmed','high')+cell('Category',d.pestle||'—')+
      cell('Onset',d.onset||'—')+cell('Resolution',d.resolution||'—');
    document.getElementById('tt-bearing').textContent='';
    document.getElementById('tt-rationale').textContent=d.action||'';
  } else {
    const r2=d.wef2yr?`#${d.wef2yr}`:'—';
    const r10=d.wef10yr?`#${d.wef10yr}`:'—';
    grid.innerHTML=cell('Magnitude',d.magnitude||'—',vcls(d.magnitude))+
      cell('Direction',d.direction||'—')+
      cell('WEF 2yr rank',r2)+cell('WEF 10yr rank',r10)+
      (d.capability?cell('Capability',d.capability,vcls(d.capability)):'');
    document.getElementById('tt-bearing').textContent=d.bearing_effect||'';
    document.getElementById('tt-rationale').textContent=d.rationale||'';
  }

  // Causal block
  const causalEl=document.getElementById('tt-causal');
  const hasCauses   = d.causes    && d.causes.length>0;
  const hasCausedBy = d.caused_by && d.caused_by.length>0;
  if(causalEl && (hasCauses||hasCausedBy)) {
    let html='';
    if(hasCausedBy) {
      html+='<div class="tt-causal-head">Driven by</div>';
      d.caused_by.forEach(e=>{
        html+=`<div class="tt-causal-row"><span class="tt-causal-src">${e.label}</span><span class="tt-causal-delta ${parseFloat(e.delta)>=0?'pos':'neg'}">${e.delta}</span></div>`;
        if(e.note) html+=`<div class="tt-causal-note">${e.note}</div>`;
      });
    }
    if(hasCauses) {
      html+='<div class="tt-causal-head">Drives</div>';
      d.causes.forEach(e=>{
        html+=`<div class="tt-causal-row"><span class="tt-causal-src">${e.label}</span><span class="tt-causal-delta ${parseFloat(e.delta)>=0?'pos':'neg'}">${e.delta}</span></div>`;
        if(e.note) html+=`<div class="tt-causal-note">${e.note}</div>`;
      });
    }
    causalEl.innerHTML=html; causalEl.style.display='block';
  } else if(causalEl) {
    causalEl.style.display='none';
  }

  const TW=290,TH=420,vw=window.innerWidth,vh=window.innerHeight;
  let left=mx+16,top=my-20;
  if(left+TW>vw-12) left=mx-TW-12;
  if(top+TH>vh-12) top=vh-TH-12;
  if(top<8) top=8;
  tooltip.style.left=left+'px'; tooltip.style.top=top+'px';
  tooltip.classList.add('visible');
}
function hideTip() { tooltip.classList.remove('visible'); }

canvas.addEventListener('mousemove',e=>{
  const {x,y}=canvasCoords(e.clientX,e.clientY);
  const hit=hitTest(x,y);
  if(hit){canvas.style.cursor='pointer';showTip(hit,e.clientX,e.clientY);}
  else{canvas.style.cursor='';hideTip();}
});
canvas.addEventListener('mouseleave',hideTip);

function statusPill(s) {
  const labels={
    'on-track':'On Track','moderate':'Moderate Progress',
    'marginal':'Marginal Progress','stagnation':'Stagnation','regression':'Regression'
  };
  return `<span class="status-pill status-${s}">${labels[s]||s}</span>`;
}

function renderAnalysis() {
  const sdg = SDGs[activeSdg];
  if(!sdg) return;
  const col = SDG_COLOR[sdg.id]||'#4fc3f7';

  const topThreats = (sdg.blips||[])
    .filter(b=>b.type==='threat')
    .sort((a,b)=>(a.wef2yr||99)-(b.wef2yr||99))
    .slice(0,5);

  const topOpps = (sdg.blips||[])
    .filter(b=>b.type==='opportunity')
    .slice(0,3);

  const issues = sdg.issues||[];

  let html = `
    <div class="info-header">
      <div class="info-title" style="color:${col}">SDG ${sdg.id}: ${sdg.name}</div>
      <div class="info-subtitle" style="margin-top:4px">${statusPill(sdg.status)}</div>
      <div class="info-subtitle" style="margin-top:6px">${sdg.statusNote}</div>
    </div>

    <div class="info-section">
      <div class="info-section-head">Strategic Bearing</div>
      <div class="bearing-stat">
        <span class="bearing-label">Current deviation from True North</span>
        <span class="bearing-value">+${sdg.bearing}°</span>
      </div>
      <div class="bearing-stat">
        <span class="bearing-label">P50 bearing (expected)</span>
        <span class="bearing-value" style="font-size:0.9rem;color:#8aa4c8">+${sdg.coneP50}°</span>
      </div>
      <div class="bearing-stat">
        <span class="bearing-label">P80 tail (stressed)</span>
        <span class="bearing-value" style="font-size:0.9rem;color:#ef5350">+${sdg.coneP80}°</span>
      </div>
      <div class="info-body" style="margin-top:8px">${sdg.headline}</div>
    </div>`;

  if(issues.length>0) {
    html+=`<div class="info-section">
      <div class="info-section-head">Active Issues (Now Ring)</div>
      <ul class="risk-list">`;
    issues.forEach(i=>{
      const c=CAT_COLOR[i.pestle]||'#29b6f6';
      html+=`<li>
        <span class="risk-dot" style="background:${c}"></span>
        <span class="risk-name">${i.label}</span>
        <span class="risk-rank">${i.onset}</span>
      </li>`;
    });
    html+=`</ul></div>`;
  }

  if(topThreats.length>0) {
    html+=`<div class="info-section">
      <div class="info-section-head">Principal WEF Threats</div>
      <ul class="risk-list">`;
    topThreats.forEach(b=>{
      const c=CAT_COLOR[b.cat]||'#ef5350';
      const r2=b.wef2yr?`WEF 2yr #${b.wef2yr}`:'';
      const r10=b.wef10yr?`/ 10yr #${b.wef10yr}`:'';
      html+=`<li>
        <span class="risk-dot" style="background:${c}"></span>
        <span class="risk-name">${b.label}</span>
        <span class="risk-rank">${r2} ${r10}</span>
      </li>`;
    });
    html+=`</ul></div>`;
  }

  if(topOpps.length>0) {
    html+=`<div class="info-section">
      <div class="info-section-head">Strategic Opportunities</div>
      <ul class="risk-list">`;
    topOpps.forEach(b=>{
      const c=CAT_COLOR[b.cat]||'#26a69a';
      html+=`<li>
        <span class="risk-dot" style="background:${c};border-radius:0"></span>
        <span class="risk-name">${b.label}</span>
        <span class="risk-rank">Capability: ${b.capability||'—'}</span>
      </li>`;
    });
    html+=`</ul></div>`;
  }

  html+=`<div class="info-section">
    <div class="info-section-head">Data Sources</div>
    <div class="info-body">
      WEF Global Risks Report 2026 (21st Edition) — Global Risks Perception Survey 2025–2026, 1,300+ experts.<br>
      WEF 2016 Cytoscape Risk Network — 29 nodes, 170 directed edges, weights 1–3. Assumed structurally extant.<br>
      UN SDG Report 2025 — 169 targets assessed against 2015–2025 trend data.
    </div>
  </div>`;

  document.getElementById('tab-analysis').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════
// NETWORK PANEL
// ═══════════════════════════════════════════════════════════════════════════
function renderNetwork() {
  const sdg = SDGs[activeSdg];
  if(!sdg || !sdg.network) return;
  const col = SDG_COLOR[sdg.id]||'#4fc3f7';
  const net = sdg.network;

  // Find the WEF nodes most connected to blip labels
  const blipLabels = new Set((sdg.blips||[]).map(b=>b.label.toLowerCase().substring(0,15)));
  const relevantNodes = Object.entries(WEF_NODES).filter(([k,v]) =>
    blipLabels.has(v.name.toLowerCase().substring(0,15)) ||
    (sdg.blips||[]).some(b=>b.label.toLowerCase().includes(v.name.toLowerCase().substring(0,12)))
  ).map(([k,v])=>({id:k,...v}));

  let html = `
    <div class="info-header">
      <div class="info-title" style="color:${col}">Risk Network: SDG ${sdg.id}</div>
      <div class="info-subtitle">WEF 2016 Cytoscape network — causal chains mapped to SDG ${sdg.id} risk exposure</div>
    </div>

    <div class="info-section">
      <div class="info-section-head">Network Assessment</div>
      <div class="info-body">${net.headline}</div>
    </div>

    <div class="info-section">
      <div class="info-section-head">Principal Causal Chains</div>`;

  net.chains.forEach(chain=>{
    html+=`<div class="causal-chain">`;
    chain.path.forEach((node,i)=>{
      const w = chain.weights[i];
      const wc = w===3?'cw-3':w===2?'cw-2':'cw-1';
      html+=`<div class="causal-chain-row">
        ${i>0?`<span class="causal-arrow">→</span>`:'<span style="width:14px;display:inline-block"></span>'}
        <span class="causal-node">${node}</span>
        ${w!=null?`<span class="causal-weight ${wc}">w${w}</span>`:''}
      </div>`;
    });
    html+=`<div class="info-body" style="margin:4px 0 10px 14px;font-size:0.7rem;color:#4a6080">${chain.effect}</div>`;
    html+=`</div>`;
  });

  html+=`</div>

    <div class="info-section">
      <div class="info-section-head">WEF 2016 Node In-Degree (Top 8 — network centrality)</div>
      <ul class="risk-list">`;

  const topNodes = Object.entries(NODE_INDEGREE)
    .sort((a,b)=>b[1]-a[1]).slice(0,8);
  topNodes.forEach(([k,deg])=>{
    const n=WEF_NODES[k];
    const c=CAT_COLOR[n.cat];
    const maxDeg=topNodes[0][1];
    html+=`<li>
      <span class="risk-dot" style="background:${c}"></span>
      <span class="risk-name">${n.name}</span>
      <span class="risk-rank">in-degree ${deg}</span>
    </li>`;
  });

  html+=`</ul></div>

    <div class="info-section">
      <div class="info-section-head">Methodological Note</div>
      <div class="info-body">
        The WEF 2016 Cytoscape network (29 nodes, 170 directed edges) is treated as structurally extant for this proof of concept.
        Edge weights (1–3) represent co-occurrence strength from expert elicitation.
        Node in-degree is the sum of all incoming edge weights — a proxy for systemic vulnerability.
        Causal chains on the radar represent the highest-weight directed paths from WEF risks to SDG outcome degradation.
        The 2026 WEF GRPS severity rankings are overlaid as blip positioning on the radar (2yr horizon = inner rings; 10yr = outer rings).
      </div>
    </div>`;

  document.getElementById('tab-network').innerHTML = html;
}

let activeTab = 'analysis';
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    activeTab=btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+activeTab).classList.add('active');
    if(activeTab==='analysis') renderAnalysis();
    else if(activeTab==='network') renderNetwork();
    else if(activeTab==='chat') renderChat();
  });
});

// ═══════════════════════════════════════════════════════════════════════════
function setSdg(id) {
  activeSdg = id;
  document.querySelectorAll('.sdg-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.sdg)===id);
  });
  hideTip();
  renderRadar();
  if(activeTab==='analysis') renderAnalysis();
  else if(activeTab==='network') renderNetwork();
  else renderChat();
}
