  <style>

[data-theme="fun"] { --bg-primary: #fef7ff; --bg-secondary: #fae8ff; --bg-card: #ffffff; --bg-hover: rgba(217, 70, 239, 0.04); --border-primary: #f0abfc; --border-secondary: #fae8ff; --border-accent: #e879f9; --text-primary: #701a75; --text-secondary: #86198f; --text-muted: #a21caf; --text-faint: #c026d3; --accent-primary: #d946ef; --accent-hover: #c026d3; --accent-light: rgba(217, 70, 239, 0.12); --danger: #e11d48; --success: #22c55e; --font-primary: 'Nunito', -apple-system, sans-serif; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 20px; --radius-xl: 24px; }

* { font-family: var(--font-primary); box-sizing: border-box; }
body { background: var(--bg-primary); min-height: 100vh; margin: 0; padding: 0; color: var(--text-primary); }
::-webkit-scrollbar { width: 6px; height: 6px; }

::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
.app-layout { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-width); min-width: var(--sidebar-width); background: var(--bg-card); border-right: 1px solid var(--border-primary); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform var(--transition-slow); overflow-y: auto; }
.sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border-primary); }
.sidebar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary); }

.sidebar-brand-text { font-size: 15px; font-weight: 700; line-height: 1.2; }

.sidebar-nav { padding: 8px 0; flex: 1; }

.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }

.app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--bg-card); border-bottom: 1px solid var(--border-primary); position: sticky; top: 0; z-index: 50; gap: 16px; }

.theme-select:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-light); }
.back-link { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid var(--border-primary); border-radius: var(--radius-md); background: var(--bg-card); color: var(--text-secondary); font-size: 13px; font-weight: 500; text-decoration: none; transition: all var(--transition-fast); font-family: var(--font-primary); white-space: nowrap; }
.back-link:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-accent); }

.prose ul, .prose ol { margin: 0 0 16px; padding-left: 24px; }

.prose a:hover { text-decoration: underline; }
.doc-table-wrapper { overflow-x: auto; margin: 0 0 20px; border-radius: var(--radius-lg); border: 1px solid var(--border-primary); }
.doc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.doc-table th { background: var(--bg-secondary); padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text-primary); border-bottom: 1px solid var(--border-primary); white-space: nowrap; }
.doc-table td { padding: 9px 14px; border-bottom: 1px solid var(--border-secondary); color: var(--text-secondary); vertical-align: top; }

[data-theme="dark"] .code-block { background: #1a1a1a; border-color: #2a2a2a; }
.doc-card { background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-lg); padding: 20px; margin: 0 0 16px; box-shadow: var(--shadow-sm); }
.doc-card h4 { margin-top: 0; }
.callout { background: var(--suite-light); border: 1px solid var(--border-primary); border-left: 4px solid var(--suite-colour); border-radius: var(--radius-md); padding: 14px 16px; margin: 0 0 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect } = React;

const icons = {
  arrow: (s=14) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
  menu: (s=20) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
  box: (s=18) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>,
};

const SUITE_COLOUR = '#ef4444';

const modules = [
  { key: 'inv-stock', name: 'Stock Register', desc: 'Central inventory database tracking all stock items with quantities, locations, unit costs, and reorder points. Supports SKU management, batch tracking, and automatic low-stock alerts when quantities fall below defined thresholds.' },
  { key: 'inv-warehouse', name: 'Warehouse', desc: 'Manage warehouse locations, zones, and bin positions. Track storage capacity, utilisation rates, and item placement. Supports multiple warehouse locations with inter-warehouse transfer tracking.' },
  { key: 'inv-orders', name: 'Orders', desc: 'Process customer and internal orders from creation through picking, packing, and dispatch. Track order fulfilment rates, backorder quantities, and expected delivery dates for outstanding orders.' },
  { key: 'inv-shipments', name: 'Shipments', desc: 'Track outbound shipments with carrier details, tracking numbers, and delivery confirmation. Monitor shipping costs, transit times, and delivery success rates across different carriers and routes.' },
  { key: 'inv-hub', name: 'Inventory Hub', desc: 'Executive dashboard showing stock levels, warehouse utilisation, order fulfilment rates, and shipping performance. Highlights items approaching reorder points and identifies slow-moving stock for review.' },
];

const navSections = [
  { id: 'overview', label: 'Overview' },
  { id: 'modules', label: 'Planned Modules', badge: modules.length, children: modules.map(m => ({ id: m.key, label: m.name })) },
  { id: 'integrations', label: 'Integration Points' },
  { id: 'data-model', label: 'Data Model' },
];

function App() {
  const [activeSection, setActiveSection] = useState('overview');
  const [expandedNav, setExpandedNav] = useState({ modules: true });
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem('coffeecup-theme') || 'blueprint');

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('coffeecup-theme', theme); }, [theme]);

  const scrollTo = (id) => { setActiveSection(id); setSidebarOpen(false); const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const toggleNav = (key) => setExpandedNav(prev => ({ ...prev, [key]: !prev[key] }));

  return (
    <div className="app-layout">
      <div className={`sidebar-overlay ${sidebarOpen ? 'visible' : ''}`} onClick={() => setSidebarOpen(false)} />
      <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="sidebar-header">
          <div className="sidebar-brand">
            <div className="sidebar-brand-icon">I</div>
            <div>
              <div className="sidebar-brand-text">Inventory &amp; Logistics</div>
              <div className="sidebar-brand-sub">Suite Documentation</div>
            </div>
          </div>
        </div>
        <nav className="sidebar-nav">
          {navSections.map(section => (
            <div className="nav-section" key={section.id}>
              {section.children ? (
                <>
                  <div className={`nav-item ${activeSection === section.id ? 'active' : ''}`} onClick={() => { toggleNav(section.id); scrollTo(section.id); }}>
                    <span style={{flex:1}}>{section.label}</span>
                    {section.badge && <span className="nav-badge">{section.badge}</span>}
                  </div>
                  {expandedNav[section.id] && section.children.map(child => (
                    <div key={child.id} className={`nav-item sub ${activeSection === child.id ? 'active' : ''}`} onClick={() => scrollTo(child.id)}>{child.label}</div>
                  ))}
                </>
              ) : (
                <div className={`nav-item ${activeSection === section.id ? 'active' : ''}`} onClick={() => scrollTo(section.id)}>{section.label}</div>
              )}
            </div>
          ))}
        </nav>
      </aside>

      <div className="main-area">
        <header className="app-header">
          <div className="header-left">
            <button className="hamburger" onClick={() => setSidebarOpen(!sidebarOpen)}>{icons.menu()}</button>
            <div className="header-icon">{icons.box()}</div>
            <div>
              <h1 className="header-title">Inventory &amp; Logistics Documentation</h1>
              <p className="header-subtitle">CoffeeCup Enterprise Suite</p>
            </div>
          </div>
          <div className="header-right">
            <select className="theme-select" value={theme} onChange={e => setTheme(e.target.value)}>
              <option value="blueprint">Blueprint</option>
              <option value="fun">Fun</option>
              <option value="dark">Dark</option>
              <option value="traditional">Traditional</option>
            </select>
            <a href="../../Enterprise Launch/index.html" className="back-link">{icons.arrow()} <span>Back to Enterprise</span></a>
          </div>
        </header>

        <div className="content-area prose">
          <section id="overview">
            <h2>Overview</h2>
            <p>The <strong>Inventory &amp; Logistics Suite</strong> provides comprehensive stock management and order fulfilment capabilities. It tracks physical goods from receipt into the warehouse through storage, picking, packing, and final shipment to the customer, ensuring accurate stock levels and efficient logistics operations.</p>
            <div className="callout">
              <strong>Design Philosophy:</strong> Accurate inventory data is the foundation of reliable order fulfilment. This suite maintains real-time stock visibility across all warehouse locations, with automatic alerts for reorder points and slow-moving items. Every stock movement is recorded to maintain a complete audit trail.
            </div>
            <p>The suite comprises five modules covering stock management, warehouse operations, order processing, shipment tracking, and a central hub dashboard. Together they provide end-to-end visibility into the physical supply chain from goods receipt to customer delivery.</p>
          </section>

          <section id="modules">
            <h2>Planned Modules</h2>
            <p>The Inventory &amp; Logistics Suite comprises {modules.length} modules. The Stock Register is the central data store, with warehouse, order, and shipment modules all updating stock quantities through defined transactions.</p>
            <div className="doc-table-wrapper">
              <table className="doc-table">
                <thead><tr><th>Module</th><th>Storage Key</th><th>Status</th></tr></thead>
                <tbody>
                  {modules.map(m => (
                    <tr key={m.key}><td><strong>{m.name}</strong></td><td><code>{m.key}</code></td><td><span className="status-badge planned">Planned</span></td></tr>
                  ))}
                </tbody>
              </table>
            </div>
            {modules.map(m => (
              <div key={m.key} id={m.key} className="doc-card">
                <h3 style={{margin:'0 0 8px', color: SUITE_COLOUR}}>{m.name}</h3>
                <p style={{fontSize:'12px', color:'var(--text-muted)', margin:'0 0 8px'}}>
                  <code style={{fontFamily:'var(--font-mono)', fontSize:'11px', background:'var(--bg-secondary)', padding:'2px 6px', borderRadius:'var(--radius-sm)', color: SUITE_COLOUR}}>{m.key}</code>
                </p>
                <p style={{margin:0}}>{m.desc}</p>
              </div>
            ))}
          </section>

          <section id="integrations">
            <h2>Integration Points</h2>
            <p>The Inventory &amp; Logistics Suite connects primarily to the Suppliers &amp; Procurement Suite for inbound goods and to the Customer Lifecycle Suite for outbound order fulfilment.</p>

            <h3>Procurement to Inventory</h3>
            <p>When goods are received against a purchase order in the Procurement suite, the Stock Register is updated with the received quantities. Batch numbers, inspection status, and storage locations are recorded at the point of receipt. This is the primary inbound flow for inventory replenishment.</p>

            <h3>CRM / Orders to Inventory</h3>
            <p>Customer orders (originating from the CRM pipeline or direct sales) trigger stock reservation and picking lists. The order fulfilment process deducts reserved quantities from available stock and tracks the order through to dispatch.</p>

            <h3>Inventory to Finance</h3>
            <p>Stock valuations feed into the Finance Suite's Balance Sheet for asset reporting. Cost of goods sold (COGS) data flows into the P&amp;L Statement when items are shipped against customer orders.</p>

            <div className="doc-table-wrapper">
              <table className="doc-table">
                <thead><tr><th>Direction</th><th>Connected Suite</th><th>Data Exchanged</th></tr></thead>
                <tbody>
                  <tr><td>Inbound</td><td><strong>Suppliers &amp; Procurement</strong></td><td>Goods received quantities, batch numbers, and quality status</td></tr>
                  <tr><td>Inbound</td><td><strong>Customer Lifecycle</strong></td><td>Customer orders trigger stock reservation and picking</td></tr>
                  <tr><td>Outbound</td><td><strong>Finance</strong></td><td>Stock valuations for balance sheet; COGS for P&amp;L</td></tr>
                  <tr><td>Outbound</td><td><strong>Company &amp; Governance</strong></td><td>Inventory accuracy metrics and stock write-off data</td></tr>
                </tbody>
              </table>
            </div>
