    // ============================================
    // TORNADO CHART COMPONENT
    // ============================================
    const TornadoChart = ({ risks, viewMode }) => {
      const tornadoChartRef = useRef(null);
      const tornadoInstanceRef = useRef(null);

      // Calculate tornado data for both pre and post action
      const preTornadoData = useMemo(() => prepareTornadoData(risks, viewMode, false), [risks, viewMode]);
      const postTornadoData = useMemo(() => prepareTornadoData(risks, viewMode, true), [risks, viewMode]);

      // Total EMV calculations
      const preTotalEMV = useMemo(() =>
        preTornadoData.emvValues.reduce((sum, v) => sum + v, 0),
        [preTornadoData]
      );
      const postTotalEMV = useMemo(() =>
        postTornadoData.emvValues.reduce((sum, v) => sum + v, 0),
        [postTornadoData]
      );

      useEffect(() => {
        if (!tornadoChartRef.current || risks.length === 0) return;

        if (tornadoInstanceRef.current) {
          tornadoInstanceRef.current.destroy();
        }

        const ctx = tornadoChartRef.current.getContext('2d');
        const dangerColor = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim() || '#dc7c7c';
        const successColor = getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#22c55e';

        // Use pre-action data for the tornado chart (sorted by impact)
        const { labels, lowValues, highValues, emvValues, types } = preTornadoData;

        // Create floating bar data for tornado effect
        // Each bar shows the range from low to high impact
        const barData = lowValues.map((low, i) => {
          const high = highValues[i];
          // For tornado chart, we show [min, max] as the bar range
          return [Math.min(low, high), Math.max(low, high)];
        });

        // Color bars based on risk type
        const backgroundColors = types.map(type =>
          type === 'threat' ? dangerColor + '80' : successColor + '80'
        );
        const borderColors = types.map(type =>
          type === 'threat' ? dangerColor : successColor
        );

        tornadoInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Impact Range (EMV)',
              data: barData,
              backgroundColor: backgroundColors,
              borderColor: borderColors,
              borderWidth: 1,
              borderSkipped: false
            }]
          },
          options: {
            indexAxis: 'y', // Horizontal bars for tornado chart
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: false
              },
              title: {
                display: true,
                text: `EMV Tornado Chart - ${viewMode === 'cost' ? 'Cost' : 'Time'} Impact Sensitivity`,
                font: { size: 14, weight: '500' }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const idx = context.dataIndex;
                    const low = lowValues[idx];
                    const high = highValues[idx];
                    const emv = emvValues[idx];
                    const type = types[idx];
                    return [
                      `Type: ${type === 'threat' ? 'Threat' : 'Opportunity'}`,
                      `Range: ${formatNumber(low)} to ${formatNumber(high)}`,
                      `EMV: ${formatNumber(emv)}`,
                      `Swing: ${formatNumber(Math.abs(high - low))}`
                    ];
                  }
                }
              }
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: viewMode === 'cost' ? 'Cost Impact (EMV)' : 'Time Impact (EMV, days)'
                },
                grid: { display: true, color: 'rgba(0,0,0,0.05)' }
              },
              y: {
                title: { display: false },
                grid: { display: false }
              }
            }
          }
        });

        return () => {
          if (tornadoInstanceRef.current) {
            tornadoInstanceRef.current.destroy();
          }
        };
      }, [preTornadoData, viewMode, risks.length]);

      if (risks.length === 0) {
        return null;
      }

      const emvReduction = preTotalEMV !== 0 ? ((preTotalEMV - postTotalEMV) / Math.abs(preTotalEMV) * 100) : 0;

      return (
        <div className="card" style={{ padding: '16px', marginBottom: '16px' }}>
          {/* EMV Summary */}
          <div style={{
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            marginBottom: '16px',
            padding: '12px 16px',
            background: 'var(--bg-secondary)',
            borderRadius: 'var(--radius-md)'
          }}>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '11px', fontWeight: '500', color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: '4px' }}>
                Pre-Action Total EMV
              </div>
              <div style={{ fontSize: '20px', fontWeight: '600', color: 'var(--danger)', fontFamily: 'var(--font-mono)' }}>
                {formatNumber(preTotalEMV)}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span style={{ color: 'var(--text-faint)', fontSize: '20px' }}>→</span>
              {emvReduction !== 0 && (
                <span style={{
                  fontSize: '12px',
                  fontWeight: '600',
                  color: emvReduction > 0 ? 'var(--success)' : 'var(--danger)',
                  background: emvReduction > 0 ? 'var(--success-light)' : 'var(--danger-light)',
                  padding: '4px 10px',
                  borderRadius: 'var(--radius-sm)'
                }}>
                  {emvReduction > 0 ? '↓' : '↑'} {Math.abs(emvReduction).toFixed(1)}%
                </span>
              )}
            </div>
            <div style={{ textAlign: 'center' }}>
              <div style={{ fontSize: '11px', fontWeight: '500', color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: '4px' }}>
                Post-Action Total EMV
              </div>
              <div style={{ fontSize: '20px', fontWeight: '600', color: 'var(--success)', fontFamily: 'var(--font-mono)' }}>
                {formatNumber(postTotalEMV)}
              </div>
            </div>
          </div>

          {/* Tornado Chart */}
          <div className="chart-container" style={{ height: Math.max(200, risks.length * 40 + 80) + 'px' }}>
            <canvas ref={tornadoChartRef}></canvas>
          </div>

          {/* Legend */}
          <div style={{ display: 'flex', justifyContent: 'center', gap: '24px', marginTop: '12px', fontSize: '12px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <div style={{ width: '16px', height: '12px', background: 'var(--danger)', opacity: 0.5, borderRadius: '2px', border: '1px solid var(--danger)' }}></div>
              <span style={{ color: 'var(--text-muted)' }}>Threats (cost/time increase)</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <div style={{ width: '16px', height: '12px', background: 'var(--success)', opacity: 0.5, borderRadius: '2px', border: '1px solid var(--success)' }}></div>
              <span style={{ color: 'var(--text-muted)' }}>Opportunities (cost/time decrease)</span>
            </div>
          </div>

          {/* Risk EMV Table */}
          <div style={{ marginTop: '16px', overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid var(--border-primary)' }}>
                  <th style={{ padding: '8px', textAlign: 'left', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Rank</th>
                  <th style={{ padding: '8px', textAlign: 'left', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Risk</th>
                  <th style={{ padding: '8px', textAlign: 'left', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Type</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Pre-EMV</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Post-EMV</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Swing</th>
                </tr>
              </thead>
              <tbody>
                {preTornadoData.sorted.map((risk, idx) => {
                  const postRisk = postTornadoData.sorted.find(r => r.id === risk.id);
                  const preEMV = viewMode === 'cost' ? risk.emvCost : risk.emvTime;
                  const postEMV = postRisk ? (viewMode === 'cost' ? postRisk.emvCost : postRisk.emvTime) : preEMV;
                  const swing = viewMode === 'cost' ? risk.costSwing : risk.timeSwing;
                  return (
                    <tr key={risk.id} style={{ borderBottom: '1px solid var(--border-secondary)' }}>
                      <td style={{ padding: '8px', color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>{idx + 1}</td>
                      <td style={{ padding: '8px', color: 'var(--text-primary)', fontWeight: '500' }}>{risk.name}</td>
                      <td style={{ padding: '8px' }}>
                        <span style={{
                          fontSize: '10px',
                          fontWeight: '600',
                          padding: '2px 6px',
                          borderRadius: '4px',
                          background: risk.type === 'threat' ? 'var(--danger-light)' : 'var(--success-light)',
                          color: risk.type === 'threat' ? 'var(--danger)' : 'var(--success)'
                        }}>
                          {risk.type}
                        </span>
                      </td>
                      <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--danger)' }}>
                        {formatNumber(preEMV)}
                      </td>
                      <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--success)' }}>
                        {formatNumber(postEMV)}
                      </td>
                      <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--text-secondary)' }}>
                        {formatNumber(swing)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ borderTop: '2px solid var(--border-primary)', fontWeight: '600' }}>
                  <td colSpan="3" style={{ padding: '8px', textAlign: 'right', color: 'var(--text-muted)' }}>TOTAL</td>
                  <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--danger)' }}>
                    {formatNumber(preTotalEMV)}
                  </td>
                  <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--success)' }}>
                    {formatNumber(postTotalEMV)}
                  </td>
                  <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--text-secondary)' }}>
                    -
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </div>
      );
    };

    // ============================================
    // TORNADO PANEL COMPONENT (Tab 2)
    // ============================================
    const TornadoPanel = ({ risks, isSimulating }) => {
      const [viewMode, setViewMode] = useState('cost');

      if (isSimulating) {
        return (
          <div className="card p-8 text-center animate-fade-in">
            <div style={{ fontSize: '14px', color: 'var(--text-muted)' }}>Running simulation...</div>
          </div>
        );
      }

      if (risks.length === 0) {
        return (
          <div className="card p-8 text-center animate-fade-in">
            <div style={{ fontSize: '14px', color: 'var(--text-muted)' }}>Add risks in the Risk Register tab to see the Tornado Chart.</div>
          </div>
        );
      }

      return (
        <div className="animate-fade-in">
          {/* View Mode Toggle */}
          <div className="chart-toggle" style={{ marginBottom: '16px' }}>
            <button
              className={`btn btn-secondary ${viewMode === 'cost' ? 'active' : ''}`}
              onClick={() => setViewMode('cost')}
            >
              Cost Impact
            </button>
            <button
              className={`btn btn-secondary ${viewMode === 'time' ? 'active' : ''}`}
              onClick={() => setViewMode('time')}
            >
              Time Impact
            </button>
          </div>

          {/* Tornado Chart */}
          <TornadoChart risks={risks} viewMode={viewMode} />
        </div>
      );
    };

    // ============================================
    // PRIORITY CHART COMPONENT (Tab 4)
    // ============================================
    const PriorityPanel = ({ risks, isSimulating }) => {
      const [viewMode, setViewMode] = useState('cost'); // 'cost' or 'time'
      const [usePostAction, setUsePostAction] = useState(false);
      const [highlightedRisk, setHighlightedRisk] = useState(null);
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      // Calculate priority data for each risk
      const priorityData = useMemo(() => {
        return risks.map(risk => {
          const likelihood = usePostAction
            ? (risk.postLikelihood ?? risk.likelihood)
            : risk.likelihood;
          const impact = viewMode === 'cost'
            ? (usePostAction ? (risk.postImpactCost ?? risk.impactCost) : risk.impactCost)
            : (usePostAction ? (risk.postImpactTime ?? risk.impactTime) : risk.impactTime);
          const distributionType = viewMode === 'cost'
            ? (usePostAction ? (risk.postCostDistribution ?? risk.costDistribution ?? 'triangular') : (risk.costDistribution ?? 'triangular'))
            : (usePostAction ? (risk.postTimeDistribution ?? risk.timeDistribution ?? 'triangular') : (risk.timeDistribution ?? 'triangular'));

          // Expected value based on distribution type
          const expectedImpact = getExpectedValue(impact, distributionType);
          // EMV for sizing/priority
          const emv = (likelihood / 100) * expectedImpact;

          // For opportunities, negate the impact values (they represent savings/benefits)
          const isOpportunity = risk.type === 'opportunity';
          const sign = isOpportunity ? -1 : 1;

          return {
            id: risk.id,
            name: risk.name || risk.id,
            type: risk.type,
            likelihood,
            // For opportunities: min becomes -max (largest saving), max becomes -min (smallest saving)
            min: isOpportunity ? -impact.max : impact.min,
            likely: isOpportunity ? -impact.likely : impact.likely,
            max: isOpportunity ? -impact.min : impact.max,
            expected: sign * expectedImpact,
            distributionType,
            emv: sign * emv
          };
        });
      }, [risks, viewMode, usePostAction]);

      // Calculate axis bounds to include all whiskers (threats positive, opportunities negative)
      const xAxisBounds = useMemo(() => {
        if (priorityData.length === 0) return { min: -100, max: 100 };
        const allValues = priorityData.flatMap(r => [r.min, r.max]);
        const maxValue = Math.max(...allValues, 0);
        const minValue = Math.min(...allValues, 0);
        // Add 10% padding, ensure symmetric if needed
        const absMax = Math.max(Math.abs(maxValue), Math.abs(minValue));
        return {
          min: minValue < 0 ? minValue * 1.1 : 0,
          max: maxValue > 0 ? maxValue * 1.1 : absMax * 0.1
        };
      }, [priorityData]);

      useEffect(() => {
        if (!chartRef.current || risks.length === 0) return;

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        const dangerColor = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim() || '#dc7c7c';
        const successColor = getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#22c55e';

        // Prepare data for scatter chart with error bars
        const threatData = priorityData
          .filter(r => r.type === 'threat')
          .map(r => {
            const isHighlighted = highlightedRisk === null || highlightedRisk === r.id;
            return {
              x: r.expected,
              y: r.likelihood,
              xMin: r.min,
              xMax: r.max,
              name: r.name,
              id: r.id,
              emv: r.emv,
              isHighlighted
            };
          });

        const opportunityData = priorityData
          .filter(r => r.type === 'opportunity')
          .map(r => {
            const isHighlighted = highlightedRisk === null || highlightedRisk === r.id;
            return {
              x: r.expected,
              y: r.likelihood,
              xMin: r.min,
              xMax: r.max,
              name: r.name,
              id: r.id,
              emv: r.emv,
              isHighlighted
            };
          });

        // Custom plugin to draw horizontal error bars
        const errorBarPlugin = {
          id: 'errorBars',
          afterDatasetsDraw(chart) {
            const ctx = chart.ctx;

            chart.data.datasets.forEach((dataset, datasetIndex) => {
              const meta = chart.getDatasetMeta(datasetIndex);
              const baseColor = dataset.borderColor;

              meta.data.forEach((point, index) => {
                const data = dataset.data[index];
                if (!data || data.xMin === undefined || data.xMax === undefined) return;

                const xScale = chart.scales.x;
                const yPos = point.y;
                const xMin = xScale.getPixelForValue(data.xMin);
                const xMax = xScale.getPixelForValue(data.xMax);

                ctx.save();
                ctx.strokeStyle = baseColor;
                ctx.lineWidth = data.isHighlighted ? 3 : 1;
                ctx.globalAlpha = data.isHighlighted ? 1 : 0.15;

                // Draw horizontal line (the range bar)
                ctx.beginPath();
                ctx.moveTo(xMin, yPos);
                ctx.lineTo(xMax, yPos);
                ctx.stroke();

                // Draw caps at ends
                const capHeight = data.isHighlighted ? 10 : 6;
                ctx.beginPath();
                ctx.moveTo(xMin, yPos - capHeight/2);
                ctx.lineTo(xMin, yPos + capHeight/2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(xMax, yPos - capHeight/2);
                ctx.lineTo(xMax, yPos + capHeight/2);
                ctx.stroke();

                ctx.restore();
              });
            });
          }
        };

        // Generate per-point colours based on highlight state
        const threatBgColors = threatData.map(d =>
          d.isHighlighted ? dangerColor + 'cc' : dangerColor + '20'
        );
        const threatBorderColors = threatData.map(d =>
          d.isHighlighted ? dangerColor : dangerColor + '40'
        );
        const opportunityBgColors = opportunityData.map(d =>
          d.isHighlighted ? successColor + 'cc' : successColor + '20'
        );
        const opportunityBorderColors = opportunityData.map(d =>
          d.isHighlighted ? successColor : successColor + '40'
        );
        const threatRadii = threatData.map(d => d.isHighlighted ? 10 : 6);
        const opportunityRadii = opportunityData.map(d => d.isHighlighted ? 10 : 6);

        chartInstanceRef.current = new Chart(ctx, {
          type: 'scatter',
          data: {
            datasets: [
              {
                label: 'Threats',
                data: threatData,
                backgroundColor: threatBgColors,
                borderColor: threatBorderColors,
                borderWidth: 2,
                pointRadius: threatRadii,
                pointHoverRadius: 12
              },
              {
                label: 'Opportunities',
                data: opportunityData,
                backgroundColor: opportunityBgColors,
                borderColor: opportunityBorderColors,
                borderWidth: 2,
                pointRadius: opportunityRadii,
                pointHoverRadius: 12
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: 'top',
                labels: { usePointStyle: true, padding: 20 }
              },
              title: {
                display: true,
                text: `Risk Priority: Likelihood vs ${viewMode === 'cost' ? 'Cost' : 'Time'} Impact`,
                font: { size: 14, weight: '500' }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const data = context.raw;
                    return [
                      `${data.name}`,
                      `Likelihood: ${data.y.toFixed(0)}%`,
                      `Impact Range: ${formatNumber(data.xMin)} - ${formatNumber(data.xMax)}`,
                      `Expected: ${formatNumber(data.x)}`,
                      `EMV: ${formatNumber(Math.abs(data.emv))}`
                    ];
                  }
                }
              }
            },
            scales: {
              x: {
                type: 'linear',
                position: 'bottom',
                title: {
                  display: true,
                  text: viewMode === 'cost' ? 'Cost Impact (Opportunities ← 0 → Threats)' : 'Time Impact (Opportunities ← 0 → Threats)'
                },
                min: xAxisBounds.min,
                max: xAxisBounds.max,
                grid: { display: true, color: 'rgba(0,0,0,0.05)' }
              },
              y: {
                type: 'linear',
                title: {
                  display: true,
                  text: 'Likelihood (%)'
                },
                min: 0,
                max: 100,
                grid: { display: true, color: 'rgba(0,0,0,0.05)' }
              }
            }
          },
          plugins: [errorBarPlugin]
        });

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [priorityData, viewMode, risks.length, highlightedRisk, xAxisBounds]);

      if (isSimulating) {
        return (
          <div className="card p-8 text-center animate-fade-in">
            <div style={{ fontSize: '14px', color: 'var(--text-muted)' }}>Loading...</div>
          </div>
        );
      }

      if (risks.length === 0) {
        return (
          <div className="card p-8 text-center animate-fade-in">
            <div style={{ fontSize: '14px', color: 'var(--text-muted)' }}>Add risks in the Risk Register tab to see the Priority Chart.</div>
          </div>
        );
      }

      // Sort by EMV magnitude for the table
      const sortedByPriority = [...priorityData].sort((a, b) => Math.abs(b.emv) - Math.abs(a.emv));

      return (
        <div className="animate-fade-in">
          {/* Controls */}
          <div style={{ display: 'flex', gap: '16px', marginBottom: '16px', flexWrap: 'wrap' }}>
            <div className="chart-toggle">
              <button
                className={`btn btn-secondary ${viewMode === 'cost' ? 'active' : ''}`}
                onClick={() => setViewMode('cost')}
              >
                Cost Impact
              </button>
              <button
                className={`btn btn-secondary ${viewMode === 'time' ? 'active' : ''}`}
                onClick={() => setViewMode('time')}
              >
                Time Impact
              </button>
            </div>
            <div className="chart-toggle">
              <button
                className={`btn btn-secondary ${!usePostAction ? 'active' : ''}`}
                onClick={() => setUsePostAction(false)}
              >
                Pre-Action
              </button>
              <button
                className={`btn btn-secondary ${usePostAction ? 'active' : ''}`}
                onClick={() => setUsePostAction(true)}
              >
                Post-Action
              </button>
            </div>
          </div>

          {/* Chart */}
          <div className="card" style={{ padding: '16px', marginBottom: '16px' }}>
            <div className="chart-container" style={{ height: '400px' }}>
              <canvas ref={chartRef}></canvas>
            </div>

            {/* Interpretation Guide */}
            <div style={{
              marginTop: '16px',
              padding: '12px 16px',
              background: 'var(--bg-secondary)',
              borderRadius: 'var(--radius-md)',
              fontSize: '12px',
              color: 'var(--text-muted)'
            }}>
              <strong style={{ color: 'var(--text-secondary)' }}>Reading the chart:</strong> Each point shows the expected impact (centre) with horizontal bars indicating the min-max range.
              Wider bars = more uncertainty. Upper-right quadrant = high priority threats. Lower values = lower priority.
            </div>
          </div>

          {/* Priority Table */}
          <div className="card" style={{ padding: '16px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
              <h3 style={{ fontSize: '14px', fontWeight: '600', color: 'var(--text-primary)', margin: 0 }}>
                Priority Ranking (by EMV)
              </h3>
              {highlightedRisk && (
                <button
                  className="btn btn-secondary btn-sm"
                  onClick={() => setHighlightedRisk(null)}
                  style={{ fontSize: '11px', padding: '4px 10px' }}
                >
                  Clear highlight
                </button>
              )}
            </div>
            <p style={{ fontSize: '11px', color: 'var(--text-muted)', marginBottom: '12px' }}>
              Click a row to highlight that risk in the chart. Click again to toggle off.
            </p>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px' }}>
              <thead>
                <tr style={{ borderBottom: '1px solid var(--border-primary)' }}>
                  <th style={{ padding: '8px', textAlign: 'left', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Rank</th>
                  <th style={{ padding: '8px', textAlign: 'left', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Risk</th>
                  <th style={{ padding: '8px', textAlign: 'left', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Type</th>
                  <th style={{ padding: '8px', textAlign: 'left', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Dist.</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Likelihood</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Min</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Likely</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>Max</th>
                  <th style={{ padding: '8px', textAlign: 'right', fontWeight: '600', color: 'var(--text-muted)', textTransform: 'uppercase', fontSize: '10px' }}>EMV</th>
                </tr>
              </thead>
              <tbody>
                {sortedByPriority.map((risk, idx) => {
                  const isHighlighted = highlightedRisk === risk.id;
                  const isDimmed = highlightedRisk !== null && !isHighlighted;
                  return (
                    <tr
                      key={risk.id}
                      onClick={() => setHighlightedRisk(isHighlighted ? null : risk.id)}
                      style={{
                        borderBottom: '1px solid var(--border-secondary)',
                        cursor: 'pointer',
                        background: isHighlighted ? 'var(--accent-light)' : 'transparent',
                        opacity: isDimmed ? 0.4 : 1,
                        transition: 'all 0.15s ease'
                      }}
                      onMouseEnter={(e) => {
                        if (!isHighlighted) e.currentTarget.style.background = 'var(--bg-hover)';
                      }}
                      onMouseLeave={(e) => {
                        if (!isHighlighted) e.currentTarget.style.background = 'transparent';
                      }}
                    >
                      <td style={{ padding: '8px', color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>{idx + 1}</td>
                      <td style={{ padding: '8px', color: 'var(--text-primary)', fontWeight: isHighlighted ? '600' : '500' }}>{risk.name}</td>
                      <td style={{ padding: '8px' }}>
                        <span style={{
                          fontSize: '10px',
                          fontWeight: '600',
                          padding: '2px 6px',
                          borderRadius: '4px',
                          background: risk.type === 'threat' ? 'var(--danger-light)' : 'var(--success-light)',
                          color: risk.type === 'threat' ? 'var(--danger)' : 'var(--success)'
                        }}>
                          {risk.type}
                        </span>
                      </td>
                      <td style={{ padding: '8px' }}>
                        <span style={{
                          fontSize: '10px',
                          fontWeight: '500',
                          padding: '2px 6px',
                          borderRadius: '4px',
                          background: 'var(--bg-secondary)',
                          color: 'var(--text-muted)'
                        }}>
                          {DISTRIBUTION_TYPES[risk.distributionType]?.name || 'Tri'}
                        </span>
                      </td>
                      <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--text-secondary)' }}>
                        {risk.likelihood.toFixed(0)}%
                      </td>
                      <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)' }}>
                        {formatNumber(risk.min)}
                      </td>
                      <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: risk.distributionType === 'uniform' ? 'var(--text-faint)' : 'var(--text-secondary)' }}>
                        {risk.distributionType === 'uniform' ? '-' : formatNumber(risk.likely)}
                      </td>
                      <td style={{ padding: '8px', textAlign: 'right', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)' }}>
                        {formatNumber(risk.max)}
                      </td>
                      <td style={{
                        padding: '8px',
                        textAlign: 'right',
                        fontFamily: 'var(--font-mono)',
                        fontWeight: '600',
                        color: risk.type === 'threat' ? 'var(--danger)' : 'var(--success)'
                      }}>
                        {formatNumber(Math.abs(risk.emv))}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // ============================================
    // MONTE CARLO PANEL COMPONENT (Tab 3)
    // ============================================
    const MonteCarloPanel = ({ simulationResults, risks, isSimulating }) => {
      const [viewMode, setViewMode] = useState('cost');
      const [prePValue, setPrePValue] = useState(80);
      const [postPValue, setPostPValue] = useState(80);
      const histogramChartRef = useRef(null);
      const cdfChartRef = useRef(null);
      const histogramInstanceRef = useRef(null);
      const cdfInstanceRef = useRef(null);

      // Determine if we have valid data to display
      const hasValidData = simulationResults && risks.length > 0 && !isSimulating;

      // Get pre-action and post-action data (use empty arrays as fallback)
      const preData = hasValidData
        ? (viewMode === 'cost' ? simulationResults.preAction.costResults : simulationResults.preAction.timeResults)
        : [];
      const postData = hasValidData
        ? (viewMode === 'cost' ? simulationResults.postAction.costResults : simulationResults.postAction.timeResults)
        : [];

      // All hooks must be called unconditionally (before any early returns)
      const preStats = useMemo(() => preData.length > 0 ? calculateStatistics(preData) : { sorted: [], mean: 0, min: 0, max: 0, p10: 0, p50: 0, p80: 0, p90: 0 }, [preData]);
      const postStats = useMemo(() => postData.length > 0 ? calculateStatistics(postData) : { sorted: [], mean: 0, min: 0, max: 0, p10: 0, p50: 0, p80: 0, p90: 0 }, [postData]);

      const preHistogramData = useMemo(() => preData.length > 0 ? createHistogramData(preData) : { labels: [], histogram: [] }, [preData]);
      const postHistogramData = useMemo(() => postData.length > 0 ? createHistogramData(postData) : { labels: [], histogram: [] }, [postData]);

      const preCdfData = useMemo(() => preStats.sorted.length > 0 ? createCDFData(preStats.sorted) : { xValues: [], yValues: [] }, [preStats.sorted]);
      const postCdfData = useMemo(() => postStats.sorted.length > 0 ? createCDFData(postStats.sorted) : { xValues: [], yValues: [] }, [postStats.sorted]);

      const preValueAtP = useMemo(() => preStats.sorted.length > 0 ? getValueAtPercentile(preStats.sorted, prePValue) : 0, [preStats.sorted, prePValue]);
      const postValueAtP = useMemo(() => postStats.sorted.length > 0 ? getValueAtPercentile(postStats.sorted, postPValue) : 0, [postStats.sorted, postPValue]);

      const reduction = preValueAtP !== 0 ? ((preValueAtP - postValueAtP) / Math.abs(preValueAtP) * 100) : 0;

      // Create/Update Histogram Chart with both pre and post action bars
      useEffect(() => {
        if (!histogramChartRef.current || !hasValidData) return;

        if (histogramInstanceRef.current) {
          histogramInstanceRef.current.destroy();
        }

        const ctx = histogramChartRef.current.getContext('2d');
        const dangerColor = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim() || '#dc7c7c';
        const successColor = getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#22c55e';

        histogramInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: preHistogramData.labels,
            datasets: [
              {
                label: 'Pre-Action',
                data: preHistogramData.histogram,
                backgroundColor: dangerColor + '80',
                borderColor: dangerColor,
                borderWidth: 1
              },
              {
                label: 'Post-Action',
                data: postHistogramData.histogram,
                backgroundColor: successColor + '80',
                borderColor: successColor,
                borderWidth: 1
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: 'top',
                labels: { usePointStyle: true, padding: 20 }
              },
              title: {
                display: true,
                text: `${viewMode === 'cost' ? 'Cost' : 'Time'} Impact Distribution (10,000 iterations)`,
                font: { size: 14, weight: '500' }
              }
            },
            scales: {
              x: {
                title: { display: true, text: viewMode === 'cost' ? 'Cost Impact' : 'Time Impact (days)' },
                grid: { display: false }
              },
              y: {
                title: { display: true, text: 'Frequency' },
                beginAtZero: true
              }
            }
          }
        });

        return () => {
          if (histogramInstanceRef.current) {
            histogramInstanceRef.current.destroy();
          }
        };
      }, [preHistogramData, postHistogramData, viewMode, hasValidData]);

      // Create/Update CDF Chart with both pre and post action curves
      useEffect(() => {
        if (!cdfChartRef.current || !hasValidData) return;

        if (cdfInstanceRef.current) {
          cdfInstanceRef.current.destroy();
        }

        const ctx = cdfChartRef.current.getContext('2d');
        const dangerColor = getComputedStyle(document.documentElement).getPropertyValue('--danger').trim() || '#dc7c7c';
        const successColor = getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#22c55e';

        cdfInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: preCdfData.xValues,
            datasets: [
              {
                label: 'Pre-Action',
                data: preCdfData.xValues.map((x, i) => ({ x, y: preCdfData.yValues[i] })),
                borderColor: dangerColor,
                backgroundColor: dangerColor + '20',
                fill: false,
                tension: 0.3,
                pointRadius: 0,
                borderWidth: 2
              },
              {
                label: 'Post-Action',
                data: postCdfData.xValues.map((x, i) => ({ x, y: postCdfData.yValues[i] })),
                borderColor: successColor,
                backgroundColor: successColor + '20',
                fill: false,
                tension: 0.3,
                pointRadius: 0,
                borderWidth: 2
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: 'top',
                labels: { usePointStyle: true, padding: 20 }
              },
              title: {
                display: true,
                text: `${viewMode === 'cost' ? 'Cost' : 'Time'} Impact - Pre vs Post Action S-Curves`,
                font: { size: 14, weight: '500' }
              }
            },
            scales: {
              x: {
                type: 'linear',
                title: { display: true, text: viewMode === 'cost' ? 'Cost Impact' : 'Time Impact (days)' },
                grid: { display: false }
              },
              y: {
                title: { display: true, text: 'Cumulative Probability (%)' },
                min: 0,
                max: 100
              }
            }
          }
        });

        return () => {
          if (cdfInstanceRef.current) {
            cdfInstanceRef.current.destroy();
          }
        };
      }, [preCdfData, postCdfData, viewMode, hasValidData]);

      // Early returns AFTER all hooks have been called
      if (isSimulating) {
        return (
          <div className="card p-8 text-center animate-fade-in">
            <div style={{ fontSize: '14px', color: 'var(--text-muted)' }}>Running simulation (10,000 iterations)...</div>
          </div>
        );
      }

      if (!simulationResults || risks.length === 0) {
        return (
          <div className="card p-8 text-center animate-fade-in">
            <div style={{ fontSize: '14px', color: 'var(--text-muted)' }}>Add risks in the Risk Register tab to see Monte Carlo results.</div>
          </div>
        );
      }

      const presets = [10, 50, 80, 90];

      const StatComparison = ({ label, preValue, postValue }) => {
        const diff = preValue - postValue;
        const improved = diff > 0;
        return (
          <div className="stat-item" style={{ textAlign: 'left' }}>
            <div className="stat-label">{label}</div>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'baseline' }}>
              <span style={{ fontSize: '14px', color: 'var(--danger)', fontFamily: 'var(--font-mono)' }}>{formatNumber(preValue)}</span>
              <span style={{ fontSize: '12px', color: 'var(--text-faint)' }}>→</span>
              <span style={{ fontSize: '14px', color: 'var(--success)', fontFamily: 'var(--font-mono)' }}>{formatNumber(postValue)}</span>
              {diff !== 0 && (
                <span style={{ fontSize: '11px', color: improved ? 'var(--success)' : 'var(--danger)', fontWeight: '500' }}>
                  ({improved ? '↓' : '↑'}{formatNumber(Math.abs(diff))})
                </span>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="animate-fade-in">
          {/* View Mode Toggle */}
          <div className="chart-toggle" style={{ marginBottom: '16px' }}>
            <button
              className={`btn btn-secondary ${viewMode === 'cost' ? 'active' : ''}`}
              onClick={() => setViewMode('cost')}
            >
              Cost Impact
            </button>
            <button
              className={`btn btn-secondary ${viewMode === 'time' ? 'active' : ''}`}
              onClick={() => setViewMode('time')}
            >
              Time Impact
            </button>
          </div>

          {/* Statistics Comparison Panel */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '12px', marginBottom: '16px' }}>
            <StatComparison label="Mean" preValue={preStats.mean} postValue={postStats.mean} />
            <StatComparison label="P10" preValue={preStats.p10} postValue={postStats.p10} />
            <StatComparison label="P50 (Median)" preValue={preStats.p50} postValue={postStats.p50} />
            <StatComparison label="P80" preValue={preStats.p80} postValue={postStats.p80} />
            <StatComparison label="P90" preValue={preStats.p90} postValue={postStats.p90} />
            <StatComparison label="Max" preValue={preStats.max} postValue={postStats.max} />
          </div>

          {/* Legend */}
          <div style={{ display: 'flex', gap: '24px', marginBottom: '16px', fontSize: '12px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <div style={{ width: '12px', height: '3px', background: 'var(--danger)', borderRadius: '2px' }}></div>
              <span style={{ color: 'var(--text-muted)' }}>Pre-Action (before mitigation)</span>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <div style={{ width: '12px', height: '3px', background: 'var(--success)', borderRadius: '2px' }}></div>
              <span style={{ color: 'var(--text-muted)' }}>Post-Action (after mitigation)</span>
            </div>
          </div>

          {/* Histogram Chart */}
          <div className="card" style={{ padding: '16px', marginBottom: '16px' }}>
            <div className="chart-container" style={{ height: '280px' }}>
              <canvas ref={histogramChartRef}></canvas>
            </div>
          </div>

          {/* CDF Chart */}
          <div className="card" style={{ padding: '16px' }}>
            <div className="chart-container" style={{ height: '350px' }}>
              <canvas ref={cdfChartRef}></canvas>
            </div>

            {/* P-Value Comparison Summary */}
            <div style={{
              display: 'flex',
              justifyContent: 'center',
              alignItems: 'center',
              gap: '16px',
              padding: '12px 16px',
              marginTop: '16px',
              background: 'var(--bg-secondary)',
              borderRadius: 'var(--radius-md)'
            }}>
              <span style={{ color: 'var(--danger)', fontFamily: 'var(--font-mono)', fontSize: '14px', fontWeight: '500' }}>
                Pre P{prePValue}: {formatNumber(preValueAtP)}
              </span>
              <span style={{ color: 'var(--text-faint)' }}>→</span>
              <span style={{ color: 'var(--success)', fontFamily: 'var(--font-mono)', fontSize: '14px', fontWeight: '500' }}>
                Post P{postPValue}: {formatNumber(postValueAtP)}
              </span>
              {reduction !== 0 && (
                <span style={{
                  fontSize: '12px',
                  fontWeight: '600',
                  color: reduction > 0 ? 'var(--success)' : 'var(--danger)',
                  background: reduction > 0 ? 'var(--success-light)' : 'var(--danger-light)',
                  padding: '2px 8px',
                  borderRadius: 'var(--radius-sm)'
                }}>
                  {reduction > 0 ? '↓' : '↑'} {Math.abs(reduction).toFixed(1)}% {reduction > 0 ? 'reduction' : 'increase'}
                </span>
              )}
            </div>

            {/* P-Value Sliders */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px', marginTop: '16px' }}>
              {/* Pre-Action P-Value Slider */}
              <div className="p-slider-container" style={{ borderLeft: '3px solid var(--danger)', paddingLeft: '12px' }}>
                <div className="p-slider-header">
                  <span className="p-slider-label" style={{ color: 'var(--danger)' }}>Pre-Action P{prePValue}</span>
                  <span style={{ color: 'var(--danger)', fontFamily: 'var(--font-mono)', fontSize: '14px' }}>{formatNumber(preValueAtP)}</span>
                </div>
                <input
                  type="range"
                  className="p-slider"
                  min="1"
                  max="99"
                  value={prePValue}
                  onChange={(e) => setPrePValue(parseInt(e.target.value))}
                  style={{ accentColor: 'var(--danger)' }}
                />
                <div className="p-presets">
                  {presets.map(p => (
                    <button
                      key={p}
                      className={prePValue === p ? 'active' : ''}
                      onClick={() => setPrePValue(p)}
                      style={{ borderColor: prePValue === p ? 'var(--danger)' : undefined, color: prePValue === p ? 'var(--danger)' : undefined }}
                    >
                      P{p}
                    </button>
                  ))}
                </div>
              </div>

              {/* Post-Action P-Value Slider */}
              <div className="p-slider-container" style={{ borderLeft: '3px solid var(--success)', paddingLeft: '12px' }}>
                <div className="p-slider-header">
                  <span className="p-slider-label" style={{ color: 'var(--success)' }}>Post-Action P{postPValue}</span>
                  <span style={{ color: 'var(--success)', fontFamily: 'var(--font-mono)', fontSize: '14px' }}>{formatNumber(postValueAtP)}</span>
                </div>
                <input
                  type="range"
                  className="p-slider"
                  min="1"
                  max="99"
                  value={postPValue}
                  onChange={(e) => setPostPValue(parseInt(e.target.value))}
                  style={{ accentColor: 'var(--success)' }}
                />
                <div className="p-presets">
                  {presets.map(p => (
                    <button
                      key={p}
                      className={postPValue === p ? 'active' : ''}
                      onClick={() => setPostPValue(p)}
                      style={{ borderColor: postPValue === p ? 'var(--success)' : undefined, color: postPValue === p ? 'var(--success)' : undefined }}
                    >
                      P{p}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // SETTINGS PANEL COMPONENT
    // ============================================
    const SettingsPanel = ({ settings, onUpdate, onClose }) => {
      const [localSettings, setLocalSettings] = useState({ ...settings });

      const handleSave = () => {
        onUpdate(localSettings);
        onClose();
      };

      const updateSetting = (field, value) => {
        setLocalSettings(prev => ({ ...prev, [field]: value }));
      };

      // Common currency symbols
      const currencyOptions = [
        { value: '£', label: '£ (GBP)' },
        { value: '$', label: '$ (USD)' },
        { value: '€', label: '€ (EUR)' },
        { value: '¥', label: '¥ (JPY/CNY)' },
        { value: 'CHF', label: 'CHF' },
        { value: 'AUD', label: 'AUD' },
        { value: 'CAD', label: 'CAD' },
        { value: '', label: 'None (numeric only)' }
      ];

      // Common time units
      const timeUnitOptions = [
        { value: 'days', label: 'Days' },
        { value: 'weeks', label: 'Weeks' },
        { value: 'months', label: 'Months' },
        { value: 'hours', label: 'Hours' },
        { value: 'years', label: 'Years' }
      ];

      return (
        <>
          <div className="drawer-overlay" onClick={onClose} />
          <div className="drawer">
            <div className="drawer-header">
              <h2>Settings</h2>
              <button className="btn btn-secondary btn-icon" onClick={onClose}>
                <IconX />
              </button>
            </div>

            <div className="drawer-content custom-scroll">
              {/* Cost Impact Settings */}
              <div className="settings-section">
                <div className="settings-section-title">Cost Impact</div>

                <div className="settings-field">
                  <label>Currency Symbol</label>
                  <select
                    className="select-refined"
                    value={localSettings.costUnit}
                    onChange={(e) => updateSetting('costUnit', e.target.value)}
                    style={{ width: '100%' }}
                  >
                    {currencyOptions.map(opt => (
                      <option key={opt.value} value={opt.value}>{opt.label}</option>
                    ))}
                  </select>
                  <div className="hint">Displayed before cost values in charts and tables</div>
                </div>

                <div className="settings-field">
                  <label>Custom Currency (if not listed)</label>
                  <input
                    type="text"
                    className="input-refined"
                    value={localSettings.costUnit}
                    onChange={(e) => updateSetting('costUnit', e.target.value)}
                    placeholder="e.g. kr, R, ₹"
                    maxLength={5}
                    style={{ width: '100%' }}
                  />
                </div>

                <div className="settings-field">
                  <label>Cost Scale Label</label>
                  <input
                    type="text"
                    className="input-refined"
                    value={localSettings.costLabel}
                    onChange={(e) => updateSetting('costLabel', e.target.value)}
                    placeholder="e.g. Cost Impact, Budget Impact"
                    style={{ width: '100%' }}
                  />
                  <div className="hint">Label shown on chart axes (default: "Cost Impact")</div>
                </div>
              </div>

              {/* Time Impact Settings */}
              <div className="settings-section">
                <div className="settings-section-title">Time Impact</div>

                <div className="settings-field">
                  <label>Time Unit</label>
                  <select
                    className="select-refined"
                    value={localSettings.timeUnit}
                    onChange={(e) => updateSetting('timeUnit', e.target.value)}
                    style={{ width: '100%' }}
                  >
                    {timeUnitOptions.map(opt => (
                      <option key={opt.value} value={opt.value}>{opt.label}</option>
                    ))}
                  </select>
                  <div className="hint">Displayed after time values in charts and tables</div>
                </div>

                <div className="settings-field">
                  <label>Time Scale Label</label>
                  <input
                    type="text"
                    className="input-refined"
                    value={localSettings.timeLabel}
                    onChange={(e) => updateSetting('timeLabel', e.target.value)}
                    placeholder="e.g. Schedule Impact, Duration Impact"
                    style={{ width: '100%' }}
                  />
                  <div className="hint">Label shown on chart axes (default: "Time Impact")</div>
                </div>
              </div>

              {/* Simulation Settings */}
              <div className="settings-section">
                <div className="settings-section-title">Simulation</div>

                <div className="settings-field">
                  <label>Monte Carlo Iterations</label>
                  <select
                    className="select-refined"
                    value={localSettings.iterations}
                    onChange={(e) => updateSetting('iterations', parseInt(e.target.value))}
                    style={{ width: '100%' }}
                  >
                    <option value={1000}>1,000 (fast)</option>
                    <option value={5000}>5,000</option>
                    <option value={10000}>10,000 (default)</option>
                    <option value={25000}>25,000</option>
                    <option value={50000}>50,000 (slow)</option>
                  </select>
                  <div className="hint">More iterations = more accurate but slower</div>
                </div>

                <div className="settings-field">
                  <label>Default Distribution</label>
                  <select
                    className="select-refined"
                    value={localSettings.defaultDistribution}
                    onChange={(e) => updateSetting('defaultDistribution', e.target.value)}
                    style={{ width: '100%' }}
                  >
                    {Object.entries(DISTRIBUTION_TYPES).map(([key, { name, description }]) => (
                      <option key={key} value={key}>{name} - {description}</option>
                    ))}
                  </select>
                  <div className="hint">Default distribution type for new risks</div>
                </div>
              </div>
            </div>

            {/* Footer with Save/Cancel */}
            <div style={{
              padding: '16px 20px',
              borderTop: '1px solid var(--border-primary)',
              display: 'flex',
              gap: '12px',
              justifyContent: 'flex-end'
            }}>
              <button className="btn btn-secondary" onClick={onClose}>
                Cancel
              </button>
              <button className="btn btn-accent" onClick={handleSave}>
                <IconCheck /> Save Settings
              </button>
            </div>
          </div>
        </>
      );
    };

    // ============================================
    // MAIN RISK REGISTER COMPONENT
    // ============================================
    const RiskRegister = () => {
      // Load from localStorage
      const loadSaved = () => {
        try {
          const saved = localStorage.getItem('risk-register');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return null;
      };

      const saved = loadSaved();
      const [risks, setRisks] = useState(saved?.risks || []);
      const [theme, setTheme] = useState(localStorage.getItem('coffeecup-theme') || saved?.theme || 'blueprint');
      const [settings, setSettings] = useState(saved?.settings || {
        costUnit: '£',
        costLabel: 'Cost Impact',
        timeUnit: 'days',
        timeLabel: 'Time Impact',
        iterations: 10000,
        defaultDistribution: 'triangular'
      });
      const [expandedRisk, setExpandedRisk] = useState(null);
      const [simulationResults, setSimulationResults] = useState(null);
      const [isSimulating, setIsSimulating] = useState(false);
      const [activeTab, setActiveTab] = useState('register'); // 'register', 'tornado', 'montecarlo', 'priority'
      const [showSettings, setShowSettings] = useState(false);

      const fileInputRef = useRef(null);

      // Track if we need to run simulation (when risks change or switching to analysis tabs)
      const [simulationNeeded, setSimulationNeeded] = useState(false);

      // Apply theme and sync shared key
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('coffeecup-theme', theme);
      }, [theme]);

      // Auto-save to localStorage
      useEffect(() => {
        const data = { risks, theme, settings };
        localStorage.setItem('risk-register', JSON.stringify(data));
      }, [risks, theme, settings]);

      // ============================================
      // CRUD OPERATIONS
      // ============================================
      const addRisk = () => {
        const defaultDist = settings.defaultDistribution || 'triangular';
        const newRisk = {
          id: generateRiskId(risks),
          name: '',
          description: '',
          owner: '',
          type: 'threat',
          included: true,
          likelihood: 50,
          impactCost: { min: 0, likely: 0, max: 0 },
          impactTime: { min: 0, likely: 0, max: 0 },
          costDistribution: defaultDist,
          timeDistribution: defaultDist,
          actionName: '',
          actionDescription: '',
          postLikelihood: 50,
          postImpactCost: { min: 0, likely: 0, max: 0 },
          postImpactTime: { min: 0, likely: 0, max: 0 },
          postCostDistribution: defaultDist,
          postTimeDistribution: defaultDist
        };
        setRisks([...risks, newRisk]);
        setExpandedRisk(newRisk.id);
      };

      const updateRisk = (oldId, updates) => {
        setRisks(risks.map(r => r.id === oldId ? { ...r, ...updates } : r));
      };

      const deleteRisk = (id) => {
        setRisks(risks.filter(r => r.id !== id));
        if (expandedRisk === id) setExpandedRisk(null);
      };

      // ============================================
      // SIMULATION
      // ============================================
      const runSimulation = () => {
        const includedRisks = risks.filter(r => r.included !== false);
        if (includedRisks.length === 0 || isSimulating) return;

        setIsSimulating(true);
        setSimulationNeeded(false);

        // Run simulation in next tick to allow UI update
        const iterations = settings.iterations || 10000;
        setTimeout(() => {
          const results = runBothSimulations(includedRisks, iterations);
          setSimulationResults(results);
          setIsSimulating(false);
        }, 50);
      };

      // Mark simulation as needed when risks change
      useEffect(() => {
        if (risks.length > 0) {
          setSimulationNeeded(true);
          setSimulationResults(null);
        }
      }, [risks]);

      // Auto-run simulation when switching to analysis tabs (if needed)
      useEffect(() => {
        if ((activeTab === 'tornado' || activeTab === 'montecarlo' || activeTab === 'priority') && risks.length > 0) {
          if (simulationNeeded || !simulationResults) {
            runSimulation();
          }
        }
      }, [activeTab]);

      // Tab change handler
      const handleTabChange = (tab) => {
        setActiveTab(tab);
      };

      // ============================================
      // FILE OPERATIONS
      // ============================================
      const saveToFile = () => {
        const data = { risks, settings };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'risk-register.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      const loadFromFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.risks) {
              setRisks(data.risks);
              setSimulationResults(null);
            }
            if (data.settings) {
              setSettings(prev => ({ ...prev, ...data.settings }));
            }
          } catch (err) {
            alert('Error loading file. Please ensure it is a valid JSON file.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const clearAll = () => {
        if (confirm('Clear all risks? This cannot be undone.')) {
          setRisks([]);
          setExpandedRisk(null);
          setSimulationResults(null);
        }
      };

      return (
        <div className="min-h-screen p-6 md:p-8">
          <div className="max-w-7xl mx-auto">
            {/* Header */}
            <div className="mb-8 animate-fade-in">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="flex items-center gap-3">
                  <div className="app-header-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                      <line x1="12" y1="9" x2="12" y2="13"/>
                      <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                  </div>
                  <div>
                    <h1 className="text-2xl font-semibold text-primary tracking-tight">Risk Register</h1>
                    <p className="text-sm text-muted">Record risks and analyse</p>
                  </div>
                </div>

                {/* Theme Selector */}
                <div className="theme-selector">
                  <IconPalette />
                  <label>Theme</label>
                  <select
                    value={theme}
                    onChange={(e) => setTheme(e.target.value)}
                    className="select-refined"
                  >
                    {Object.entries(THEMES).map(([key, { name }]) => (
                      <option key={key} value={key}>{name}</option>
                    ))}
                  </select>
                </div>
              </div>
            </div>

            {/* Toolbar with Tabs */}
            <div className="card p-4 mb-6 animate-fade-in" style={{ animationDelay: '0.05s' }}>
              <div className="flex flex-wrap items-center gap-3">
                {/* Tab Navigation */}
                <div className="tab-navigation">
                  <button
                    className={`tab-button ${activeTab === 'register' ? 'active' : ''}`}
                    onClick={() => handleTabChange('register')}
                  >
                    <IconRisk />
                    Risk Register
                  </button>
                  <button
                    className={`tab-button ${activeTab === 'tornado' ? 'active' : ''}`}
                    onClick={() => handleTabChange('tornado')}
                  >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M21 4H3M18 8H6M15 12H9M12 16H12M9 20H15"/>
                    </svg>
                    Tornado
                  </button>
                  <button
                    className={`tab-button ${activeTab === 'montecarlo' ? 'active' : ''}`}
                    onClick={() => handleTabChange('montecarlo')}
                  >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <path d="M3 3v18h18"/>
                      <path d="M18 17V9"/>
                      <path d="M13 17V5"/>
                      <path d="M8 17v-3"/>
                    </svg>
                    Monte Carlo
                  </button>
                  <button
                    className={`tab-button ${activeTab === 'priority' ? 'active' : ''}`}
                    onClick={() => handleTabChange('priority')}
                  >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                      <circle cx="12" cy="12" r="10"/>
                      <circle cx="12" cy="12" r="6"/>
                      <circle cx="12" cy="12" r="2"/>
                    </svg>
                    Priority
                  </button>
                </div>

                <div className="flex-1"></div>

                {/* Action Buttons - only show on register tab */}
                {activeTab === 'register' && (
                  <>
                    <button className="btn btn-accent" onClick={addRisk}>
                      <IconPlus /> Add Risk
                    </button>
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".json"
                      onChange={loadFromFile}
                      className="hidden"
                    />
                    <button
                      className="btn btn-secondary btn-sm"
                      onClick={saveToFile}
                      title="Save file"
                    >
                      <IconDownload /> Save
                    </button>
                    <button
                      className="btn btn-secondary btn-sm"
                      onClick={() => fileInputRef.current?.click()}
                      title="Open file"
                    >
                      <IconUpload /> Open
                    </button>
                    <button
                      className="btn btn-danger btn-sm"
                      onClick={clearAll}
                      title="Clear all risks"
                    >
                      <IconTrash /> Clear
                    </button>
                  </>
                )}

                {/* Settings Button - always visible */}
                <button
                  className="btn btn-secondary btn-sm"
                  onClick={() => setShowSettings(true)}
                  title="Settings"
                >
                  <IconSettings /> Settings
                </button>
              </div>
            </div>

            {/* Tab Content */}
            <div className="tab-content">
              {/* Risk Register Tab */}
              {activeTab === 'register' && (
                <div className="card mb-6 animate-fade-in" style={{ overflow: 'hidden' }}>
                  {risks.length === 0 ? (
                    <div style={{ padding: '48px 24px', textAlign: 'center' }}>
                      <div style={{
                        width: '64px',
                        height: '64px',
                        margin: '0 auto 16px',
                        borderRadius: '50%',
                        background: 'var(--bg-secondary)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center'
                      }}>
                        <IconRisk />
                      </div>
                      <p style={{ color: 'var(--text-muted)', marginBottom: '16px' }}>
                        No risks added yet. Add your first risk to get started.
                      </p>
                      <button className="btn btn-accent" onClick={addRisk}>
                    <IconPlus /> Add Risk
                  </button>
                </div>
              ) : (
                  <div style={{ overflowX: 'auto' }}>
                    <table className="risk-table">
                      <thead>
                        <tr>
                          <th style={{ width: '50px' }}>Include</th>
                          <th style={{ width: '80px' }}>ID</th>
                          <th>Name</th>
                          <th style={{ width: '120px' }}>Type</th>
                          <th style={{ width: '120px' }}>Owner</th>
                          <th style={{ width: '80px' }}>Likelihood</th>
                          <th style={{ width: '280px' }}>Cost Impact</th>
                          <th style={{ width: '280px' }}>Time Impact</th>
                          <th style={{ width: '60px' }}></th>
                        </tr>
                      </thead>
                      <tbody>
                        {risks.map(risk => (
                          <RiskRow
                            key={risk.id}
                            risk={risk}
                            isExpanded={expandedRisk === risk.id}
                            onToggleExpand={setExpandedRisk}
                            onUpdate={updateRisk}
                            onDelete={deleteRisk}
                          />
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
              )}

              {/* Tornado Chart Tab */}
              {activeTab === 'tornado' && (
                <TornadoPanel risks={risks.filter(r => r.included !== false)} isSimulating={isSimulating} />
              )}

              {/* Monte Carlo Tab */}
              {activeTab === 'montecarlo' && (
                <MonteCarloPanel
                  simulationResults={simulationResults}
                  risks={risks.filter(r => r.included !== false)}
                  isSimulating={isSimulating}
                />
              )}

              {/* Priority Tab */}
              {activeTab === 'priority' && (
                <PriorityPanel
                  risks={risks.filter(r => r.included !== false)}
                  isSimulating={isSimulating}
                />
              )}
            </div>
          </div>

          {/* Settings Panel */}
          {showSettings && (
            <SettingsPanel
              settings={settings}
              onUpdate={setSettings}
              onClose={() => setShowSettings(false)}
            />
          )}
        </div>
      );
    };

    // ============================================
    // RENDER
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RiskRegister />);
  </script>
</body>
</html>
