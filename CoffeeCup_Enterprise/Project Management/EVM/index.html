<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ============================================
        // CONSTANTS
        // ============================================
        const COST_KEY = 'cost-project';
        const GANTT_KEY = 'gantt-project';
        const THEMES = ['blueprint', 'fun', 'dark', 'traditional'];
        const THEME_LABELS = { blueprint: 'Architectural Blueprint', fun: 'Fun & Vibrant', dark: 'Dark Mode', traditional: 'Traditional' };

        // ============================================
        // UTILITIES
        // ============================================
        function fmt(amount, sym = '£') {
            if (amount == null || isNaN(amount)) return `${sym}0`;
            const abs = Math.abs(amount);
            if (abs >= 1000000) return `${amount < 0 ? '-' : ''}${sym}${(abs / 1000000).toFixed(1)}m`;
            if (abs >= 1000) return `${amount < 0 ? '-' : ''}${sym}${(abs / 1000).toFixed(0)}k`;
            return `${amount < 0 ? '-' : ''}${sym}${abs.toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
        }

        function fmtFull(amount, sym = '£') {
            if (amount == null || isNaN(amount)) return `${sym}0.00`;
            const abs = Math.abs(amount);
            return `${amount < 0 ? '-' : ''}${sym}${abs.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function fmtIdx(val) {
            if (val == null || isNaN(val) || !isFinite(val)) return '—';
            return val.toFixed(2);
        }

        function fmtPct(val) {
            if (val == null || isNaN(val)) return '—';
            return `${(val * 100).toFixed(1)}%`;
        }

        function statusColor(cpi, spi) {
            if (cpi >= 1.0 && spi >= 1.0) return 'green';
            if (cpi >= 0.9 && spi >= 0.9) return 'amber';
            return 'red';
        }

        function indexColor(val) {
            if (val == null || isNaN(val) || !isFinite(val)) return 'var(--text-muted)';
            if (val >= 1.0) return 'var(--success)';
            if (val >= 0.9) return 'var(--warning)';
            return 'var(--danger)';
        }

        function varianceColor(val) {
            if (val == null || isNaN(val)) return 'var(--text-muted)';
            if (val >= 0) return 'var(--success)';
            return 'var(--danger)';
        }

        // ============================================
        // DATA LOADING
        // ============================================
        function loadCostData() {
            try {
                const raw = localStorage.getItem(COST_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { console.warn('EVM: Failed to load cost data', e); }
            return null;
        }

        function loadGanttData() {
            try {
                const raw = localStorage.getItem(GANTT_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { console.warn('EVM: Failed to load gantt data', e); }
            return null;
        }

        // ============================================
        // EVM CALCULATIONS (mirrors Cost Tracker)
        // ============================================
        function calcEVM(costData) {
            if (!costData) return null;
            const cats = costData.categories || [];
            const transactions = costData.transactions || [];
            const periods = (costData.timePhased && costData.timePhased.periods) || [];
            const sym = costData.meta?.currencySymbol || '£';

            const BAC = cats.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + (li.totalCost || 0), 0), 0);
            const AC = transactions.reduce((s, t) => s + (t.amount || 0), 0);
            const EV = cats.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + ((li.percentComplete || 0) / 100) * (li.totalCost || 0), 0), 0);

            const now = new Date();
            const PV = periods.filter(p => new Date(p.endDate) <= now).reduce((s, p) => s + (p.planned || 0), 0);

            const CV = EV - AC;
            const SV = EV - PV;
            const CPI = AC !== 0 ? EV / AC : 0;
            const SPI = PV !== 0 ? EV / PV : 0;
            const EAC = CPI !== 0 ? BAC / CPI : 0;
            const ETC = EAC - AC;
            const VAC = BAC - EAC;
            const TCPI = (BAC - AC) !== 0 ? (BAC - EV) / (BAC - AC) : 0;
            const pctComplete = BAC !== 0 ? (EV / BAC) * 100 : 0;
            const pctSpent = BAC !== 0 ? (AC / BAC) * 100 : 0;

            return { BAC, AC, EV, PV, CV, SV, CPI, SPI, EAC, ETC, VAC, TCPI, pctComplete, pctSpent, sym, periods };
        }

        function calcScheduleMetrics(ganttData) {
            if (!ganttData || !ganttData.activities || ganttData.activities.length === 0) return null;
            const acts = ganttData.activities;
            const startDate = ganttData.startDate ? new Date(ganttData.startDate) : new Date();
            const totalDuration = acts.reduce((max, a, i) => {
                // Simple: recompute without full dependency resolution (use ganttData.criticalPath.length if available)
                return Math.max(max, a.duration || 0);
            }, 0);

            const cp = ganttData.criticalPath || {};
            const criticalPathLength = cp.length || totalDuration;
            const criticalActivities = cp.activityIds || [];

            const now = new Date();
            const elapsed = Math.max(0, Math.floor((now - startDate) / (1000 * 60 * 60 * 24)));
            const schedulePct = criticalPathLength > 0 ? Math.min(100, (elapsed / criticalPathLength) * 100) : 0;

            return { totalActivities: acts.length, criticalPathLength, criticalActivities, startDate, elapsed, schedulePct };
        }

        // ============================================
        // GAUGE COMPONENT
        // ============================================
        function Gauge({ value, label, size = 120 }) {
            const radius = (size - 16) / 2;
            const circumference = 2 * Math.PI * radius;
            const displayVal = (value == null || isNaN(value) || !isFinite(value)) ? 0 : value;
            const clamped = Math.min(Math.max(displayVal, 0), 2);
            const offset = circumference - (clamped / 2) * circumference; // 0-2 range fills the circle
            const color = indexColor(displayVal);

            return (
                <div className="gauge-container">
                    <div className="gauge-ring" style={{ width: size, height: size }}>
                        <svg width={size} height={size}>
                            <circle className="bg" cx={size / 2} cy={size / 2} r={radius} />
                            <circle className="fg" cx={size / 2} cy={size / 2} r={radius}
                                stroke={color} strokeDasharray={circumference} strokeDashoffset={offset} />
                        </svg>
                        <div className="gauge-center">
                            <span className="gauge-value" style={{ color }}>{fmtIdx(displayVal)}</span>
                            <span className="gauge-label">{label}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // S-CURVE CHART
        // ============================================
        function SCurveChart({ evm }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !evm || !evm.periods || evm.periods.length === 0) return;

                const periods = evm.periods;
                const labels = periods.map(p => p.label || p.id);

                // Cumulative values
                let cumPV = 0, cumAC = 0, cumEV = 0;
                const pvData = [], acData = [], evData = [];
                const now = new Date();

                periods.forEach(p => {
                    cumPV += p.planned || 0;
                    pvData.push(cumPV);
                    if (new Date(p.endDate) <= now) {
                        cumEV += p.earned || 0;
                        cumAC += p.actual || 0;
                    }
                    evData.push(new Date(p.endDate) <= now ? cumEV : null);
                    acData.push(new Date(p.endDate) <= now ? cumAC : null);
                });

                // Get theme colours
                const style = getComputedStyle(document.documentElement);
                const textMuted = style.getPropertyValue('--text-muted').trim() || '#78716c';
                const borderSec = style.getPropertyValue('--border-secondary').trim() || '#f5f5f4';
                const bgCard = style.getPropertyValue('--bg-card').trim() || '#ffffff';

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(canvasRef.current, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [
                            {
                                label: 'Planned Value (PV)', data: pvData, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)',
                                borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 5, fill: true, tension: 0.3
                            },
                            {
                                label: 'Earned Value (EV)', data: evData, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.08)',
                                borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 5, fill: true, tension: 0.3
                            },
                            {
                                label: 'Actual Cost (AC)', data: acData, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.08)',
                                borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 5, fill: true, tension: 0.3
                            },
                        ],
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { position: 'top', labels: { usePointStyle: true, padding: 16, font: { size: 12 }, color: textMuted } },
                            tooltip: {
                                backgroundColor: bgCard, titleColor: textMuted, bodyColor: textMuted, borderColor: borderSec, borderWidth: 1,
                                padding: 12, cornerRadius: 8, usePointStyle: true,
                                callbacks: { label: ctx => ` ${ctx.dataset.label}: ${evm.sym}${(ctx.parsed.y || 0).toLocaleString()}` }
                            },
                        },
                        scales: {
                            x: { grid: { color: borderSec }, ticks: { color: textMuted, font: { size: 11 }, maxRotation: 45 } },
                            y: {
                                grid: { color: borderSec }, ticks: {
                                    color: textMuted, font: { size: 11 },
                                    callback: v => fmt(v, evm.sym)
                                }, beginAtZero: true
                            },
                        },
                    },
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [evm]);

            return <canvas ref={canvasRef} />;
        }

        // ============================================
        // MAIN APP
        // ============================================
        function App() {
            const [theme, setTheme] = useState(localStorage.getItem('coffeecup-theme') || 'blueprint');
            const [lastRefresh, setLastRefresh] = useState(Date.now());

            // Apply theme
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('coffeecup-theme', theme);
            }, [theme]);

            // On mount: check shared theme
            useEffect(() => {
                const shared = localStorage.getItem('coffeecup-theme');
                if (shared && shared !== theme) setTheme(shared);
            }, []);

            // Load data
            const costData = useMemo(() => loadCostData(), [lastRefresh]);
            const ganttData = useMemo(() => loadGanttData(), [lastRefresh]);
            const evm = useMemo(() => calcEVM(costData), [costData]);
            const schedule = useMemo(() => calcScheduleMetrics(ganttData), [ganttData]);

            const refresh = () => setLastRefresh(Date.now());

            const sym = evm?.sym || costData?.meta?.currencySymbol || '£';
            const hasData = evm && evm.BAC > 0;
            const status = hasData ? statusColor(evm.CPI, evm.SPI) : 'blue';

            // Save minimal EVM state for PMPlan integration
            useEffect(() => {
                if (evm) {
                    localStorage.setItem('evm-project', JSON.stringify({
                        ...evm,
                        criticalPathLength: schedule?.criticalPathLength || 0,
                        criticalActivities: schedule?.criticalActivities?.length || 0,
                        scheduleElapsed: schedule?.elapsed || 0,
                        schedulePct: schedule?.schedulePct || 0,
                        lastUpdated: new Date().toISOString()
                    }));
                }
            }, [evm, schedule]);

            return (
                <div className="min-h-screen p-6 md:p-8">
                    <div className="max-w-7xl mx-auto">

                        {/* Header */}
                        <div className="app-header no-print animate-in">
                            <div className="app-header-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <polyline points="4,20 10,14 14,16 20,8" /><polyline points="14,8 20,8 20,14" />
                                </svg>
                            </div>
                            <div>
                                <div className="app-header-title">EVM Dashboard</div>
                                <div className="app-header-sub">Earned Value Management — Project Performance</div>
                            </div>
                            <div className="app-header-spacer" />

                            <div className="flex items-center gap-3 no-print">
                                <button className="btn btn-secondary" onClick={refresh} title="Refresh data from Cost Tracker & Gantt">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10" /><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" /></svg>
                                    Refresh
                                </button>
                                <div className="flex items-center gap-2">
                                    <label style={{ fontSize: 12, color: 'var(--text-muted)' }}>Theme</label>
                                    <select className="select-refined" value={theme} onChange={e => setTheme(e.target.value)} style={{ width: 140 }}>
                                        {THEMES.map(t => <option key={t} value={t}>{THEME_LABELS[t]}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {!hasData ? (
                            /* ============ EMPTY STATE ============ */
                            <div className="card empty-banner animate-in" style={{ animationDelay: '0.1s' }}>
                                <div className="empty-banner-icon">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <polyline points="4,20 10,14 14,16 20,8" /><polyline points="14,8 20,8 20,14" />
                                    </svg>
                                </div>
                                <p style={{ fontSize: 15, fontWeight: 500, color: 'var(--text-secondary)', marginBottom: 4 }}>No EVM Data Available</p>
                                <p style={{ fontSize: 13, maxWidth: 400, margin: '0 auto', lineHeight: 1.6 }}>
                                    Open the <strong>Cost Tracker</strong> to add budget items, transactions, and time-phased data.
                                    Open the <strong>Gantt Chart</strong> to build your schedule. Data will appear here automatically.
                                </p>
                            </div>
                        ) : (
                            <>
                                {/* ============ STATUS BANNER ============ */}
                                <div className="card p-4 mb-6 animate-in" style={{ animationDelay: '0.05s', display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                                    <span className={`badge badge-${status}`}>
                                        {status === 'green' ? '● On Track' : status === 'amber' ? '● At Risk' : '● Over Budget / Behind'}
                                    </span>
                                    <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                                        {evm.pctComplete.toFixed(1)}% earned • {evm.pctSpent.toFixed(1)}% spent
                                    </span>
                                    {schedule && (
                                        <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                                            • Day {schedule.elapsed} of {schedule.criticalPathLength} ({schedule.schedulePct.toFixed(0)}% elapsed)
                                        </span>
                                    )}
                                    <div style={{ flex: 1 }} />
                                    <span style={{ fontSize: 11, color: 'var(--text-faint)' }}>
                                        Data from: {costData?.meta?.name || 'Cost Tracker'}
                                    </span>
                                </div>

                                {/* ============ KPI CARDS ============ */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                    {[
                                        { label: 'Budget at Completion', value: fmt(evm.BAC, sym), sub: 'BAC — Total planned budget', icon: '📊', color: 'var(--info)' },
                                        { label: 'Planned Value', value: fmt(evm.PV, sym), sub: 'PV — Value planned to date', icon: '📅', color: '#3b82f6' },
                                        { label: 'Earned Value', value: fmt(evm.EV, sym), sub: 'EV — Value of work done', icon: '✅', color: 'var(--success)' },
                                        { label: 'Actual Cost', value: fmt(evm.AC, sym), sub: 'AC — Amount spent to date', icon: '💷', color: 'var(--danger)' },
                                    ].map((kpi, i) => (
                                        <div key={i} className="card kpi-card animate-in" style={{ animationDelay: `${0.1 + i * 0.05}s` }}>
                                            <div className="kpi-label">{kpi.label}</div>
                                            <div className="kpi-value">{kpi.value}</div>
                                            <div className="kpi-sub">{kpi.sub}</div>
                                            <div className="kpi-icon" style={{ background: kpi.color, fontSize: 16 }}>{kpi.icon}</div>
                                        </div>
                                    ))}
                                </div>

                                {/* ============ PERFORMANCE INDICES ============ */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="card p-6 flex items-center justify-around animate-in" style={{ animationDelay: '0.3s' }}>
                                        <Gauge value={evm.CPI} label="CPI" />
                                        <Gauge value={evm.SPI} label="SPI" />
                                    </div>

                                    {/* Variance Cards */}
                                    <div className="card p-5 animate-in" style={{ animationDelay: '0.35s' }}>
                                        <div className="section-title" style={{ fontSize: 14 }}>
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20V10" /><path d="M18 20V4" /><path d="M6 20v-4" /></svg>
                                            Variance Analysis
                                        </div>
                                        <div style={{ display: 'grid', gap: 12 }}>
                                            {[
                                                { label: 'Cost Variance (CV)', val: evm.CV, desc: 'EV − AC' },
                                                { label: 'Schedule Variance (SV)', val: evm.SV, desc: 'EV − PV' },
                                                { label: 'Variance at Completion', val: evm.VAC, desc: 'BAC − EAC' },
                                            ].map((v, i) => (
                                                <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                    <div>
                                                        <div style={{ fontSize: 12, fontWeight: 500 - 900, color: 'var(--text-secondary)' }}>{v.label}</div>
                                                        <div style={{ fontSize: 10, color: 'var(--text-faint)' }}>{v.desc}</div>
                                                    </div>
                                                    <div className="font-mono" style={{ fontSize: 15, fontWeight: 700, color: varianceColor(v.val) }}>
                                                        {v.val >= 0 ? '+' : ''}{fmt(v.val, sym)}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Forecasting */}
                                    <div className="card p-5 animate-in" style={{ animationDelay: '0.4s' }}>
                                        <div className="section-title" style={{ fontSize: 14 }}>
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="4,20 10,14 14,16 20,8" /><polyline points="14,8 20,8 20,14" /></svg>
                                            Forecasts
                                        </div>
                                        <div style={{ display: 'grid', gap: 12 }}>
                                            {[
                                                { label: 'Estimate at Completion', val: fmt(evm.EAC, sym), desc: 'EAC = BAC ÷ CPI', color: varianceColor(evm.BAC - evm.EAC) },
                                                { label: 'Estimate to Complete', val: fmt(evm.ETC, sym), desc: 'ETC = EAC − AC', color: 'var(--text-primary)' },
                                                { label: 'To-Complete Performance', val: fmtIdx(evm.TCPI), desc: 'TCPI — required CPI', color: indexColor(1 / (evm.TCPI || 1)) },
                                            ].map((v, i) => (
                                                <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                    <div>
                                                        <div style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-secondary)' }}>{v.label}</div>
                                                        <div style={{ fontSize: 10, color: 'var(--text-faint)' }}>{v.desc}</div>
                                                    </div>
                                                    <div className="font-mono" style={{ fontSize: 15, fontWeight: 700, color: v.color }}>
                                                        {v.val}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* ============ S-CURVE ============ */}
                                {evm.periods && evm.periods.length > 0 && (
                                    <div className="card p-5 mb-6 animate-in" style={{ animationDelay: '0.45s' }}>
                                        <div className="section-title">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18" /><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3" /></svg>
                                            S-Curve — Cumulative Performance
                                        </div>
                                        <div style={{ height: 320, position: 'relative' }}>
                                            <SCurveChart evm={evm} />
                                        </div>
                                    </div>
                                )}

                                {/* ============ SCHEDULE + CRITICAL PATH ============ */}
                                {schedule && (
                                    <div className="card p-5 mb-6 animate-in" style={{ animationDelay: '0.5s' }}>
                                        <div className="section-title">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="4" rx="1" /><rect x="3" y="10" width="12" height="4" rx="1" /><rect x="3" y="16" width="15" height="4" rx="1" /></svg>
                                            Schedule Overview
                                        </div>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            <div>
                                                <div className="kpi-label">Total Activities</div>
                                                <div className="font-mono" style={{ fontSize: 20, fontWeight: 700 }}>{schedule.totalActivities}</div>
                                            </div>
                                            <div>
                                                <div className="kpi-label">Critical Path Length</div>
                                                <div className="font-mono" style={{ fontSize: 20, fontWeight: 700, color: 'var(--danger)' }}>{schedule.criticalPathLength} days</div>
                                            </div>
                                            <div>
                                                <div className="kpi-label">Critical Activities</div>
                                                <div className="font-mono" style={{ fontSize: 20, fontWeight: 700, color: 'var(--danger)' }}>{schedule.criticalActivities.length}</div>
                                            </div>
                                            <div>
                                                <div className="kpi-label">Elapsed / Remaining</div>
                                                <div className="font-mono" style={{ fontSize: 20, fontWeight: 700 }}>
                                                    {schedule.elapsed}d <span style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 400 }}>/ {Math.max(0, schedule.criticalPathLength - schedule.elapsed)}d</span>
                                                </div>
                                            </div>
                                        </div>
                                        {/* Progress bar */}
                                        <div style={{ marginTop: 16, height: 8, background: 'var(--bg-secondary)', borderRadius: 4, overflow: 'hidden' }}>
                                            <div style={{
                                                width: `${Math.min(100, schedule.schedulePct)}%`, height: '100%',
                                                background: schedule.schedulePct > 100 ? 'var(--danger)' : 'var(--success)',
                                                borderRadius: 4, transition: 'width 0.5s ease'
                                            }} />
                                        </div>
                                    </div>
                                )}

                                {/* ============ METRICS TABLE ============ */}
                                <div className="card p-5 animate-in" style={{ animationDelay: '0.55s' }}>
                                    <div className="section-title">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /><line x1="9" y1="3" x2="9" y2="21" /></svg>
                                        Full Metrics Table
                                    </div>
                                    <div style={{ overflowX: 'auto' }}>
                                        <table className="data-table">
                                            <thead>
                                                <tr>
                                                    <th>Metric</th>
                                                    <th>Acronym</th>
                                                    <th>Formula</th>
                                                    <th style={{ textAlign: 'right' }}>Value</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {[
                                                    { name: 'Budget at Completion', acr: 'BAC', formula: 'Σ planned costs', val: fmtFull(evm.BAC, sym), status: '' },
                                                    { name: 'Planned Value', acr: 'PV', formula: 'Σ planned (to date)', val: fmtFull(evm.PV, sym), status: '' },
                                                    { name: 'Earned Value', acr: 'EV', formula: 'Σ (%complete × cost)', val: fmtFull(evm.EV, sym), status: '' },
                                                    { name: 'Actual Cost', acr: 'AC', formula: 'Σ transactions', val: fmtFull(evm.AC, sym), status: '' },
                                                    { name: 'Cost Variance', acr: 'CV', formula: 'EV − AC', val: fmtFull(evm.CV, sym), status: evm.CV >= 0 ? 'green' : 'red' },
                                                    { name: 'Schedule Variance', acr: 'SV', formula: 'EV − PV', val: fmtFull(evm.SV, sym), status: evm.SV >= 0 ? 'green' : 'red' },
                                                    { name: 'Cost Performance Index', acr: 'CPI', formula: 'EV ÷ AC', val: fmtIdx(evm.CPI), status: evm.CPI >= 1 ? 'green' : evm.CPI >= 0.9 ? 'amber' : 'red' },
                                                    { name: 'Schedule Performance Index', acr: 'SPI', formula: 'EV ÷ PV', val: fmtIdx(evm.SPI), status: evm.SPI >= 1 ? 'green' : evm.SPI >= 0.9 ? 'amber' : 'red' },
                                                    { name: 'Estimate at Completion', acr: 'EAC', formula: 'BAC ÷ CPI', val: fmtFull(evm.EAC, sym), status: evm.EAC <= evm.BAC ? 'green' : 'red' },
                                                    { name: 'Estimate to Complete', acr: 'ETC', formula: 'EAC − AC', val: fmtFull(evm.ETC, sym), status: '' },
                                                    { name: 'Variance at Completion', acr: 'VAC', formula: 'BAC − EAC', val: fmtFull(evm.VAC, sym), status: evm.VAC >= 0 ? 'green' : 'red' },
                                                    { name: 'To-Complete Performance Index', acr: 'TCPI', formula: '(BAC−EV) ÷ (BAC−AC)', val: fmtIdx(evm.TCPI), status: evm.TCPI <= 1 ? 'green' : evm.TCPI <= 1.1 ? 'amber' : 'red' },
                                                ].map((m, i) => (
                                                    <tr key={i}>
                                                        <td className="metric-name">{m.name}</td>
                                                        <td><span className="badge badge-blue">{m.acr}</span></td>
                                                        <td style={{ fontSize: 12, color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>{m.formula}</td>
                                                        <td className="metric-value" style={{ textAlign: 'right' }}>{m.val}</td>
                                                        <td>
                                                            {m.status && (
                                                                <span className={`badge badge-${m.status}`}>
                                                                    {m.status === 'green' ? 'Good' : m.status === 'amber' ? 'Watch' : 'Alert'}
                                                                </span>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Footer */}
                                <div className="mt-8 pt-6 border-t text-center text-xs no-print animate-in" style={{ borderColor: 'var(--border-primary)', color: 'var(--text-faint)', animationDelay: '0.6s' }}>
                                    <p>Data sourced from Cost Tracker and Gantt Chart via localStorage • Click Refresh to update</p>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
