  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ============================================
    // CONSTANTS
    // ============================================
    const STORAGE_KEY = 'cost-project';
    const RISK_STORAGE_KEY = 'risk-register';
    const THEMES = ['blueprint', 'fun', 'dark', 'traditional'];
    const THEME_LABELS = { blueprint: 'Blueprint', fun: 'Fun & Vibrant', dark: 'Dark Mode', traditional: 'Traditional' };
    const UNITS = ['hours', 'days', 'units', 'lump'];
    const UNIT_LABELS = { hours: 'Hours', days: 'Days', units: 'Units', lump: 'Lump Sum' };

    const DEFAULT_CATEGORIES = [
      { id: uid(), name: 'Labour', colour: '#6366f1', sortOrder: 0, lineItems: [] },
      { id: uid(), name: 'Materials', colour: '#22c55e', sortOrder: 1, lineItems: [] },
      { id: uid(), name: 'Equipment', colour: '#f59e0b', sortOrder: 2, lineItems: [] },
      { id: uid(), name: 'Subcontractors', colour: '#ec4899', sortOrder: 3, lineItems: [] },
      { id: uid(), name: 'Travel', colour: '#14b8a6', sortOrder: 4, lineItems: [] },
      { id: uid(), name: 'Overheads', colour: '#8b5cf6', sortOrder: 5, lineItems: [] },
      { id: uid(), name: 'Professional Services', colour: '#f97316', sortOrder: 6, lineItems: [] },

    // ============================================
    // UTILITIES
    // ============================================
    function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }

    function formatCurrency(amount, symbol = '£', abbreviated = false) {
      if (amount == null || isNaN(amount)) return `${symbol}0`;
      const abs = Math.abs(amount);
      if (abbreviated && abs >= 1000000) return `${amount < 0 ? '-' : ''}${symbol}${(abs / 1000000).toFixed(1)}m`;
      if (abbreviated && abs >= 1000) return `${amount < 0 ? '-' : ''}${symbol}${(abs / 1000).toFixed(0)}k`;
      const formatted = abs.toLocaleString('en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      return `${amount < 0 ? '-' : ''}${symbol}${formatted}`;
    }

    function formatCurrencyFull(amount, symbol = '£') {
      if (amount == null || isNaN(amount)) return `${symbol}0.00`;
      const abs = Math.abs(amount);
      const formatted = abs.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return `${amount < 0 ? '-' : ''}${symbol}${formatted}`;
    }

    function formatPercent(value) {
      if (value == null || isNaN(value)) return '—';
      return `${value >= 0 ? '+' : ''}${value.toFixed(1)}%`;
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function toISODate(d) { return d ? new Date(d).toISOString().split('T')[0] : ''; }
    function today() { return new Date().toISOString().split('T')[0]; }

    function varianceClass(variance, baseline, amberPct = -5, redPct = -10) {
      if (!baseline || baseline === 0) return '';
      const pct = (variance / baseline) * 100;
      if (pct >= 0) return 'var-positive';
      if (pct >= redPct) return 'var-warn';
      return 'var-negative';
    }

    function getMonthsBetween(start, end) {
      const s = new Date(start);
      const e = new Date(end);
      const months = [];
      let current = new Date(s.getFullYear(), s.getMonth(), 1);
      while (current <= e) {
        const mEnd = new Date(current.getFullYear(), current.getMonth() + 1, 0);
        months.push({
          id: `${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}`,
          label: current.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }),
          startDate: current.toISOString().split('T')[0],
          endDate: mEnd.toISOString().split('T')[0],
          planned: 0, actual: 0, earned: 0
        });
        current = new Date(current.getFullYear(), current.getMonth() + 1, 1);
      }
      return months;
    }

    // ============================================
    // DEFAULT PROJECT
    // ============================================
    function createDefaultProject() {
      const now = new Date().toISOString();
      return {
        meta: { name: 'New Project', startDate: today(), endDate: toISODate(new Date(Date.now() + 365 * 86400000)), currencySymbol: '£', created: now, modified: now },
        settings: { theme: localStorage.getItem('coffeecup-theme') || 'blueprint', amberThreshold: -5, redThreshold: -10, periodType: 'monthly' },
        categories: DEFAULT_CATEGORIES.map(c => ({ ...c, id: uid(), lineItems: [] })),
        contingency: { method: 'manual', manualAmount: 0, percentage: 10, emvPulledDate: null, riskBreakdown: [], utilised: 0, utilisedLog: [] },
        managementReserve: { method: 'percentage', percentage: 10, manualAmount: null },
        timePhased: { periods: [] },
        transactions: [],
        baselines: []
      };
    }

    // ============================================
    // PERSISTENCE
    // ============================================
    function loadProject() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { console.error('Failed to load project:', e); }
      return createDefaultProject();
    }

    function saveProject(proj) {
      try {
        proj.meta.modified = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(proj));
      } catch (e) { console.error('Failed to save project:', e); }
    }

      table: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>,

    // ============================================
    // EVM CALCULATIONS
    // ============================================
    function calcEVM(project) {
      const cats = project.categories || [];
      const transactions = project.transactions || [];
      const periods = (project.timePhased && project.timePhased.periods) || [];
      const contingency = project.contingency || {};
      const mgmtReserve = project.managementReserve || {};
      const sym = project.meta.currencySymbol || '£';

      // BAC = sum of all line item totalCost
      const BAC = cats.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + (li.totalCost || 0), 0), 0);

      // AC = sum of all transactions
      const AC = transactions.reduce((s, t) => s + (t.amount || 0), 0);

      // EV = sum of (percentComplete / 100 * totalCost) per line item
      const EV = cats.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + ((li.percentComplete || 0) / 100) * (li.totalCost || 0), 0), 0);

      // PV = cumulative planned to current date
      const now = new Date();
      const PV = periods.filter(p => new Date(p.endDate) <= now).reduce((s, p) => s + (p.planned || 0), 0);

      const CV = EV - AC;
      const SV = EV - PV;
      const CPI = AC !== 0 ? EV / AC : 0;
      const SPI = PV !== 0 ? EV / PV : 0;
      const EAC = CPI !== 0 ? BAC / CPI : 0;
      const ETC = EAC - AC;
      const VAC = BAC - EAC;
      const TCPI = (BAC - AC) !== 0 ? (BAC - EV) / (BAC - AC) : 0;

      // Contingency
      let contingencyAmount = 0;
      if (contingency.method === 'manual') contingencyAmount = contingency.manualAmount || 0;
      else if (contingency.method === 'percentage') contingencyAmount = BAC * ((contingency.percentage || 0) / 100);
      else if (contingency.method === 'emv') contingencyAmount = (contingency.riskBreakdown || []).reduce((s, r) => s + (r.emv || 0), 0);

      const costBaseline = BAC + contingencyAmount;

      // Management Reserve
      let mgmtReserveAmount = 0;
      if (mgmtReserve.method === 'percentage') mgmtReserveAmount = costBaseline * ((mgmtReserve.percentage || 0) / 100);
      else mgmtReserveAmount = mgmtReserve.manualAmount || 0;

      const totalBudget = costBaseline + mgmtReserveAmount;

      // Actuals per category
      const actualsByCategory = {};
      transactions.forEach(t => {
        actualsByCategory[t.categoryId] = (actualsByCategory[t.categoryId] || 0) + (t.amount || 0);
      });

      return { BAC, AC, EV, PV, CV, SV, CPI, SPI, EAC, ETC, VAC, TCPI, contingencyAmount, costBaseline, mgmtReserveAmount, totalBudget, actualsByCategory };
    }

    // ============================================
    // STABLE INPUT — manages local state to prevent focus loss
    // ============================================
    function StableInput({ value, onChange, type = 'text', ...props }) {
      const [local, setLocal] = React.useState(value);
      const ref = React.useRef(null);
      React.useEffect(() => { setLocal(value); }, [value]);
      return React.createElement('input', {
        ...props, type, ref,
        value: local,
        onChange: e => {
          setLocal(e.target.value);
          if (type === 'number' || type === 'date' || type === 'color') onChange(e);
        },
        onBlur: e => { if (type === 'text' && local !== value) onChange(e); },
        onKeyDown: e => { if (e.key === 'Enter' && type === 'text') { onChange(e); ref.current?.blur(); } }
      });
    }

    // ============================================
    // MAIN APP
    // ============================================
    function App() {
      const [project, setProject] = useState(() => loadProject());
      const [view, setView] = useState('dashboard');
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [modal, setModal] = useState(null);
      const [expandedCats, setExpandedCats] = useState({});
      const [selectedPeriod, setSelectedPeriod] = useState(null);
      const [showCumulative, setShowCumulative] = useState(true);
      const chartRefs = useRef({});

      const sym = project.meta.currencySymbol || '£';
      const evm = useMemo(() => calcEVM(project), [project]);

      // Auto-save
      useEffect(() => { saveProject(project); }, [project]);

      // On mount: apply shared suite theme if available
      useEffect(() => {
        const shared = localStorage.getItem('coffeecup-theme');
        if (shared && shared !== project.settings.theme) update(d => { d.settings.theme = shared; });
      }, []);

      // Theme — sync shared key
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', project.settings.theme);
        localStorage.setItem('coffeecup-theme', project.settings.theme);
      }, [project.settings.theme]);

      // Auto-generate periods when dates change
      useEffect(() => {
        if (project.meta.startDate && project.meta.endDate) {
          const newPeriods = getMonthsBetween(project.meta.startDate, project.meta.endDate);
          const existing = project.timePhased.periods || [];
          // Merge: keep existing data for matching periods
          const merged = newPeriods.map(np => {
            const ex = existing.find(e => e.id === np.id);
            return ex ? { ...np, planned: ex.planned, actual: ex.actual, earned: ex.earned } : np;
          });
          if (JSON.stringify(merged.map(m => m.id)) !== JSON.stringify(existing.map(e => e.id))) {
            update(d => { d.timePhased.periods = merged; });
          }
        }
      }, [project.meta.startDate, project.meta.endDate]);

      function update(fn) {
        setProject(prev => {
          const next = JSON.parse(JSON.stringify(prev));
          fn(next);
          return next;
        });
      }

      function toggleCategory(catId) {
        setExpandedCats(prev => ({ ...prev, [catId]: !prev[catId] }));
      }

            <div className="app-header-spacer" />

            <div className="view-toggle no-print">

      // SETTINGS DRAWER
      // ============================================

                <div className="drawer-section">

                    </div>

                      <label className="form-label">End Date</label>
                      <input type="date" className="input-refined" value={project.meta.endDate}
                        onChange={e => update(d => { d.meta.endDate = e.target.value; })} />
                    </div>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Currency Symbol</label>
                    <select className="select-refined" value={sym}
                      onChange={e => update(d => { d.meta.currencySymbol = e.target.value; })}>
                      <option value="£">£ (GBP)</option>
                      <option value="$">$ (USD)</option>
                      <option value="€">€ (EUR)</option>
                    </select>
                  </div>
                </div>

                <div className="drawer-section">
                  <div className="drawer-section-title">Budget Categories</div>

                      <input type="color" value={cat.colour} style={{ width: 28, height: 28, border: 'none', cursor: 'pointer', borderRadius: 4 }}

      // ============================================
      // RISK REGISTER INTEGRATION
      // ============================================
      function pullFromRiskRegister() {
        try {
          const raw = localStorage.getItem(RISK_STORAGE_KEY);
          if (!raw) { alert('No Risk Register data found in localStorage.'); return; }
          const riskData = JSON.parse(raw);
          const risks = riskData.risks || [];
          const breakdown = risks
            .filter(r => r.type === 'threat' || !r.type)
            .map(r => {
              const prob = (r.probability || r.likelihood || 0) / 100;
              const impact = r.costImpact || r.impact || 0;
              return { riskId: r.id, riskName: r.name || r.title || 'Unknown', emv: prob * impact };
            })
            .filter(r => r.emv > 0);

          update(d => {
            d.contingency.riskBreakdown = breakdown;
            d.contingency.emvPulledDate = new Date().toISOString();
            if (d.contingency.method === 'emv') {
              d.contingency.manualAmount = null;
            }
          });
          alert(`Pulled ${breakdown.length} risk(s). Total EMV: ${formatCurrency(breakdown.reduce((s, r) => s + r.emv, 0), sym)}`);
        } catch (e) {
          alert('Failed to read Risk Register data: ' + e.message);
        }
      }

      // ============================================
      // EXPORT / IMPORT
      // ============================================
      function exportJSON() {
        const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${project.meta.name.replace(/\s+/g, '_')}_cost_tracker.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function importJSON() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            try {
              const data = JSON.parse(ev.target.result);
              if (!data.meta || !data.categories) { alert('Invalid Cost Tracker file.'); return; }
              setProject(data);
            } catch (err) { alert('Failed to parse JSON: ' + err.message); }
          };
          reader.readAsText(file);
        };
        input.click();
      }

            const data = JSON.parse(raw);

                                    if (removed.target === 'contingency' && d.contingency.method === 'manual') {

                      d.managementReserve.releaseLog.push({
                        date: form.date, amount, target: form.target, description: form.description, approvedBy: form.approvedBy
                      });

                      if (form.target === 'contingency') {
                        // Increase contingency — if manual, add to manual amount; otherwise add as manual override
                        if (d.contingency.method === 'manual') {
                          d.contingency.manualAmount = (d.contingency.manualAmount || 0) + amount;

                          // Switch to manual and set amount to current calculated + release
                          const currentContingency = d.contingency.method === 'percentage'
                            ? d.categories.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + (li.totalCost || 0), 0), 0) * ((d.contingency.percentage || 0) / 100)
                            : (d.contingency.riskBreakdown || []).reduce((s, r) => s + (r.emv || 0), 0);
                          d.contingency.method = 'manual';
                          d.contingency.manualAmount = currentContingency + amount;
                        }
                      }
                      // If target is 'estimate', no automatic action — user manually adds to their line items
                    });
                    setModal(null);
                  }}>
                  Release {form.amount ? formatCurrency(parseFloat(form.amount), sym) : ''}
                </button>
              </div>
            </div>
          </div>
        );

      // ============================================
      // S-CURVE CHART
      // ============================================
      function SCurveChart() {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);

        useEffect(() => {
          if (typeof Chart === 'undefined') return;
          const periods = project.timePhased.periods || [];
          if (!periods.length) return;

          const labels = periods.map(p => p.label);
          const transactions = project.transactions || [];
          let cumPV = 0, cumAC = 0, cumEV = 0;
          const pvData = periods.map(p => { cumPV += p.planned || 0; return cumPV; });
          const acData = periods.map(p => {
            const pStart = new Date(p.startDate);
            const pEnd = new Date(p.endDate);
            const periodActual = transactions
              .filter(t => { const td = new Date(t.date); return td >= pStart && td <= pEnd; })
              .reduce((s, t) => s + (t.amount || 0), 0);
            cumAC += periodActual;
            return cumAC;
          });
          const evData = periods.map(p => { cumEV += p.earned || 0; return cumEV; });

          const style = getComputedStyle(document.documentElement);
          const textCol = style.getPropertyValue('--text-muted').trim();
          const borderCol = style.getPropertyValue('--border-primary').trim();

          if (chartRef.current) chartRef.current.destroy();
          chartRef.current = new Chart(canvasRef.current, {
            type: 'line',
            data: {
              labels,
              datasets: [
                { label: 'Planned Value (PV)', data: pvData, borderColor: style.getPropertyValue('--chart-1').trim(), backgroundColor: 'transparent', tension: 0.3, pointRadius: 3, borderWidth: 2 },
                { label: 'Actual Cost (AC)', data: acData, borderColor: style.getPropertyValue('--chart-2').trim(), backgroundColor: 'transparent', tension: 0.3, pointRadius: 3, borderWidth: 2 },
                { label: 'Earned Value (EV)', data: evData, borderColor: style.getPropertyValue('--chart-3').trim(), backgroundColor: 'transparent', tension: 0.3, pointRadius: 3, borderWidth: 2, borderDash: [5, 5] },
              ]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { color: textCol, font: { size: 11 }, boxWidth: 12, padding: 16 } } },
              scales: {
                x: { ticks: { color: textCol, font: { size: 10 } }, grid: { color: borderCol } },
                y: { ticks: { color: textCol, font: { size: 10 }, callback: v => formatCurrency(v, sym, true) }, grid: { color: borderCol } }
              }
            }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [project.timePhased.periods, project.transactions, project.settings.theme]);

        const hasPeriods = (project.timePhased.periods || []).length > 0;
        return (
          <div className="chart-card full-width">
            <div className="chart-card-header">S-Curve (Cumulative PV / AC / EV)</div>
            <div className="chart-card-body" style={{ height: 280 }}>
              {hasPeriods ? <canvas ref={canvasRef} /> : (
                <div className="empty-state" style={{ padding: '24px 0' }}>
                  <p>Set project dates and add time-phased budget to see the S-curve.</p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ============================================
      // BURN-DOWN CHART
      // ============================================
      function BurnDownChart() {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);

        useEffect(() => {
          if (typeof Chart === 'undefined') return;
          const periods = project.timePhased.periods || [];
          if (!periods.length) return;

          const totalBudget = evm.totalBudget || evm.BAC;
          const labels = periods.map(p => p.label);

          // Calculate actuals per period from transactions
          const transactions = project.transactions || [];
          let cumSpend = 0;
          const remainData = periods.map(p => {
            const pStart = new Date(p.startDate);
            const pEnd = new Date(p.endDate);
            const periodActual = transactions
              .filter(t => { const td = new Date(t.date); return td >= pStart && td <= pEnd; })
              .reduce((s, t) => s + (t.amount || 0), 0);
            cumSpend += periodActual;
            return totalBudget - cumSpend;
          });
          let cumPlanned = 0;
          const baselineData = periods.map(p => { cumPlanned += p.planned || 0; return totalBudget - cumPlanned; });

          const style = getComputedStyle(document.documentElement);
          const textCol = style.getPropertyValue('--text-muted').trim();
          const borderCol = style.getPropertyValue('--border-primary').trim();

          if (chartRef.current) chartRef.current.destroy();
          chartRef.current = new Chart(canvasRef.current, {
            type: 'line',
            data: {
              labels,
              datasets: [
                { label: 'Baseline', data: baselineData, borderColor: style.getPropertyValue('--text-faint').trim(), borderDash: [5, 5], backgroundColor: 'transparent', tension: 0.2, pointRadius: 2, borderWidth: 2 },
                { label: 'Actual Remaining', data: remainData, borderColor: style.getPropertyValue('--chart-2').trim(), backgroundColor: 'transparent', tension: 0.2, pointRadius: 3, borderWidth: 2 },
              ]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { color: textCol, font: { size: 11 }, boxWidth: 12, padding: 16 } } },
              scales: {
                x: { ticks: { color: textCol, font: { size: 10 } }, grid: { color: borderCol } },
                y: { ticks: { color: textCol, font: { size: 10 }, callback: v => formatCurrency(v, sym, true) }, grid: { color: borderCol } }
              }
            }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [project.timePhased.periods, project.transactions, project.settings.theme, evm.totalBudget]);

        const hasPeriods = (project.timePhased.periods || []).length > 0;
        return (
          <div className="chart-card">
            <div className="chart-card-header">Budget Burn-down</div>
            <div className="chart-card-body" style={{ height: 260 }}>
              {hasPeriods ? <canvas ref={canvasRef} /> : (
                <div className="empty-state" style={{ padding: '24px 0' }}><p>Add time-phased data to see burn-down.</p></div>
              )}
            </div>
          </div>
        );
      }

      // ============================================
      // CONTINGENCY GAUGE
      // ============================================
      function ContingencyGauge() {
        const canvasRef = useRef(null);
        const chartRef = useRef(null);
        const utilised = project.contingency.utilised || 0;
        const allocated = evm.contingencyAmount;
        const remaining = allocated - utilised;
        const pct = allocated > 0 ? (utilised / allocated) * 100 : 0;

        useEffect(() => {
          if (typeof Chart === 'undefined') return;
          if (!canvasRef.current || !allocated) return;

          const style = getComputedStyle(document.documentElement);
          const successCol = style.getPropertyValue('--success').trim();
          const dangerCol = style.getPropertyValue('--danger').trim();
          const warnCol = style.getPropertyValue('--warning').trim();
          const bgCol = style.getPropertyValue('--bg-secondary').trim();

          const gaugeCol = pct < 50 ? successCol : pct < 80 ? warnCol : dangerCol;

          if (chartRef.current) chartRef.current.destroy();
          chartRef.current = new Chart(canvasRef.current, {
            type: 'doughnut',
            data: {
              labels: ['Utilised', 'Remaining'],
              datasets: [{ data: [utilised, Math.max(0, remaining)], backgroundColor: [gaugeCol, bgCol], borderWidth: 0 }]
            },
            options: {
              responsive: true, maintainAspectRatio: true, cutout: '70%',
              rotation: -90, circumference: 180,
              plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.label}: ${formatCurrency(ctx.parsed, sym)}` } } }
            }
          });
          return () => { if (chartRef.current) chartRef.current.destroy(); };
        }, [utilised, allocated, project.settings.theme]);

        const logEntries = project.contingency.utilisedLog || [];

        return (
          <div className="chart-card">
            <div className="chart-card-header" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <span>Contingency Reserve</span>
              {allocated > 0 && (
                <button className="btn btn-sm btn-secondary" style={{ marginTop: -4, marginBottom: -4 }}
                  onClick={() => setModal({ type: 'contingency' })}>
                  Use Reserve
                </button>
              )}
            </div>
            <div className="chart-card-body">
              {allocated > 0 ? (
                <>
                  <div className="gauge-container">
                    <div className="gauge-ring">
                      <canvas ref={canvasRef} />
                      <div style={{ position: 'absolute', bottom: 4, left: '50%', transform: 'translateX(-50%)', fontSize: 14, fontWeight: 700, fontFamily: 'var(--font-mono)', color: 'var(--text-primary)' }}>
                        {pct.toFixed(0)}%
                      </div>
                    </div>
                    <div className="gauge-stats">
                      <div className="gauge-stat">
                        <div className="gauge-stat-label">Allocated</div>
                        <div className="gauge-stat-value">{formatCurrency(allocated, sym)}</div>
                      </div>
                      <div className="gauge-stat">
                        <div className="gauge-stat-label">Utilised</div>
                        <div className="gauge-stat-value" style={{ color: 'var(--danger)' }}>{formatCurrency(utilised, sym)}</div>
                      </div>
                      <div className="gauge-stat">
                        <div className="gauge-stat-label">Remaining</div>
                        <div className="gauge-stat-value" style={{ color: 'var(--success)' }}>{formatCurrency(remaining, sym)}</div>
                      </div>
                    </div>
                  </div>
                  {logEntries.length > 0 && (
                    <div style={{ borderTop: '1px solid var(--border-secondary)', marginTop: 10, paddingTop: 10 }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-faint)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Release Log</div>
                      {logEntries.slice(-4).map((entry, i) => (
                        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: 'var(--text-secondary)', marginBottom: 4 }}>
                          <span style={{ fontFamily: 'var(--font-mono)', color: 'var(--text-faint)', width: 70, flexShrink: 0, fontSize: 11 }}>{formatDate(entry.date)}</span>
                          <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{entry.description}</span>
                          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, color: 'var(--danger)', flexShrink: 0 }}>{formatCurrency(entry.amount, sym)}</span>
                        </div>
                      ))}
                      {logEntries.length > 4 && (
                        <div style={{ fontSize: 11, color: 'var(--text-faint)', marginTop: 4 }}>+{logEntries.length - 4} more entries</div>
                      )}
                    </div>
                  )}
                </>
              ) : (
                <div className="empty-state" style={{ padding: '24px 0' }}><p>Configure contingency reserve in Settings to see the gauge.</p></div>
              )}
            </div>
          </div>
        );
      }

              <thead>
                <tr>
                  <th style={{ width: '30%' }}>Category / Line Item</th>
                  <th className="num">Baseline ({sym})</th>
                  <th className="num">Actuals ({sym})</th>
                  <th className="num">Variance ({sym})</th>
                  <th className="num">% Var</th>
                  <th className="num">% Complete</th>
                  <th className="num">EAC ({sym})</th>
                  <th style={{ width: 60 }}></th>
                </tr>
              </thead>
              <tbody>
                {cats.map(cat => {
                  const catBaseline = cat.lineItems.reduce((s, li) => s + (li.totalCost || 0), 0);
                  const catActual = evm.actualsByCategory[cat.id] || 0;
                  const catVariance = catBaseline - catActual;
                  const catVarPct = catBaseline ? (catVariance / catBaseline) * 100 : 0;
                  const catPctComplete = catBaseline ? cat.lineItems.reduce((s, li) => s + ((li.percentComplete || 0) / 100) * (li.totalCost || 0), 0) / catBaseline * 100 : 0;
                  const catCPI = catActual > 0 ? (catPctComplete / 100 * catBaseline) / catActual : 0;
                  const catEAC = catCPI > 0 ? catBaseline / catCPI : catBaseline;
                  const isExpanded = expandedCats[cat.id];

                  return (
                    <React.Fragment key={cat.id}>
                      <tr className="category-row" onClick={() => toggleCategory(cat.id)}>
                        <td>
                          <span className={`expand-chevron ${isExpanded ? 'open' : ''}`}>{Icons.chevronRight}</span>
                          <span style={{ color: cat.colour, marginRight: 6 }}>●</span>
                          {cat.name}
                          <span style={{ fontSize: 11, color: 'var(--text-faint)', marginLeft: 6 }}>({cat.lineItems.length})</span>
                        </td>
                        <td className="num">{formatCurrency(catBaseline, sym)}</td>
                        <td className="num">{formatCurrency(catActual, sym)}</td>
                        <td className={`num ${varianceClass(catVariance, catBaseline, amberPct, redPct)}`}>
                          {catVariance >= 0 ? '+' : ''}{formatCurrency(catVariance, sym)}
                        </td>
                        <td className={`num ${varianceClass(catVariance, catBaseline, amberPct, redPct)}`}>
                          {catBaseline ? formatPercent(catVarPct) : '—'}
                        </td>
                        <td className="num">
                          <div className="progress-inline">
                            <div className="progress-bar-sm"><div className="progress-bar-sm-fill" style={{ width: `${catPctComplete}%` }} /></div>
                            <span className="progress-text">{catPctComplete.toFixed(0)}%</span>
                          </div>
                        </td>
                        <td className="num">{formatCurrency(catEAC, sym, true)}</td>
                        <td>
                          <button className="btn btn-icon btn-sm btn-secondary" title="Add line item"
                            onClick={e => { e.stopPropagation(); setModal({ type: 'lineItem', categoryId: cat.id }); }}>
                            {Icons.plus}
                          </button>
                        </td>
                      </tr>
                      {isExpanded && cat.lineItems.map(li => {
                        const liActual = project.transactions.filter(t => t.lineItemId === li.id).reduce((s, t) => s + (t.amount || 0), 0);
                        const liVariance = (li.totalCost || 0) - liActual;
                        const liVarPct = li.totalCost ? (liVariance / li.totalCost) * 100 : 0;
                        return (
                          <tr key={li.id} className="line-item">
                            <td>{li.description}</td>
                            <td className="num">{formatCurrency(li.totalCost, sym)}</td>
                            <td className="num">{formatCurrency(liActual, sym)}</td>
                            <td className={`num ${varianceClass(liVariance, li.totalCost, amberPct, redPct)}`}>
                              {liVariance >= 0 ? '+' : ''}{formatCurrency(liVariance, sym)}
                            </td>
                            <td className={`num ${varianceClass(liVariance, li.totalCost, amberPct, redPct)}`}>
                              {li.totalCost ? formatPercent(liVarPct) : '—'}
                            </td>
                            <td className="num">
                              <div className="progress-inline">
                                <div className="progress-bar-sm"><div className="progress-bar-sm-fill" style={{ width: `${li.percentComplete || 0}%` }} /></div>
                                <span className="progress-text">{li.percentComplete || 0}%</span>
                              </div>
                            </td>
                            <td className="num">—</td>
                            <td>
                              <button className="btn btn-icon btn-sm btn-secondary" title="Edit"
                                onClick={() => setModal({ type: 'lineItem', categoryId: cat.id, lineItem: li })}>
                                {Icons.edit}
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                      {isExpanded && cat.lineItems.length === 0 && (
                        <tr className="line-item">
                          <td colSpan={8} style={{ textAlign: 'center', color: 'var(--text-faint)', fontStyle: 'italic', padding: '12px 14px' }}>
                            No line items. <span style={{ color: 'var(--accent-primary)', cursor: 'pointer' }}
                              onClick={() => setModal({ type: 'lineItem', categoryId: cat.id })}>Add one</span>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}

                {/* Summary rows */}
                <tr className="subtotal-row">
                  <td>Cost Estimate</td>
                  <td className="num">{formatCurrency(evm.BAC, sym)}</td>
                  <td className="num">{formatCurrency(evm.AC, sym)}</td>
                  <td className={`num ${varianceClass(evm.BAC - evm.AC, evm.BAC, amberPct, redPct)}`}>
                    {evm.BAC - evm.AC >= 0 ? '+' : ''}{formatCurrency(evm.BAC - evm.AC, sym)}
                  </td>
                  <td className={`num ${varianceClass(evm.BAC - evm.AC, evm.BAC, amberPct, redPct)}`}>
                    {evm.BAC ? formatPercent(((evm.BAC - evm.AC) / evm.BAC) * 100) : '—'}
                  </td>
                  <td className="num"></td>
                  <td className="num">{formatCurrency(evm.EAC, sym, true)}</td>
                  <td></td>
                </tr>
                <tr className="reserve-row">
                  <td>Contingency Reserve</td>
                  <td className="num">{formatCurrency(evm.contingencyAmount, sym)}</td>
                  <td className="num" colSpan={2} style={{ fontStyle: 'normal' }}>
                    {(project.contingency.utilised || 0) > 0 ? (
                      <span>({formatCurrency(project.contingency.utilised, sym)} utilised, {formatCurrency(evm.contingencyAmount - (project.contingency.utilised || 0), sym)} remaining)</span>
                    ) : null}
                  </td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td>
                    <button className="btn btn-icon btn-sm btn-secondary" title="Use contingency reserve"
                      onClick={() => setModal({ type: 'contingency' })}>
                      {Icons.download}
                    </button>
                  </td>
                </tr>
                <tr className="subtotal-row">
                  <td>Cost Baseline</td>
                  <td className="num">{formatCurrency(evm.costBaseline, sym)}</td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td></td>
                </tr>
                <tr className="reserve-row">
                  <td>
                    Management Reserve
                    {(() => {
                      const released = (project.managementReserve.releaseLog || []).reduce((s, r) => s + (r.amount || 0), 0);
                      return released > 0 ? <span style={{ fontSize: 11, color: 'var(--warning)', marginLeft: 6 }}>({formatCurrency(released, sym)} released)</span> : null;
                    })()}
                  </td>
                  <td className="num">{formatCurrency(evm.mgmtReserveAmount, sym)}</td>
                  <td className="num" colSpan={2} style={{ fontStyle: 'normal' }}>
                    {(() => {
                      const remaining = evm.mgmtReserveAmount - (project.managementReserve.releaseLog || []).reduce((s, r) => s + (r.amount || 0), 0);
                      return remaining < evm.mgmtReserveAmount ? <span style={{ fontSize: 11 }}>{formatCurrency(remaining, sym)} remaining</span> : null;
                    })()}
                  </td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td>
                    <button className="btn btn-icon btn-sm btn-secondary" title="Release management reserve"
                      onClick={() => setModal({ type: 'mgmtReserve' })}>
                      {Icons.download}
                    </button>
                  </td>
                </tr>
                <tr className="summary-row">
                  <td>Total Project Budget</td>
                  <td className="num">{formatCurrency(evm.totalBudget, sym)}</td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td className="num"></td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        );
      }

      // ============================================
      // TRANSACTIONS LIST (TABLE VIEW)
      // ============================================
      function TransactionsList() {
        const sorted = [...project.transactions].sort((a, b) => b.date.localeCompare(a.date));
        if (!sorted.length) return null;

        return (
          <div className="transactions-section" style={{ marginTop: 24 }}>
            <div className="transactions-header">
              <h3>All Transactions ({sorted.length})</h3>
            </div>
            <div className="transaction-list">
              {sorted.map(t => {
                const cat = project.categories.find(c => c.id === t.categoryId);
                const li = cat ? cat.lineItems.find(l => l.id === t.lineItemId) : null;
                return (
                  <div key={t.id} className="transaction-item" onClick={() => setModal({ type: 'editTransaction', transaction: t })} style={{ cursor: 'pointer' }}>
                    <span className="transaction-date">{formatDate(t.date)}</span>
                    <span className="transaction-cat">{cat ? cat.name : '—'}</span>
                    <span className="transaction-desc">
                      {t.description || '—'}
                      {li && <span style={{ fontSize: 11, color: 'var(--text-faint)', marginLeft: 6 }}>({li.description})</span>}
                      {t.vendor && <span style={{ fontSize: 11, color: 'var(--text-faint)', marginLeft: 6 }}>• {t.vendor}</span>}
                    </span>
                    <span className="transaction-amount">{formatCurrency(t.amount, sym)}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ============================================
      // TIME PHASING EDITOR
      // ============================================
      function TimePhasingSection() {
        const periods = project.timePhased.periods || [];
        if (!periods.length) return null;

        function distributeEvenly() {
          const totalPlanned = evm.BAC;
          const perPeriod = periods.length > 0 ? totalPlanned / periods.length : 0;
          update(d => {
            d.timePhased.periods.forEach(p => { p.planned = Math.round(perPeriod); });
          });
        }

        function calcActualsPerPeriod() {
          update(d => {
            d.timePhased.periods.forEach(p => {
              const periodStart = new Date(p.startDate);
              const periodEnd = new Date(p.endDate);
              const periodActual = d.transactions
                .filter(t => { const td = new Date(t.date); return td >= periodStart && td <= periodEnd; })
                .reduce((s, t) => s + (t.amount || 0), 0);
              p.actual = periodActual;
            });
          });
        }

        return (
          <div style={{ marginTop: 24 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
              <h3 style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-secondary)', margin: 0 }}>Time-Phased Budget</h3>
              <div style={{ display: 'flex', gap: 6 }}>
                <button className="btn btn-secondary btn-sm" onClick={distributeEvenly}>Even Spread</button>
                <button className="btn btn-secondary btn-sm" onClick={calcActualsPerPeriod}>{Icons.refresh} Calc Actuals</button>
              </div>
            </div>
            <div className="budget-table-wrap">
              <table className="budget-table">
                <thead>
                  <tr>
                    <th>Period</th>
                    <th className="num">Planned ({sym})</th>
                    <th className="num">Actual ({sym})</th>
                    <th className="num">Earned ({sym})</th>
                    <th className="num">Variance ({sym})</th>
                  </tr>
                </thead>
                <tbody>
                  {periods.map((p, i) => {
                    const variance = (p.planned || 0) - (p.actual || 0);
                    return (
                      <tr key={p.id}>
                        <td>{p.label}</td>
                        <td className="num">
                          <input type="number" className="cell-input" value={p.planned || ''}
                            onChange={e => update(d => { d.timePhased.periods[i].planned = parseFloat(e.target.value) || 0; })}
                            placeholder="0" />
                        </td>
                        <td className="num" style={{ fontFamily: 'var(--font-mono)', fontSize: 12 }}>
                          {formatCurrency(p.actual || 0, sym)}
                        </td>
                        <td className="num">
                          <input type="number" className="cell-input" value={p.earned || ''}
                            onChange={e => update(d => { d.timePhased.periods[i].earned = parseFloat(e.target.value) || 0; })}
                            placeholder="0" />
                        </td>
                        <td className={`num ${varianceClass(variance, p.planned || 1, project.settings.amberThreshold, project.settings.redThreshold)}`}>
                          {variance >= 0 ? '+' : ''}{formatCurrency(variance, sym)}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      // ============================================
      // BASELINES LIST
      // ============================================
      function BaselinesSection() {
        if (!project.baselines.length) return null;
        return (
          <div style={{ marginTop: 24 }}>
            <h3 style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-secondary)', marginBottom: 12 }}>Saved Baselines</h3>
            <div className="transaction-list">
              {project.baselines.map((bl, i) => {
                const snapBAC = bl.snapshot.categories.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + (li.totalCost || 0), 0), 0);
                return (
                  <div key={i} className="transaction-item">
                    <span style={{ fontWeight: 600, color: 'var(--text-primary)' }}>{bl.name}</span>
                    <span className="transaction-date">{formatDate(bl.date)}</span>
                    <span style={{ flex: 1 }} />
                    <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-muted)' }}>
                      BAC: {formatCurrency(snapBAC, sym)}
                    </span>
                    <button className="btn btn-icon btn-sm btn-danger" title="Delete baseline"
                      onClick={() => { if (confirm(`Delete baseline "${bl.name}"?`)) update(d => { d.baselines.splice(i, 1); }); }}>
                      {Icons.trash}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      // ============================================
      // RENDER
      // ============================================
      return (
        <div>
          <Header />
          <SettingsDrawer />
          {view === 'dashboard' ? <DashboardView /> : (
            <div className="content-area animate-in">
              <div className="budget-toolbar">
                <button className="btn btn-primary btn-sm" onClick={() => setModal({ type: 'transaction' })}>
                  {Icons.plus} Add Transaction
                </button>
                {(project.timePhased.periods || []).length > 0 && (
                  <select className="select-refined" value={selectedPeriod || ''} style={{ width: 160 }}
                    onChange={e => setSelectedPeriod(e.target.value || null)}>
                    <option value="">All Periods</option>
                    {(project.timePhased.periods || []).map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                  </select>
                )}
                <div style={{ flex: 1 }} />
                {project.contingency.method === 'emv' && (
                  <button className="btn btn-secondary btn-sm" onClick={pullFromRiskRegister}>
                    {Icons.refresh} Pull from Risk Register
                  </button>
                )}
              </div>

              <BudgetTable />
              <TimePhasingSection />
              <BaselinesSection />
              <TransactionsList />
            </div>
          )}

          {/* Modals */}
          {modal && modal.type === 'baseline' && <BaselineModal />}
          {modal && (modal.type === 'transaction' || modal.type === 'editTransaction') && <TransactionModal />}
          {modal && modal.type === 'lineItem' && <LineItemModal />}
          {modal && modal.type === 'contingency' && <ContingencyModal />}
          {modal && modal.type === 'mgmtReserve' && <MgmtReserveModal />}
        </div>
      );
    }

    // ============================================
    // MOUNT
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
