        <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>

        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>

    const IconChevronUp = () => (

    const IconBarChart = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <line x1="18" y1="20" x2="18" y2="10"/>

    const IconTrendingUp = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>

    );

    const IconActivity = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>

    );

    const IconAlertCircle = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    // ============================================
    // COLUMN CONFIGURATION
    // ============================================
    const COLUMN_ICONS = {
      'clipboard': IconClipboard,
      'refresh': IconRefresh,
      'check-circle': IconCheckCircle,
      'flag': IconFlag,
      'star': IconStar,
      'alert': IconAlert,
      'archive': IconArchive,
      'inbox': IconInbox,
      'layers': IconLayers,
      'target': IconTarget,
      'clock': IconClock,
      'users': IconUsers,
      'folder': IconFolder,
      'lightbulb': IconLightbulb,
      'rocket': IconRocket
    };

    const COLUMN_COLORS = {
      'bar-1': { name: 'Slate', cssClass: 'bar-solid-1' },
      'bar-2': { name: 'Sage', cssClass: 'bar-solid-2' },
      'bar-3': { name: 'Gold', cssClass: 'bar-solid-3' },
      'bar-4': { name: 'Rose', cssClass: 'bar-solid-4' },
      'bar-5': { name: 'Sky', cssClass: 'bar-solid-5' },
      'bar-6': { name: 'Amber', cssClass: 'bar-solid-6' },
      'muted': { name: 'Muted', cssClass: 'column-icon-muted' },
      'accent': { name: 'Accent', cssClass: 'column-icon-accent' }
    };

    const DEFAULT_COLUMNS = [
      { id: 'plan', name: 'Plan', icon: 'clipboard', color: 'bar-1', position: 0 },
      { id: 'underway', name: 'Underway', icon: 'refresh', color: 'bar-2', position: 1 },
      { id: 'complete', name: 'Complete', icon: 'check-circle', color: 'bar-3', position: 2 }
    ];

    // ============================================
    // UTILITY FUNCTIONS
    // ============================================
    const getToday = () => {
      const d = new Date();
      return d.toISOString().split('T')[0];
    };

    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    };

    const barColors = ['bar-solid-1', 'bar-solid-2', 'bar-solid-3', 'bar-solid-4', 'bar-solid-5', 'bar-solid-6'];
    const getBarColor = (index) => barColors[index % 6];

    // ============================================
    // KANBAN CARD COMPONENT
    // ============================================
    const KanbanCard = ({ activity, index, onUpdate, onDelete, onToggleComplete, isExpanded, onToggleExpand }) => {
      const [editData, setEditData] = useState({
        name: activity.name,
        duration: activity.duration,
        owner: activity.kanban?.owner || '',
        startedDate: activity.kanban?.startedDate || '',
        completedDate: activity.kanban?.completedDate || '',
        notes: activity.kanban?.notes || ''
      });

      const cardRef = useRef(null);
      const isComplete = !!activity.kanban?.completedDate;

      useEffect(() => {
        setEditData({
          name: activity.name,
          duration: activity.duration,
          owner: activity.kanban?.owner || '',
          startedDate: activity.kanban?.startedDate || '',
          completedDate: activity.kanban?.completedDate || '',
          notes: activity.kanban?.notes || ''
        });
      }, [activity]);

      const handleDragStart = (e) => {
        if (isExpanded) {
          e.preventDefault();
          return;
        }
        e.dataTransfer.setData('text/plain', JSON.stringify({ id: activity.id, index }));
        e.currentTarget.classList.add('dragging');
      };

      const handleDragEnd = (e) => {
        e.currentTarget.classList.remove('dragging');
      };

      const handleSave = () => {
        onUpdate(activity.id, {
          name: editData.name.trim() || activity.name,
          duration: parseInt(editData.duration) || activity.duration,
          kanban: {
            ...activity.kanban,
            owner: editData.owner.trim(),
            startedDate: editData.startedDate,
            completedDate: editData.completedDate,
            notes: editData.notes.trim()
          }
        });
        onToggleExpand(null);
      };

      const handleDelete = () => {
        if (confirm('Delete this task? This cannot be undone.')) {
          onDelete(activity.id);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Escape') {
          onToggleExpand(null);
        }
      };

      const handleCheckboxClick = (e) => {
        e.stopPropagation(); // Prevent card expansion
        onToggleComplete(activity.id);
      };

      // Collapsed view
      if (!isExpanded) {
        return (
          <div
            ref={cardRef}
            className={`kanban-card animate-scale-in ${isComplete ? 'completed' : ''}`}
            draggable="true"
            onDragStart={handleDragStart}
            onDragEnd={handleDragEnd}
            onClick={() => onToggleExpand(activity.id)}
          >
            <div className={`kanban-card-bar ${getBarColor(index)}`} />
            <div className="kanban-card-content">
              <div className="kanban-card-header">
                <div className="kanban-card-drag">
                  <IconGrip />
                </div>
                <div className="kanban-card-title">{activity.name}</div>
                <div
                  className={`completion-checkbox ${isComplete ? 'checked' : ''}`}
                  onClick={handleCheckboxClick}
                  title={isComplete ? 'Mark incomplete' : 'Mark complete'}
                >
                  {isComplete && <IconCheck size={12} />}
                </div>
              </div>
              <div className="kanban-card-duration">
                <IconClock />
                {activity.duration} day{activity.duration !== 1 ? 's' : ''}
              </div>

              {/* Show meta info if present */}
              {(activity.kanban?.owner || activity.kanban?.startedDate || activity.kanban?.completedDate) && (
                <div className="kanban-card-meta">
                  {activity.kanban?.owner && (
                    <div className="kanban-card-meta-item">
                      <IconUser className="kanban-card-meta-icon" />
                      <span>{activity.kanban.owner}</span>
                    </div>
                  )}
                  {activity.kanban?.startedDate && !isComplete && (
                    <div className="kanban-card-meta-item">
                      <IconCalendar className="kanban-card-meta-icon" />
                      <span>Started {formatDate(activity.kanban.startedDate)}</span>
                    </div>
                  )}
                  {isComplete && (
                    <div className="kanban-card-meta-item">
                      <IconCalendar className="kanban-card-meta-icon" />
                      <span>
                        {activity.kanban?.startedDate
                          ? `${formatDate(activity.kanban.startedDate)} → ${formatDate(activity.kanban.completedDate)}`
                          : `Completed ${formatDate(activity.kanban.completedDate)}`
                        }
                      </span>
                    </div>
                  )}
                </div>
              )}

              {/* Show notes preview if present */}
              {activity.kanban?.notes && (
                <div className="kanban-card-notes" style={{ maxHeight: '60px', overflow: 'hidden' }}>
                  {activity.kanban.notes.length > 100
                    ? activity.kanban.notes.substring(0, 100) + '...'
                    : activity.kanban.notes}
                </div>
              )}
            </div>
          </div>
        );
      }

      // Expanded edit view
      return (
        <div
          ref={cardRef}
          className="kanban-card expanded animate-scale-in"
          onKeyDown={handleKeyDown}
        >
          <div className={`kanban-card-bar ${getBarColor(index)}`} />
          <div className="kanban-card-form">
            <div className="kanban-card-form-field">
              <label className="kanban-card-form-label">Task Name</label>
              <input
                type="text"
                className="input-refined"
                value={editData.name}
                onChange={(e) => setEditData({ ...editData, name: e.target.value })}
                placeholder="Task name"
                autoFocus
              />
            </div>

            <div className="kanban-card-form-row">
              <div className="kanban-card-form-field">
                <label className="kanban-card-form-label">Duration (days)</label>
                <input
                  type="number"
                  className="input-refined"
                  value={editData.duration}
                  onChange={(e) => setEditData({ ...editData, duration: e.target.value })}
                  min="0"
                  placeholder="1"
                />
              </div>
              <div className="kanban-card-form-field">
                <label className="kanban-card-form-label">Owner</label>
                <input
                  type="text"
                  className="input-refined"
                  value={editData.owner}
                  onChange={(e) => setEditData({ ...editData, owner: e.target.value })}
                  placeholder="Assignee name"
                />
              </div>
            </div>

            <div className="kanban-card-form-row">
              <div className="kanban-card-form-field">
                <label className="kanban-card-form-label">Started Date</label>
                <input
                  type="date"
                  className="input-refined"
                  value={editData.startedDate}
                  onChange={(e) => setEditData({ ...editData, startedDate: e.target.value })}
                />
              </div>
              <div className="kanban-card-form-field">
                <label className="kanban-card-form-label">Completed Date</label>
                <input
                  type="date"
                  className="input-refined"
                  value={editData.completedDate}
                  onChange={(e) => setEditData({ ...editData, completedDate: e.target.value })}
                />
              </div>
            </div>

            <div className="kanban-card-form-field">
              <label className="kanban-card-form-label">Notes</label>
              <textarea
                className="textarea-refined"
                value={editData.notes}
                onChange={(e) => setEditData({ ...editData, notes: e.target.value })}
                placeholder="Progress notes, blockers, updates..."
                rows="3"
              />
            </div>

            <div className="kanban-card-form-actions">
              <button
                className="btn btn-danger btn-sm"
                onClick={handleDelete}
              >
                <IconTrash /> Delete
              </button>
              <div className="flex gap-2">
                <button
                  className="btn btn-secondary btn-sm"
                  onClick={() => onToggleExpand(null)}
                >
                  Cancel
                </button>
                <button
                  className="btn btn-accent btn-sm"
                  onClick={handleSave}
                >
                  <IconCheck /> Save
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // KANBAN COLUMN COMPONENT
    // ============================================
    const KanbanColumn = ({ status, title, icon, activities, allActivities, columns, onUpdateActivity, onDeleteActivity, onMoveActivity, onToggleComplete, expandedCard, onToggleExpand }) => {
      const [isDragOver, setIsDragOver] = useState(false);
      const columnRef = useRef(null);

      // Use first column's id as default status for backwards compatibility
      const defaultStatus = columns?.[0]?.id || 'plan';
      const columnActivities = activities.filter(a => (a.kanban?.status || defaultStatus) === status);
      const isFirstColumn = columns?.findIndex(c => c.id === status) === 0;

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragOver(true);
      };

      const handleDragLeave = (e) => {
        // Only set drag over to false if we're leaving the column entirely
        if (!columnRef.current.contains(e.relatedTarget)) {
          setIsDragOver(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);

        try {
          const data = JSON.parse(e.dataTransfer.getData('text/plain'));
          const activity = allActivities.find(a => a.id === data.id);

          if (activity && (activity.kanban?.status || defaultStatus) !== status) {
            onMoveActivity(data.id, status);
          }
        } catch (err) {
          console.error('Drop error:', err);
        }
      };

      // Get the original index in allActivities for consistent colors
      const getOriginalIndex = (activity) => {
        return allActivities.findIndex(a => a.id === activity.id);
      };

      return (
        <div className="kanban-column">
          <div className="kanban-column-header">
            <div className="kanban-column-title">
              {icon}
              {title}
              <span className="kanban-column-count">{columnActivities.length}</span>
            </div>
          </div>
          <div
            ref={columnRef}
            className={`kanban-column-body custom-scroll ${isDragOver ? 'drag-over' : ''}`}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
            onDrop={handleDrop}
          >
            {columnActivities.length === 0 ? (
              <div className="text-center py-8 text-muted text-sm">
                {isFirstColumn ? 'Add tasks or drag here' : 'Drag tasks here'}
              </div>
            ) : (
              columnActivities.map((activity) => (
                <KanbanCard
                  key={activity.id}
                  activity={activity}
                  index={getOriginalIndex(activity)}
                  onUpdate={onUpdateActivity}
                  onDelete={onDeleteActivity}
                  onToggleComplete={onToggleComplete}
                  isExpanded={expandedCard === activity.id}
                  onToggleExpand={onToggleExpand}
                />
              ))
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // ICON PICKER COMPONENT
    // ============================================
    const IconPicker = ({ selected, onSelect }) => {
      return (
        <div className="icon-picker">
          {Object.entries(COLUMN_ICONS).map(([key, IconComponent]) => (
            <button
              key={key}
              type="button"
              className={`icon-picker-item ${selected === key ? 'selected' : ''}`}
              onClick={() => onSelect(key)}
              title={key}
            >
              <IconComponent />
            </button>
          ))}
        </div>
      );
    };

    // ============================================
    // COLOUR PICKER COMPONENT
    // ============================================
    const ColourPicker = ({ selected, onSelect }) => {
      return (
        <div className="colour-picker">
          {Object.entries(COLUMN_COLORS).map(([key, { name }]) => (
            <button
              key={key}
              type="button"
              className={`colour-swatch ${selected === key ? 'selected' : ''}`}
              style={{ background: `var(--${key})` }}
              onClick={() => onSelect(key)}
              title={name}
            />
          ))}
        </div>
      );
    };

    // ============================================
    // COLUMN CONFIG ITEM COMPONENT
    // ============================================
    const ColumnConfigItem = ({ column, index, totalColumns, onUpdate, onDelete, onMove, tasksInColumn }) => {
      const IconComponent = COLUMN_ICONS[column.icon] || IconClipboard;

      const handleDelete = () => {
        if (tasksInColumn > 0) {
          alert(`Cannot delete this column. It contains ${tasksInColumn} task${tasksInColumn !== 1 ? 's' : ''}. Move or delete the tasks first.`);
          return;
        }
        if (totalColumns <= 1) {
          alert('Cannot delete the last column. You need at least one column.');
          return;
        }
        if (confirm(`Delete column "${column.name || 'Untitled'}"?`)) {
          onDelete(column.id);
        }
      };

      return (
        <div className="column-config-item">
          <div className="column-config-header">
            <div className="reorder-buttons">
              <button
                className="reorder-btn"
                onClick={() => onMove(column.id, 'up')}
                disabled={index === 0}
                title="Move up"
              >
                <IconChevronUp />
              </button>
              <button
                className="reorder-btn"
                onClick={() => onMove(column.id, 'down')}
                disabled={index === totalColumns - 1}
                title="Move down"
              >
                <IconChevronDown />
              </button>
            </div>
            <div className="column-config-name">
              <input
                type="text"
                className="input-refined"
                value={column.name}
                onChange={(e) => onUpdate(column.id, { name: e.target.value })}
                placeholder="Column name"
              />
            </div>
            <span className={`column-icon-${column.color}`}>
              <IconComponent />
            </span>
          </div>

          <div>
            <div className="column-config-label">Icon</div>
            <IconPicker
              selected={column.icon}
              onSelect={(icon) => onUpdate(column.id, { icon })}
            />
          </div>

          <div style={{ marginTop: '12px' }}>
            <div className="column-config-label">Colour</div>
            <ColourPicker
              selected={column.color}
              onSelect={(color) => onUpdate(column.id, { color })}
            />
          </div>

          <div className="column-config-actions">
            <span className="text-muted text-sm">
              {tasksInColumn} task{tasksInColumn !== 1 ? 's' : ''}
            </span>
            <button
              className="btn btn-danger btn-sm"
              onClick={handleDelete}
            >
              <IconTrash /> Delete
            </button>
          </div>
        </div>
      );
    };

    // ============================================
    // ANALYSIS VIEW COMPONENT
    // ============================================
    const AnalysisView = ({ activities, columns }) => {
      const [timePeriod, setTimePeriod] = useState('all');
      const [excludeCompleted, setExcludeCompleted] = useState(false);

      // Filter activities based on settings
      const getFilteredActivities = () => {
        let filtered = [...activities];

        // Exclude completed if checkbox is checked
        if (excludeCompleted) {
          filtered = filtered.filter(a => !a.kanban?.completedDate);
        }

        // Filter by time period based on creation/start date
        if (timePeriod !== 'all') {
          const days = parseInt(timePeriod);
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - days);
          const cutoffStr = cutoffDate.toISOString().split('T')[0];

          filtered = filtered.filter(a => {
            const activityDate = a.kanban?.startedDate || a.kanban?.createdDate;
            if (!activityDate) return true; // Include if no date
            return activityDate >= cutoffStr;
          });
        }

        return filtered;
      };

      const filteredActivities = getFilteredActivities();

      // Calculate KPI metrics
      const totalTasks = filteredActivities.length;
      const completedTasks = filteredActivities.filter(a => a.kanban?.completedDate).length;

      // Calculate average cycle time (days from startedDate to completedDate)
      const tasksWithCycle = filteredActivities.filter(a =>
        a.kanban?.startedDate && a.kanban?.completedDate
      );
      const avgCycleTime = tasksWithCycle.length > 0
        ? Math.round(tasksWithCycle.reduce((sum, a) => {
            const start = new Date(a.kanban.startedDate);
            const end = new Date(a.kanban.completedDate);
            return sum + Math.ceil((end - start) / (1000 * 60 * 60 * 24));
          }, 0) / tasksWithCycle.length)
        : 0;

      // Calculate overdue tasks (days since startedDate > duration)
      const today = new Date();
      const overdueTasks = filteredActivities.filter(a => {
        if (!a.kanban?.startedDate || a.kanban?.completedDate) return false;
        const start = new Date(a.kanban.startedDate);
        const daysSinceStart = Math.ceil((today - start) / (1000 * 60 * 60 * 24));
        return daysSinceStart > a.duration;
      });

      // Ageing Analysis Data
      const ageingData = filteredActivities
        .filter(a => a.kanban?.startedDate && !a.kanban?.completedDate)
        .map(a => {
          const start = new Date(a.kanban.startedDate);
          const daysSinceStart = Math.ceil((today - start) / (1000 * 60 * 60 * 24));
          const daysOverdue = daysSinceStart - a.duration;
          const columnName = columns.find(c => c.id === a.kanban?.status)?.name || 'Unknown';

          return {
            id: a.id,
            name: a.name,
            owner: a.kanban?.owner || 'Unassigned',
            duration: a.duration,
            daysSinceStart,
            daysOverdue,
            column: columnName,
            status: daysOverdue > 0 ? 'overdue' : (daysOverdue > -2 ? 'warning' : 'good')
          };
        })
        .sort((a, b) => b.daysOverdue - a.daysOverdue);

      // Days in current column
      const daysInColumnData = filteredActivities
        .filter(a => !a.kanban?.completedDate)
        .map(a => {
          // This would need column entry tracking - for now use startedDate
          const entryDate = a.kanban?.startedDate;
          const daysInColumn = entryDate
            ? Math.ceil((today - new Date(entryDate)) / (1000 * 60 * 60 * 24))
            : 0;

          return {
            id: a.id,
            name: a.name,
            column: columns.find(c => c.id === a.kanban?.status)?.name || 'Unknown',
            daysInColumn
          };
        })
        .sort((a, b) => b.daysInColumn - a.daysInColumn)
        .slice(0, 10);

      // Owner Distribution
      const ownerCounts = {};
      const ownerByColumn = {};

      filteredActivities.forEach(a => {
        const owner = a.kanban?.owner || 'Unassigned';
        const columnId = a.kanban?.status || columns[0]?.id;

        ownerCounts[owner] = (ownerCounts[owner] || 0) + 1;

        if (!ownerByColumn[owner]) {
          ownerByColumn[owner] = {};
        }
        ownerByColumn[owner][columnId] = (ownerByColumn[owner][columnId] || 0) + 1;
      });

      const ownerData = Object.entries(ownerCounts)
        .map(([owner, count]) => ({ owner, count }))
        .sort((a, b) => b.count - a.count);

      const maxOwnerCount = Math.max(...ownerData.map(d => d.count), 1);

      // Owner workload (sum of duration)
      const ownerWorkload = {};
      filteredActivities.forEach(a => {
        const owner = a.kanban?.owner || 'Unassigned';
        ownerWorkload[owner] = (ownerWorkload[owner] || 0) + a.duration;
      });

      const workloadData = Object.entries(ownerWorkload)
        .map(([owner, days]) => ({ owner, days }))
        .sort((a, b) => b.days - a.days);

      const maxWorkload = Math.max(...workloadData.map(d => d.days), 1);

      // Throughput data (completions per week)
      const completedActivities = activities.filter(a => a.kanban?.completedDate);
      const weeklyThroughput = {};

      completedActivities.forEach(a => {
        const completedDate = new Date(a.kanban.completedDate);
        // Get the Monday of the week
        const weekStart = new Date(completedDate);
        weekStart.setDate(completedDate.getDate() - completedDate.getDay() + 1);
        const weekKey = weekStart.toISOString().split('T')[0];

        weeklyThroughput[weekKey] = (weeklyThroughput[weekKey] || 0) + 1;
      });

      // Get last 8 weeks
      const throughputWeeks = [];
      const weekCursor = new Date();
      weekCursor.setDate(weekCursor.getDate() - weekCursor.getDay() + 1); // Start of this week

      for (let i = 0; i < 8; i++) {
        const weekKey = weekCursor.toISOString().split('T')[0];
        const weekLabel = weekCursor.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        throughputWeeks.unshift({
          week: weekKey,
          label: weekLabel,
          count: weeklyThroughput[weekKey] || 0
        });
        weekCursor.setDate(weekCursor.getDate() - 7);
      }

      const maxThroughput = Math.max(...throughputWeeks.map(w => w.count), 1);

      // Cumulative throughput
      let cumulative = 0;
      const cumulativeData = throughputWeeks.map(w => {
        cumulative += w.count;
        return { ...w, cumulative };
      });

      // Empty state
      if (activities.length === 0) {
        return (
          <div className="analysis-view">
            <div className="analysis-empty">
              <div className="analysis-empty-icon">
                <IconBarChart />
              </div>
              <div className="analysis-empty-title">No data to analyse</div>
              <div className="analysis-empty-text">
                Add some tasks to your board to see analytics
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="analysis-view">
          {/* Filters */}
          <div className="analysis-filters">
            <div className="filter-group">
              <span className="filter-label">Period</span>
              <select
                className="select-refined"
                value={timePeriod}
                onChange={(e) => setTimePeriod(e.target.value)}
              >
                <option value="7">Last 7 days</option>
                <option value="30">Last 30 days</option>
                <option value="90">Last 90 days</option>
                <option value="all">All time</option>
              </select>
            </div>
            <label className="filter-toggle">
              <input
                type="checkbox"
                checked={excludeCompleted}
                onChange={(e) => setExcludeCompleted(e.target.checked)}
              />
              <span>Exclude completed</span>
            </label>
          </div>

          {/* KPI Cards */}
          <div className="kpi-grid">
            <div className="kpi-card">
              <div className="kpi-card-header">
                <span className="kpi-card-title">Total Tasks</span>
                <div className="kpi-card-icon primary">
                  <IconLayers />
                </div>
              </div>
              <div className="kpi-card-value">{totalTasks}</div>
              <div className="kpi-card-subtitle">in filtered view</div>
            </div>

            <div className="kpi-card">
              <div className="kpi-card-header">
                <span className="kpi-card-title">Completed</span>
                <div className="kpi-card-icon success">
                  <IconCheckCircle />
                </div>
              </div>
              <div className="kpi-card-value">{completedTasks}</div>
              <div className="kpi-card-subtitle">
                {totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0}% completion rate
              </div>
            </div>

            <div className="kpi-card">
              <div className="kpi-card-header">
                <span className="kpi-card-title">Avg Cycle Time</span>
                <div className="kpi-card-icon warning">
                  <IconClock />
                </div>
              </div>
              <div className="kpi-card-value">{avgCycleTime}</div>
              <div className="kpi-card-subtitle">days to complete</div>
            </div>

            <div className="kpi-card">
              <div className="kpi-card-header">
                <span className="kpi-card-title">Overdue</span>
                <div className="kpi-card-icon danger">
                  <IconAlertCircle />
                </div>
              </div>
              <div className="kpi-card-value">{overdueTasks.length}</div>
              <div className="kpi-card-subtitle">past estimated duration</div>
            </div>
          </div>

          {/* Ageing Analysis */}
          <div className="analysis-section">
            <div className="analysis-section-header">
              <div className="analysis-section-title">
                <IconActivity />
                Ageing Analysis
              </div>
            </div>
            <div className="analysis-section-body">
              {ageingData.length === 0 ? (
                <div className="text-center py-8 text-muted">
                  No active tasks with start dates
                </div>
              ) : (
                <table className="analysis-table">
                  <thead>
                    <tr>
                      <th>Task</th>
                      <th>Owner</th>
                      <th>Column</th>
                      <th>Est. Duration</th>
                      <th>Days Active</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {ageingData.slice(0, 10).map(task => (
                      <tr key={task.id}>
                        <td style={{ fontWeight: 500 }}>{task.name}</td>
                        <td>{task.owner}</td>
                        <td>{task.column}</td>
                        <td>{task.duration} days</td>
                        <td>{task.daysSinceStart} days</td>
                        <td>
                          <span className={`status-badge ${task.status}`}>
                            {task.status === 'overdue' && `${task.daysOverdue}d overdue`}
                            {task.status === 'warning' && 'Due soon'}
                            {task.status === 'good' && 'On track'}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          {/* Owner Distribution */}
          <div className="analysis-section">
            <div className="analysis-section-header">
              <div className="analysis-section-title">
                <IconUsers />
                Owner Distribution
              </div>
            </div>
            <div className="analysis-section-body">
              <div className="chart-grid">
                {/* Task Count by Owner */}
                <div>
                  <div className="column-config-label" style={{ marginBottom: '16px' }}>Task Count</div>
                  <div className="bar-chart">
                    {ownerData.map(({ owner, count }) => (
                      <div key={owner} className="bar-chart-item">
                        <div className="bar-chart-label" title={owner}>{owner}</div>
                        <div className="bar-chart-bar-container">
                          <div
                            className="bar-chart-bar bar-solid-2"
                            style={{ width: `${(count / maxOwnerCount) * 100}%` }}
                          >
                            {count > 0 && <span>{count}</span>}
                          </div>
                        </div>
                        <div className="bar-chart-value">{count}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Workload by Owner */}
                <div>
                  <div className="column-config-label" style={{ marginBottom: '16px' }}>Workload (Days)</div>
                  <div className="bar-chart">
                    {workloadData.map(({ owner, days }) => (
                      <div key={owner} className="bar-chart-item">
                        <div className="bar-chart-label" title={owner}>{owner}</div>
                        <div className="bar-chart-bar-container">
                          <div
                            className="bar-chart-bar bar-solid-5"
                            style={{ width: `${(days / maxWorkload) * 100}%` }}
                          >
                            {days > 0 && <span>{days}</span>}
                          </div>
                        </div>
                        <div className="bar-chart-value">{days}d</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* Stacked bar by column */}
              {ownerData.length > 0 && (
                <div style={{ marginTop: '24px' }}>
                  <div className="column-config-label" style={{ marginBottom: '16px' }}>Tasks by Column</div>
                  {ownerData.map(({ owner }) => {
                    const total = ownerCounts[owner];
                    return (
                      <div key={owner} style={{ marginBottom: '12px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                          <span className="text-sm text-secondary">{owner}</span>
                          <span className="text-sm text-muted">{total} tasks</span>
                        </div>
                        <div className="stacked-bar">
                          {columns.map((col, idx) => {
                            const count = ownerByColumn[owner]?.[col.id] || 0;
                            if (count === 0) return null;
                            const pct = (count / total) * 100;
                            return (
                              <div
                                key={col.id}
                                className={`stacked-bar-segment bar-solid-${(idx % 6) + 1}`}
                                style={{ width: `${pct}%` }}
                                title={`${col.name}: ${count}`}
                              >
                                {pct > 15 && count}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                  <div className="chart-legend">
                    {columns.map((col, idx) => (
                      <div key={col.id} className="chart-legend-item">
                        <div className={`chart-legend-color bar-solid-${(idx % 6) + 1}`} />
                        <span>{col.name}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Throughput */}
          <div className="analysis-section">
            <div className="analysis-section-header">
              <div className="analysis-section-title">
                <IconTrendingUp />
                Throughput
              </div>
            </div>
            <div className="analysis-section-body">
              <div className="chart-grid">
                {/* Weekly completions bar chart */}
                <div>
                  <div className="column-config-label" style={{ marginBottom: '16px' }}>Weekly Completions</div>
                  <div className="bar-chart">
                    {throughputWeeks.map(({ week, label, count }) => (
                      <div key={week} className="bar-chart-item">
                        <div className="bar-chart-label">{label}</div>
                        <div className="bar-chart-bar-container">
                          <div
                            className="bar-chart-bar bar-solid-3"
                            style={{ width: `${maxThroughput > 0 ? (count / maxThroughput) * 100 : 0}%` }}
                          >
                            {count > 0 && <span>{count}</span>}
                          </div>
                        </div>
                        <div className="bar-chart-value">{count}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Cumulative line representation */}
                <div>
                  <div className="column-config-label" style={{ marginBottom: '16px' }}>Cumulative Completions</div>
                  <div className="bar-chart">
                    {cumulativeData.map(({ week, label, cumulative }) => (
                      <div key={week} className="bar-chart-item">
                        <div className="bar-chart-label">{label}</div>
                        <div className="bar-chart-bar-container">
                          <div
                            className="bar-chart-bar bar-solid-1"
                            style={{ width: `${cumulative > 0 ? (cumulative / cumulativeData[cumulativeData.length - 1].cumulative) * 100 : 0}%` }}
                          />
                        </div>
                        <div className="bar-chart-value">{cumulative}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ============================================
    // SETTINGS SIDEBAR COMPONENT
    // ============================================
    const SettingsSidebar = ({ isOpen, onClose, columns, activities, onUpdateColumn, onDeleteColumn, onMoveColumn, onAddColumn }) => {
      const getTasksInColumn = (columnId) => {
        return activities.filter(a => (a.kanban?.status || columns[0]?.id) === columnId).length;
      };

      return (
        <>
          <div
            className={`drawer-overlay ${isOpen ? 'open' : ''}`}
            onClick={onClose}
          />
          <div className={`drawer ${isOpen ? 'open' : ''}`}>
            <div className="drawer-header">
              <h2>Board Settings</h2>
              <button className="drawer-close" onClick={onClose}>
                <IconX />
              </button>
            </div>
            <div className="drawer-body">
              <div className="drawer-section">
                <div className="drawer-section-title">
                  Columns ({columns.length}/6)
                </div>
                {columns.map((column, index) => (
                  <ColumnConfigItem
                    key={column.id}
                    column={column}
                    index={index}
                    totalColumns={columns.length}
                    onUpdate={onUpdateColumn}
                    onDelete={onDeleteColumn}
                    onMove={onMoveColumn}
                    tasksInColumn={getTasksInColumn(column.id)}
                  />
                ))}
                <button
                  className="add-column-btn"
                  onClick={onAddColumn}
                  disabled={columns.length >= 6}
                >
                  <IconPlus />
                  {columns.length >= 6 ? 'Maximum columns reached' : 'Add Column'}
                </button>
              </div>
            </div>
          </div>
        </>
      );
    };

    // ============================================
    // DATA MIGRATION
    // ============================================
    const migrateData = (savedData) => {
      // If no columns defined, create default columns
      if (!savedData.columns) {
        savedData.columns = [...DEFAULT_COLUMNS];
      }

      // Migrate activity statuses if needed
      if (savedData.activities) {
        const validStatuses = savedData.columns.map(c => c.id);

        savedData.activities = savedData.activities.map(activity => {
          const currentStatus = activity.kanban?.status || 'plan';

          // If status is valid, keep it
          if (validStatuses.includes(currentStatus)) {
            return activity;
          }

          // Map old status strings to column positions
          let newStatus;
          if (currentStatus === 'plan') {
            newStatus = savedData.columns[0].id;
          } else if (currentStatus === 'underway') {
            newStatus = savedData.columns.length > 1
              ? savedData.columns[1].id
              : savedData.columns[0].id;
          } else if (currentStatus === 'complete') {
            newStatus = savedData.columns[savedData.columns.length - 1].id;
          } else {
            // Unknown status, default to first column
            newStatus = savedData.columns[0].id;
          }

          return {
            ...activity,
            kanban: {
              ...activity.kanban,
              status: newStatus
            }
          };
        });
      }

      return savedData;
    };

    // ============================================
    // MAIN KANBAN BOARD COMPONENT
    // ============================================
    const KanbanBoard = () => {
      // Load from localStorage with migration
      const loadSaved = () => {
        try {
          const saved = localStorage.getItem('kanban-project');
          if (saved) {
            return migrateData(JSON.parse(saved));
          }
        } catch (e) {
          console.error('Error loading saved data:', e);
        }
        return { columns: [...DEFAULT_COLUMNS], activities: [], theme: 'blueprint' };
      };

      const saved = loadSaved();
      const [activities, setActivities] = useState(saved?.activities || []);
      const [startDate, setStartDate] = useState(saved?.startDate || getToday());
      const [theme, setTheme] = useState(localStorage.getItem('coffeecup-theme') || saved?.theme || 'blueprint');
      const [columns, setColumns] = useState(saved?.columns || [...DEFAULT_COLUMNS]);
      const [expandedCard, setExpandedCard] = useState(null);
      const [settingsOpen, setSettingsOpen] = useState(false);
      const [activeTab, setActiveTab] = useState('board');
      const [newTaskName, setNewTaskName] = useState('');
      const [newTaskDuration, setNewTaskDuration] = useState('1');

      const fileInputRef = useRef(null);

      // Apply theme and sync shared key
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('coffeecup-theme', theme);
      }, [theme]);

      // Auto-save to localStorage
      useEffect(() => {
        const data = { startDate, activities, theme, columns };
        localStorage.setItem('kanban-project', JSON.stringify(data));
      }, [startDate, activities, theme, columns]);

      // Close expanded card when clicking outside
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (expandedCard && !e.target.closest('.kanban-card')) {
            setExpandedCard(null);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, [expandedCard]);

      // ============================================
      // CRUD OPERATIONS
      // ============================================
      const addTask = () => {
        if (!newTaskName.trim()) return;

        const newActivity = {
          id: Date.now(),
          name: newTaskName.trim(),
          duration: parseInt(newTaskDuration) || 1,
          dependency: 'FS',
          kanban: {
            status: columns[0]?.id || 'plan',
            owner: '',
            startedDate: '',
            completedDate: '',
            notes: ''
          }
        };

        setActivities([...activities, newActivity]);
        setNewTaskName('');
        setNewTaskDuration('1');
      };

      const updateActivity = (id, updates) => {
        setActivities(activities.map(a =>
          a.id === id ? { ...a, ...updates } : a
        ));
      };

      const deleteActivity = (id) => {
        setActivities(activities.filter(a => a.id !== id));
        if (expandedCard === id) setExpandedCard(null);
      };

      const moveActivity = (id, newStatus) => {
        setActivities(activities.map(a => {
          if (a.id !== id) return a;

          const kanban = { ...a.kanban, status: newStatus };

          // Find the column index for the new status
          const columnIndex = columns.findIndex(c => c.id === newStatus);

          // Auto-set start date for columns at position 1+ (not first column)
          if (columnIndex > 0 && !kanban.startedDate) {
            kanban.startedDate = getToday();
          }

          return { ...a, kanban };
        }));
      };

      // Toggle completion (sets/clears completedDate)
      const toggleComplete = (activityId) => {
        setActivities(activities.map(a => {
          if (a.id !== activityId) return a;

          const isCurrentlyComplete = !!a.kanban?.completedDate;
          const kanban = {
            ...a.kanban,
            completedDate: isCurrentlyComplete ? '' : getToday()
          };

          return { ...a, kanban };
        }));
      };

      // ============================================
      // COLUMN MANAGEMENT
      // ============================================
      const generateColumnId = () => `col_${Date.now()}`;

      const addColumn = () => {
        if (columns.length >= 6) return;
        const newColumn = {
          id: generateColumnId(),
          name: 'New Column',
          icon: 'inbox',
          color: 'bar-1',
          position: columns.length
        };
        setColumns([...columns, newColumn]);
      };

      const updateColumn = (columnId, updates) => {
        setColumns(columns.map(col =>
          col.id === columnId ? { ...col, ...updates } : col
        ));
      };

      const deleteColumn = (columnId) => {
        const tasksInColumn = activities.filter(a =>
          (a.kanban?.status || columns[0].id) === columnId
        );

        if (tasksInColumn.length > 0) {
          return false;
        }

        if (columns.length <= 1) {
          return false;
        }

        setColumns(columns.filter(col => col.id !== columnId)
          .map((col, idx) => ({ ...col, position: idx })));
        return true;
      };

      const moveColumn = (columnId, direction) => {
        const currentIndex = columns.findIndex(c => c.id === columnId);
        const newIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;

        if (newIndex < 0 || newIndex >= columns.length) return;

        const newColumns = [...columns];
        [newColumns[currentIndex], newColumns[newIndex]] =
          [newColumns[newIndex], newColumns[currentIndex]];

        setColumns(newColumns.map((col, idx) => ({ ...col, position: idx })));
      };

      // ============================================
      // FILE OPERATIONS
      // ============================================
      const saveToFile = () => {
        const data = {
          startDate,
          columns,
          activities: activities.map(({ id, ...rest }) => rest), // Strip runtime IDs
          theme
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'kanban-project.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      const loadFromFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = migrateData(JSON.parse(event.target.result));

            if (data.startDate) setStartDate(data.startDate);
            if (data.theme) setTheme(data.theme);
            if (data.columns) setColumns(data.columns);
            if (data.activities) {
              // Assign IDs and ensure kanban data exists
              const loadedActivities = data.activities.map((a, i) => ({
                ...a,
                id: Date.now() + i,
                kanban: a.kanban || {
                  status: data.columns?.[0]?.id || 'plan',
                  owner: '',
                  startedDate: '',
                  completedDate: '',
                  notes: ''
                }
              }));
              setActivities(loadedActivities);
            }
          } catch (err) {
            alert('Error loading file. Please ensure it is a valid JSON file.');
          }
        };
        reader.readAsText(file);
        e.target.value = ''; // Reset to allow reloading same file
      };

      const clearAll = () => {
        if (confirm('Clear all tasks? This cannot be undone.')) {
          setActivities([]);
          setExpandedCard(null);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          addTask();
        }
      };

      return (
        <div className="min-h-screen p-6 md:p-8">
          <div className="max-w-7xl mx-auto">
            {/* Header */}
            <div className="mb-8 animate-fade-in">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="flex items-center gap-3">
                  <div className="app-header-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="3" y="3" width="18" height="18" rx="2"/>
                      <path d="M9 3v18"/>
                      <path d="M15 3v18"/>
                    </svg>
                  </div>
                  <div>
                    <h1 className="text-2xl font-semibold text-primary tracking-tight">Kanban Board</h1>
                    <p className="text-sm text-muted">Drag tasks to track progress</p>
                  </div>
                </div>

                {/* Theme Selector and Settings */}
                <div className="flex items-center gap-3">
                  <div className="theme-selector">
                    <IconPalette />
                    <label>Theme</label>
                    <select
                      value={theme}
                      onChange={(e) => setTheme(e.target.value)}
                      className="select-refined"
                    >
                      {Object.entries(THEMES).map(([key, { name }]) => (
                        <option key={key} value={key}>{name}</option>
                      ))}
                    </select>
                  </div>
                  <button
                    className="settings-btn"
                    onClick={() => setSettingsOpen(true)}
                    title="Board settings"
                  >
                    <IconSettings />
                  </button>
                </div>
              </div>

              {/* Tab Navigation */}
              <div className="tab-nav mt-4" style={{ width: 'fit-content' }}>
                <button
                  className={`tab-btn ${activeTab === 'board' ? 'active' : ''}`}
                  onClick={() => setActiveTab('board')}
                >
                  <IconKanban />
                  Board
                </button>
                <button
                  className={`tab-btn ${activeTab === 'analysis' ? 'active' : ''}`}
                  onClick={() => setActiveTab('analysis')}
                >
                  <IconBarChart />
                  Analysis
                </button>
              </div>
            </div>

            {/* Board View */}
            {activeTab === 'board' && (
              <>
            {/* Add Task Form */}
            <div className="card p-5 mb-6 animate-fade-in" style={{ animationDelay: '0.05s' }}>
              <div className="flex flex-wrap gap-4 items-end">
                <div className="flex-1 min-w-[280px]">
                  <label className="block text-xs font-medium text-muted uppercase tracking-wider mb-2">Task Name</label>
                  <input
                    type="text"
                    className="input-refined w-full"
                    placeholder="Enter task description..."
                    value={newTaskName}
                    onChange={(e) => setNewTaskName(e.target.value)}
                    onKeyDown={handleKeyDown}
                    maxLength={100}
                  />
                </div>
                <div className="w-28">
                  <label className="block text-xs font-medium text-muted uppercase tracking-wider mb-2">Duration</label>
                  <input
                    type="number"
                    className="input-refined w-full text-center font-mono"
                    placeholder="Days"
                    min="0"
                    value={newTaskDuration}
                    onChange={(e) => setNewTaskDuration(e.target.value)}
                    onKeyDown={handleKeyDown}
                  />
                </div>
                <button
                  className="btn btn-accent"
                  onClick={addTask}
                  disabled={!newTaskName.trim()}
                >
                  <IconPlus /> Add Task
                </button>
              </div>
            </div>

            {/* Toolbar */}
            <div className="card p-4 mb-6 animate-fade-in" style={{ animationDelay: '0.1s' }}>
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex-1"></div>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".json"
                  onChange={loadFromFile}
                  className="hidden"
                />
                <button
                  className="btn btn-secondary btn-sm"
                  onClick={saveToFile}
                  title="Save file"
                >
                  <IconDownload /> Save
                </button>
                <button
                  className="btn btn-secondary btn-sm"
                  onClick={() => fileInputRef.current?.click()}
                  title="Open file"
                >
                  <IconUpload /> Open
                </button>
                <button
                  className="btn btn-danger btn-sm"
                  onClick={clearAll}
                  title="Clear all tasks"
                >
                  <IconTrash /> Clear
                </button>
              </div>
            </div>

            {/* Kanban Board */}
            <div className="kanban-board animate-fade-in" style={{ animationDelay: '0.15s' }}>
              {columns.map((column) => {
                const IconComponent = COLUMN_ICONS[column.icon] || IconClipboard;
                return (
                  <KanbanColumn
                    key={column.id}
                    status={column.id}
                    title={column.name || 'Untitled'}
                    icon={<span className={`column-icon-${column.color}`}><IconComponent /></span>}
                    activities={activities}
                    allActivities={activities}
                    columns={columns}
                    onUpdateActivity={updateActivity}
                    onDeleteActivity={deleteActivity}
                    onMoveActivity={moveActivity}
                    onToggleComplete={toggleComplete}
                    expandedCard={expandedCard}
                    onToggleExpand={setExpandedCard}
                  />
                );
              })}
            </div>
              </>
            )}

            {/* Analysis View */}
            {activeTab === 'analysis' && (
              <AnalysisView
                activities={activities}
                columns={columns}
              />
            )}
          </div>

          {/* Settings Sidebar */}
          <SettingsSidebar
            isOpen={settingsOpen}
            onClose={() => setSettingsOpen(false)}
            columns={columns}
            activities={activities}
            onUpdateColumn={updateColumn}
            onDeleteColumn={deleteColumn}
            onMoveColumn={moveColumn}
            onAddColumn={addColumn}
          />
        </div>
      );
    };

    // ============================================
    // RENDER
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KanbanBoard />);
  </script>
</body>
</html>
