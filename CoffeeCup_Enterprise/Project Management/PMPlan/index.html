      'external-link': (s = 16) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></svg>,
      bold: (s = 16) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 4h8a4 4 0 014 4 4 4 0 01-4 4H6z" /><path d="M6 12h9a4 4 0 014 4 4 4 0 01-4 4H6z" /></svg>,
      italic: (s = 16) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="4" x2="10" y2="4" /><line x1="14" y1="20" x2="5" y2="20" /><line x1="15" y1="4" x2="9" y2="20" /></svg>,
      'sidebar-collapse': (s = 16) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="9" y1="3" x2="9" y2="21" /></svg>,
    };

    const Icon = ({ name, size = 16 }) => icons[name] ? icons[name](size) : null;

    // ============================================
    // DEFAULT STATE
    // ============================================
    const createDefaultState = () => {
      const now = new Date().toISOString();
      const sections = {};
      Object.keys(SECTION_DEFS).forEach(id => {
        sections[id] = { id, status: 'empty', lastModified: null, fields: {}, narrative: '', notes: '', integrationSource: null, integrationTimestamp: null };
      });
      return {
        meta: { name: 'Untitled Project', version: '1.0', created: now, modified: now, author: '', status: 'Draft' },
        settings: { theme: localStorage.getItem('coffeecup-theme') || 'blueprint', enabledSections: [], sectionOrder: [...TIER1_IDS, ...TIER2_IDS, ...TIER3_IDS], complexity: 'standard' },
        sections,
      };
    };

    // ============================================
    // RICH TEXT EDITOR COMPONENT
    // ============================================
    const RichTextEditor = ({ value, onChange, placeholder }) => {
      const editorRef = useRef(null);
      const isInternalChange = useRef(false);

      useEffect(() => {
        if (editorRef.current && !isInternalChange.current) {
          if (editorRef.current.innerHTML !== value) {
            editorRef.current.innerHTML = value || '';
          }
        }
        isInternalChange.current = false;
      }, [value]);

      const handleInput = () => {
        isInternalChange.current = true;
        onChange(editorRef.current.innerHTML);
      };

      const exec = (cmd, val = null) => {
        document.execCommand(cmd, false, val);
        editorRef.current.focus();
        handleInput();
      };

      return (
        <div>
          <div className="rich-text-toolbar">
            <button onClick={() => exec('bold')} title="Bold"><Icon name="bold" size={14} /></button>
            <button onClick={() => exec('italic')} title="Italic"><Icon name="italic" size={14} /></button>
            <div className="separator" />
            <button onClick={() => exec('insertUnorderedList')} title="Bullet list">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><circle cx="3" cy="6" r="1.5" fill="currentColor" stroke="none" /><circle cx="3" cy="12" r="1.5" fill="currentColor" stroke="none" /><circle cx="3" cy="18" r="1.5" fill="currentColor" stroke="none" /></svg>
            </button>
            <button onClick={() => exec('insertOrderedList')} title="Numbered list">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="10" y1="6" x2="21" y2="6" /><line x1="10" y1="12" x2="21" y2="12" /><line x1="10" y1="18" x2="21" y2="18" /><text x="2" y="8" fill="currentColor" stroke="none" fontSize="8" fontWeight="600">1</text><text x="2" y="14" fill="currentColor" stroke="none" fontSize="8" fontWeight="600">2</text><text x="2" y="20" fill="currentColor" stroke="none" fontSize="8" fontWeight="600">3</text></svg>
            </button>
            <div className="separator" />
            <button onClick={() => exec('formatBlock', '<h3>')} title="Heading">H</button>
          </div>
          <div
            ref={editorRef}
            className="rich-text-content"
            contentEditable
            onInput={handleInput}
            onBlur={handleInput}
            data-placeholder={placeholder || 'Enter description...'}
          />
        </div>
      );
    };

    // ============================================
    // LIST EDITOR COMPONENT
    // ============================================
    const ListEditor = ({ items = [], onChange, placeholder = 'Add item...' }) => {
      const addItem = () => onChange([...items, '']);
      const updateItem = (i, val) => { const n = [...items]; n[i] = val; onChange(n); };
      const removeItem = (i) => onChange(items.filter((_, j) => j !== i));

      return (
        <div className="list-editor">
          {items.map((item, i) => (
            <div key={i} className="list-editor-item">
              <input className="input-refined" value={item} onChange={e => updateItem(i, e.target.value)} placeholder={placeholder} />
              <button className="remove-btn" onClick={() => removeItem(i)}><Icon name="x" size={14} /></button>
            </div>
          ))}
          <button className="add-row-btn" onClick={addItem}><Icon name="plus" size={14} /> Add item</button>
        </div>
      );
    };

    // ============================================
    // DATA TABLE COMPONENT
    // ============================================
    const DataTable = ({ columns, rows = [], onChange, onAdd, onRemove }) => (
      <div style={{ overflowX: 'auto' }}>
        <table className="data-table">
          <thead><tr>{columns.map(c => <th key={c.key} style={c.width ? { width: c.width } : {}}>{c.label}</th>)}<th style={{ width: 40 }}></th></tr></thead>
          <tbody>
            {rows.map((row, ri) => (
              <tr key={ri}>
                {columns.map(c => (
                  <td key={c.key}>
                    {c.type === 'select' ? (
                      <select className="select-refined" style={{ width: '100%', padding: '4px 8px', fontSize: 12 }} value={row[c.key] || ''} onChange={e => onChange(ri, c.key, e.target.value)}>
                        <option value="">—</option>
                        {c.options.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    ) : (
                      <input className="cell-input" value={row[c.key] || ''} onChange={e => onChange(ri, c.key, e.target.value)} placeholder={c.placeholder || ''} />
                    )}
                  </td>
                ))}
                <td><button className="remove-btn" onClick={() => onRemove(ri)} style={{ margin: '0 auto' }}><Icon name="trash" size={12} /></button></td>
              </tr>
            ))}
          </tbody>
        </table>
        <button className="add-row-btn" onClick={onAdd}><Icon name="plus" size={14} /> Add row</button>
      </div>
    );

    // ============================================
    // INTEGRATION BANNER
    // ============================================
    const IntegrationBanner = ({ sourceKey, onPull }) => {
      const storageKey = INTEGRATION_KEYS[sourceKey];
      const name = INTEGRATION_NAMES[sourceKey];
      const [available, setAvailable] = useState(false);

      useEffect(() => {
        try { setAvailable(!!localStorage.getItem(storageKey)); } catch (e) { }
      }, [storageKey]);

      if (!available) return null;

      return (
        <div className="integration-banner">
          <Icon name="refresh" size={16} />
          <div className="banner-text">
            Data available from <span className="banner-source">{name}</span>.
          </div>
          <button className="btn btn-sm btn-primary" onClick={onPull}><Icon name="download" size={12} /> Pull Latest</button>
        </div>
      );
    };

    // ============================================
    // SECTION EDITORS
    // ============================================

    // Helper: update a field in a section
    const useSection = (sectionId, state, setState) => {
      const section = state.sections[sectionId] || {};
      const fields = section.fields || {};
      const setField = (key, val) => {
        setState(prev => {
          const now = new Date().toISOString();
          const sec = { ...prev.sections[sectionId], fields: { ...prev.sections[sectionId].fields, [key]: val }, lastModified: now, status: prev.sections[sectionId].status === 'empty' ? 'draft' : prev.sections[sectionId].status };
          return { ...prev, meta: { ...prev.meta, modified: now }, sections: { ...prev.sections, [sectionId]: sec } };
        });
      };
      const setNarrative = (val) => {
        setState(prev => {
          const now = new Date().toISOString();
          const sec = { ...prev.sections[sectionId], narrative: val, lastModified: now, status: prev.sections[sectionId].status === 'empty' ? 'draft' : prev.sections[sectionId].status };
          return { ...prev, meta: { ...prev.meta, modified: now }, sections: { ...prev.sections, [sectionId]: sec } };
        });
      };
      const setNotes = (val) => {
        setState(prev => {
          const now = new Date().toISOString();
          return { ...prev, sections: { ...prev.sections, [sectionId]: { ...prev.sections[sectionId], notes: val, lastModified: now } } };
        });
      };
      const setStatus = (val) => {
        setState(prev => ({ ...prev, sections: { ...prev.sections, [sectionId]: { ...prev.sections[sectionId], status: val } } }));
      };
      return { section, fields, setField, setNarrative, setNotes, setStatus };
    };

    // Generic section wrapper
    const SectionWrapper = ({ sectionId, state, setState, children }) => {
      const def = SECTION_DEFS[sectionId];
      const { section, setNotes, setStatus } = useSection(sectionId, state, setState);

      return (
        <div className="section-editor">
          <div className="section-header">
            <h2>{def.name}</h2>
            <p>{def.description}</p>
            <div className="section-status-bar">
              <select className="select-refined section-status-select" value={section.status} onChange={e => setStatus(e.target.value)}>
                <option value="empty">Empty</option>
                <option value="draft">Draft</option>
                <option value="complete">Complete</option>
              </select>
              {section.lastModified && <span style={{ fontSize: 11, color: 'var(--text-faint)' }}>Last edited: {new Date(section.lastModified).toLocaleDateString('en-GB')}</span>}
            </div>
          </div>

          {def.integration && <IntegrationBanner sourceKey={def.integration} onPull={() => pullIntegration(sectionId, def.integration, state, setState)} />}
          {def.integrationAlt && <IntegrationBanner sourceKey={def.integrationAlt} onPull={() => pullIntegration(sectionId, def.integrationAlt, state, setState)} />}

          <div className="section-content">
            <div className="section-content-inner">
              {children}
            </div>
            <div className="section-content-inner section-notes">
              <div className="section-notes-label"><Icon name="file-text" size={12} /> Internal Notes (not exported)</div>
              <textarea className="textarea-refined" value={section.notes || ''} onChange={e => setNotes(e.target.value)} placeholder="Add internal notes about this section..." rows={2} />
            </div>
          </div>
        </div>
      );
    };

    // Pull integration data
    const pullIntegration = (sectionId, sourceKey, state, setState) => {
      const storageKey = INTEGRATION_KEYS[sourceKey];
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return;
        const data = JSON.parse(raw);
        const now = new Date().toISOString();

        setState(prev => {
          const sec = { ...prev.sections[sectionId] };
          sec.integrationSource = sourceKey;
          sec.integrationTimestamp = now;
          sec.lastModified = now;
          if (sec.status === 'empty') sec.status = 'draft';

          // Map data depending on section type
          if (sectionId === 'schedule' || sectionId === 'scheduleBase') {
            const activities = data.activities || [];
            const milestones = activities.filter(a => a.milestone || a.duration === 0).map(a => ({
              name: a.name || a.activity || '', date: a.start || '', status: (a.progress || 0) >= 100 ? 'Complete' : 'Pending'
            }));
            const allActivities = activities.map(a => ({
              name: a.name || a.activity || '', start: a.start || '', end: a.end || '', duration: a.duration || '', progress: (a.progress || 0) + '%'
            }));
            sec.fields = { ...sec.fields, milestones: milestones.length ? milestones : sec.fields.milestones, activities: allActivities, startDate: data.startDate || sec.fields.startDate };
          }
          if (sectionId === 'risk') {
            const risks = data.risks || [];
            const topRisks = risks.slice(0, 10).map(r => ({
              name: r.name || r.title || '', category: r.category || '', probability: r.probability || r.preProb || '', impact: r.impact || r.preCostMost || '', response: r.response || r.strategy || '', owner: r.owner || ''
            }));
            sec.fields = { ...sec.fields, risks: topRisks };
          }
          if ((sectionId === 'team' || sectionId === 'wbs') && sourceKey === 'hierarchy') {
            sec.fields = { ...sec.fields, hierarchyData: data };
          }

          // RACI integration
          if (sourceKey === 'raci') {
            const roles = data.roles || [];
            const groups = data.groups || [];
            const assignments = data.assignments || {};
            const codes = data.codes || [];
            const allTasks = groups.flatMap(g => (g.tasks || []).map(t => ({ ...t, group: g.name })));

            if (sectionId === 'team') {
              // Map RACI roles to team members, summarise their responsibilities
              const teamMembers = roles.map(role => {
                const responsible = allTasks.filter(t => assignments[`${t.id}|${role.id}`] === 'R').map(t => t.name);
                const accountable = allTasks.filter(t => assignments[`${t.id}|${role.id}`] === 'A').map(t => t.name);
                const summary = [];
                if (accountable.length) summary.push('Accountable: ' + accountable.join(', '));
                if (responsible.length) summary.push('Responsible: ' + responsible.join(', '));
                return { name: '', role: role.name, responsibility: summary.join('; ') || '—', allocation: '' };
              });
              sec.fields = { ...sec.fields, teamMembers };
            }

            if (sectionId === 'comms') {
              // Extract Consulted and Informed parties as communication items
              const commItems = roles.map(role => {
                const consulted = allTasks.filter(t => assignments[`${t.id}|${role.id}`] === 'C').map(t => t.name);
                const informed = allTasks.filter(t => assignments[`${t.id}|${role.id}`] === 'I').map(t => t.name);
                if (consulted.length === 0 && informed.length === 0) return null;
                const what = [];
                if (consulted.length) what.push('Consulted on ' + consulted.length + ' tasks');
                if (informed.length) what.push('Informed on ' + informed.length + ' tasks');
                return { what: what.join(', '), audience: role.name, frequency: '', owner: '', method: '' };
              }).filter(Boolean);
              sec.fields = { ...sec.fields, commItems };
            }

            if (sectionId === 'stakeholders') {
              // Map RACI roles to stakeholders with influence based on A/R count
              const stakeholders = roles.map(role => {
                const aCount = allTasks.filter(t => assignments[`${t.id}|${role.id}`] === 'A').length;
                const rCount = allTasks.filter(t => assignments[`${t.id}|${role.id}`] === 'R').length;
                const cCount = allTasks.filter(t => assignments[`${t.id}|${role.id}`] === 'C').length;
                const total = aCount + rCount + cCount;
                const influence = aCount > 2 ? 'High' : (aCount > 0 || rCount > 2) ? 'Medium' : 'Low';
                const interest = (rCount + aCount) > 3 ? 'High' : total > 2 ? 'Medium' : 'Low';
                return { name: '', role: role.name, interest, influence, strategy: '' };
              });
              sec.fields = { ...sec.fields, stakeholders };
            }
          }

          // Cost Tracker integration
          if (sourceKey === 'cost') {
            const cats = data.categories || [];
            const transactions = data.transactions || [];
            const contingency = data.contingency || {};
            const mgmtReserve = data.managementReserve || {};
            const sym = (data.meta && data.meta.currencySymbol) || '£';

            // Calculate EVM metrics (mirrors Cost Tracker's calcEVM)
            const BAC = cats.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + (li.totalCost || 0), 0), 0);
            const AC = transactions.reduce((s, t) => s + (t.amount || 0), 0);
            const EV = cats.reduce((s, c) => s + c.lineItems.reduce((ls, li) => ls + ((li.percentComplete || 0) / 100) * (li.totalCost || 0), 0), 0);
            const CPI = AC !== 0 ? EV / AC : 0;
            const EAC = CPI !== 0 ? BAC / CPI : 0;

            // Contingency
            let contingencyAmount = 0;
            if (contingency.method === 'manual') contingencyAmount = contingency.manualAmount || 0;
            else if (contingency.method === 'percentage') contingencyAmount = BAC * ((contingency.percentage || 0) / 100);
            else if (contingency.method === 'emv') contingencyAmount = (contingency.riskBreakdown || []).reduce((s, r) => s + (r.emv || 0), 0);
            const costBaseline = BAC + contingencyAmount;

            // Management Reserve
            let mgmtReserveAmount = 0;
            if (mgmtReserve.method === 'percentage') mgmtReserveAmount = costBaseline * ((mgmtReserve.percentage || 0) / 100);
            else mgmtReserveAmount = mgmtReserve.manualAmount || 0;
            const totalBudget = costBaseline + mgmtReserveAmount;

            // Category breakdown
            const actualsByCategory = {};
            transactions.forEach(t => { actualsByCategory[t.categoryId] = (actualsByCategory[t.categoryId] || 0) + (t.amount || 0); });

            const budgetLines = cats.map(c => {
              const planned = c.lineItems.reduce((s, li) => s + (li.totalCost || 0), 0);
              const actual = actualsByCategory[c.id] || 0;
              return { category: c.name, description: c.lineItems.length + ' line item' + (c.lineItems.length !== 1 ? 's' : ''), amount: String(planned), actual: String(actual) };
            });

            const fmt = (v) => sym + v.toLocaleString('en-GB', { maximumFractionDigits: 0 });

            if (sectionId === 'budget') {
              sec.fields = {
                ...sec.fields,
                totalBudget: fmt(totalBudget),
                contingency: fmt(contingencyAmount) + ' (contingency) + ' + fmt(mgmtReserveAmount) + ' (mgmt reserve)',
                budgetLines,
                // EVM summary fields for display
                costBAC: fmt(BAC),
                costAC: fmt(AC),
                costEAC: fmt(EAC),
                costCPI: CPI ? CPI.toFixed(2) : '—',
                costContingencyUsed: fmt(contingency.utilised || 0),
                costContingencyRemaining: fmt(contingencyAmount - (contingency.utilised || 0)),
                costProjectName: (data.meta && data.meta.name) || '',
              };
            }

            if (sectionId === 'costBase') {
              // Time-phased data
              const periods = (data.timePhased && data.timePhased.periods) || [];
              const timePhased = periods.map(p => ({
                period: p.label, planned: fmt(p.planned || 0), actual: fmt(p.actual || 0), earned: fmt(p.earned || 0)
              }));

              // Baselines
              const baselines = (data.baselines || []).map(b => ({
                name: b.name, date: b.date ? new Date(b.date).toLocaleDateString('en-GB') : '—'
              }));

              sec.fields = {
                ...sec.fields,
                costEstimate: fmt(BAC),
                contingencyReserve: fmt(contingencyAmount),
                costBaseline: fmt(costBaseline),
                managementReserve: fmt(mgmtReserveAmount),
                totalBudget: fmt(totalBudget),
                timePhased,
                baselines,
                varianceSummary: 'CPI: ' + (CPI ? CPI.toFixed(2) : '—') + ' | Cost Variance: ' + fmt(EV - AC) + ' | EAC: ' + fmt(EAC),
              };
            }
          }

          // Stakeholder Map integration
          if (sourceKey === 'stakeholder') {
            const stakeholders = data.stakeholders || [];
            const QUAD_NAMES = {
              'manage-closely': 'Manage Closely', 'keep-satisfied': 'Keep Satisfied',
              'keep-informed': 'Keep Informed', 'monitor': 'Monitor'
            };
            if (sectionId === 'stakeholders') {
              sec.fields = {
                ...sec.fields,
                stakeholders: stakeholders.map(s => ({
                  name: s.name || '', role: s.role || '',
                  interest: s.interest >= 6 ? 'High' : s.interest >= 4 ? 'Medium' : 'Low',
                  influence: s.power >= 6 ? 'High' : s.power >= 4 ? 'Medium' : 'Low',
                  strategy: QUAD_NAMES[s.engagement] || ''
                }))
              };
            }
          }

          // Change & Issue Register integration
          if (sourceKey === 'change') {
            const items = data.items || [];

            if (sectionId === 'change') {
              // Change Management Section (Tier 1)
              // Append a summary of open change requests to the narrative.
              const changes = items.filter(i => i.type === 'change');
              const openChanges = changes.filter(c => c.status !== 'Implemented' && c.status !== 'Rejected').length;

              const narrativeUpdate = `<p><strong>Integration Update (${new Date().toLocaleDateString()}):</strong> There are currently ${openChanges} open change requests in the register.</p>`;
              // Only append if not already present to avoid duplication on repeated pulls (simple check)
              if (!sec.narrative || !sec.narrative.includes('Integration Update')) {
                sec.narrative = (sec.narrative || '') + narrativeUpdate;
              }
            }

            if (sectionId === 'issues') {
              // Issue Log Section (Tier 2)
              // Format open issues as an HTML table
              const issues = items.filter(i => i.type === 'issue');
              const openIssues = issues.filter(i => i.status !== 'Resolved' && i.status !== 'Closed');

              let html = '<h3>Open Issues from Register</h3>';
              if (openIssues.length === 0) {
                html += '<p>No open issues found.</p>';
              } else {
                html += '<table class="data-table" style="font-size:12px; margin-top:10px; width:100%; border-collapse: collapse;">';
                html += '<thead><tr style="background:var(--bg-secondary); text-align:left;"><th style="padding:8px; border:1px solid var(--border-primary);">ID</th><th style="padding:8px; border:1px solid var(--border-primary);">Title</th><th style="padding:8px; border:1px solid var(--border-primary);">Priority</th><th style="padding:8px; border:1px solid var(--border-primary);">Status</th><th style="padding:8px; border:1px solid var(--border-primary);">Owner</th></tr></thead><tbody>';
                openIssues.forEach(i => {
                  html += `<tr><td style="padding:8px; border:1px solid var(--border-primary);">${i.id || ''}</td><td style="padding:8px; border:1px solid var(--border-primary);">${i.title || ''}</td><td style="padding:8px; border:1px solid var(--border-primary);">${i.priority || ''}</td><td style="padding:8px; border:1px solid var(--border-primary);">${i.status || ''}</td><td style="padding:8px; border:1px solid var(--border-primary);">${i.owner || ''}</td></tr>`;
                });
                html += '</tbody></table>';
              }
              sec.narrative = html; // Replace narrative with the issue list for this section
            }
          }

          // EVM Dashboard integration
          if (sourceKey === 'evm') {
            const sym = data.sym || '£';
            const fmt = (v) => v != null ? sym + Number(v).toLocaleString('en-GB', { maximumFractionDigits: 0 }) : '—';

            if (sectionId === 'evm') {
              sec.fields = {
                ...sec.fields,
                evm: {
                  cpi: data.CPI != null ? data.CPI.toFixed(2) : '—',
                  spi: data.SPI != null ? data.SPI.toFixed(2) : '—',
                  tcpi: data.TCPI != null ? data.TCPI.toFixed(2) : '—',
                  cv: fmt(data.CV),
                  sv: fmt(data.SV),
                  bac: fmt(data.BAC),
                  ev: fmt(data.EV),
                  ac: fmt(data.AC),
                  pv: fmt(data.PV),
                  eac: fmt(data.EAC),
                  etc: fmt(data.ETC),
                  vac: fmt(data.VAC)
                },
                schedule: {
                  elapsed: data.scheduleElapsed || 0,
                  total: data.criticalPathLength || 0,
                  pct: data.schedulePct || 0
                }
              };

              // Auto-generate status narrative if empty or update
              const status = (data.CPI >= 1 && data.SPI >= 1) ? 'ahead of schedule and under budget' :
                (data.CPI < 1 && data.SPI < 1) ? 'behind schedule and over budget' :
                  (data.CPI < 1) ? 'over budget' : 'behind schedule';

              const narrativeUpdate = `<p><strong>EVM Status Update (${new Date().toLocaleDateString()}):</strong> Project is currently running ${status}.<br>CPI: ${data.CPI?.toFixed(2)} | SPI: ${data.SPI?.toFixed(2)}<br>Estimate at Completion is ${fmt(data.EAC)} against a Budget at Completion of ${fmt(data.BAC)}.</p>`;

              if (!sec.narrative || !sec.narrative.includes('EVM Status Update')) {
                sec.narrative = narrativeUpdate + (sec.narrative || '');
              }
            }
          }

          // Quality Register integration
          if (sourceKey === 'quality') {
            if (sectionId === 'quality') {
              const openDefects = (data.defects || []).filter(d => d.status !== 'Closed').length;
              const criticalDefects = (data.defects || []).filter(d => d.severity === 'Critical' && d.status !== 'Closed').length;

              sec.fields = {
                ...sec.fields,
                metrics: { openDefects, criticalDefects },
                standards: (data.criteria || []).map(c => `${c.category}: ${c.description} (${c.method})`),
                defects: (data.defects || []).filter(d => d.status !== 'Closed').map(d => `[${d.severity}] ${d.description} (${d.status})`)
              };

              // Auto-narrative
              if (!sec.narrative || !sec.narrative.includes('Quality Status Update')) {
                const status = criticalDefects > 0 ? 'AT RISK' : openDefects > 5 ? 'NEEDS ATTENTION' : 'ON TRACK';
                sec.narrative = `<p><strong>Quality Status Update (${new Date().toLocaleDateString()}): ${status}</strong><br>There are currently ${openDefects} open defects (${criticalDefects} critical). ${data.approvals?.length || 0} deliverables have been formally accepted.</p>` + (sec.narrative || '');
              }
            }
          }

          // Integrated Analysis integration
          if (sourceKey === 'analysis') {
            if (sectionId === 'quantitativeAnalysis') {
              const lastRun = data.lastRun || {};
              const det = lastRun.deterministic || {};
              sec.fields = {
                ...sec.fields,
                lastRun: {
                  timestamp: lastRun.timestamp,
                  iterations: lastRun.iterations,
                  scheduleP50: lastRun.scheduleP50,
                  scheduleP80: lastRun.scheduleP80,
                  scheduleP90: lastRun.scheduleP90,
                  costP50: lastRun.costP50,
                  costP80: lastRun.costP80,
                  costP90: lastRun.costP90,
                  deterministicSchedule: det.scheduleDays,
                  deterministicCost: det.totalCost
                }
              };

              // Auto-narrative
              if (lastRun.timestamp) {
                const schedContingency = lastRun.scheduleP80 && det.scheduleDays ? Math.round(lastRun.scheduleP80 - det.scheduleDays) : null;
                const costContingency = lastRun.costP80 && det.totalCost ? Math.round(lastRun.costP80 - det.totalCost) : null;
                const narrativeUpdate = `<p><strong>Quantitative Analysis Update (${new Date(lastRun.timestamp).toLocaleDateString()}):</strong><br>Monte Carlo simulation (${(lastRun.iterations || 0).toLocaleString()} iterations) produced P80 schedule of ${Math.round(lastRun.scheduleP80 || 0)} days${schedContingency ? ' (+' + schedContingency + ' day contingency)' : ''} and P80 cost of £${Math.round(lastRun.costP80 || 0).toLocaleString()}${costContingency ? ' (+£' + costContingency.toLocaleString() + ' contingency)' : ''}.</p>`;
                if (!sec.narrative || !sec.narrative.includes('Quantitative Analysis Update')) {
                  sec.narrative = narrativeUpdate + (sec.narrative || '');
                }
              }
            }
          }

          // Estimator integration
          if (sourceKey === 'estimator') {
            if (sectionId === 'procurement') {
              // Inline helpers (same logic as Estimator app)
              function resolveZones(dims) {
                const zones = (dims && dims.zones) || [];
                // Legacy flat format fallback
                if (zones.length === 0 && dims && dims.length !== undefined) {
                  const l=parseFloat(dims.length)||0, w=parseFloat(dims.width)||0, h=parseFloat(dims.height)||0;
                  return { floorArea:l*w, wallArea:2*(l+w)*h, ceilingArea:l*w, perimeter:2*(l+w), volume:l*w*h, length:l, width:w, height:h };
                }
                let floorArea=0, wallArea=0, perimeter=0, volume=0, totalLength=0, totalWidth=0, totalHeight=0;
                zones.forEach(z => { const l=parseFloat(z.length)||0, w=parseFloat(z.width)||0, h=parseFloat(z.height)||0; floorArea+=l*w; wallArea+=2*(l+w)*h; perimeter+=2*(l+w); volume+=l*w*h; totalLength+=l; totalWidth+=w; totalHeight=Math.max(totalHeight,h); });
                return { floorArea, wallArea, ceilingArea:floorArea, perimeter, volume, length:totalLength, width:totalWidth, height:totalHeight };
              }
              function resolveDim(dims, src, manualQty) {
                if (src === 'custom') return parseFloat(manualQty)||0;
                const r = resolveZones(dims);
                return r[src]||0;
              }
              function calcMatCost(dims, mat) {
                const dim = resolveDim(dims, mat.dimensionSource, mat.manualQty);
                const rate = parseFloat(mat.coverageRate)||0;
                const baseQty = mat.dimensionSource==='custom' ? dim : (rate>0 ? dim/rate : 0);
                const wasteQty = baseQty * (1 + (parseFloat(mat.wastage)||0)/100);
                const ps = parseFloat(mat.packSize)||0, pp = parseFloat(mat.packPrice)||0, ur = parseFloat(mat.unitRate)||0;
                if(ps>0) return Math.ceil(wasteQty/ps)*pp;
                return wasteQty*ur;
              }

              const cats = data.categories || [];
              const sym = (data.meta && data.meta.currencySymbol) || '£';
              const fmt = (v) => sym + Number(v).toLocaleString('en-GB', { maximumFractionDigits: 2 });

              const procurementItems = cats.map(cat => {
                const catTotal = (cat.materials || []).reduce((s, mat) => s + calcMatCost(cat.dimensions || {}, mat), 0);
                return {
                  description: cat.name || 'Unnamed Category',
                  estimatedCost: fmt(catTotal),
                  estimatedCostRaw: catTotal,
                  materialCount: (cat.materials || []).length,
                  supplier: 'From Estimator',
                  status: 'Identified'
                };
              });

              const grandTotal = procurementItems.reduce((s, p) => s + (p.estimatedCostRaw || 0), 0);

              sec.fields = {
                ...sec.fields,
                procurementItems,
                estimatorTotal: fmt(grandTotal),
                estimatorTotalRaw: grandTotal,
                estimatorProjectName: (data.meta && data.meta.name) || '',
                estimatorCurrencySymbol: sym
              };

              // Auto-narrative
              if (!sec.narrative || !sec.narrative.includes('Estimator Update')) {
                const narrativeUpdate = `<p><strong>Estimator Update (${new Date().toLocaleDateString()}):</strong> ${cats.length} material categor${cats.length === 1 ? 'y' : 'ies'} pulled from the Estimator with a grand total of ${fmt(grandTotal)}.</p>`;
                sec.narrative = narrativeUpdate + (sec.narrative || '');
              }
            }
          }

          return { ...prev, meta: { ...prev.meta, modified: now }, sections: { ...prev.sections, [sectionId]: sec } };
        });
      } catch (e) { console.error('Integration pull failed:', e); }
    };

    const SuccessEditor = ({ state, setState }) => {

        <SectionWrapper sectionId="evm" state={state} setState={setState}>

    const QuantitativeAnalysisEditor = ({ state, setState }) => {
      const { fields, setField, setNarrative, section } = useSection('quantitativeAnalysis', state, setState);
      const lr = fields.lastRun || {};
      const fmt = (v) => v != null ? '£' + Number(v).toLocaleString('en-GB', { maximumFractionDigits: 0 }) : '—';

      const MetricCard = ({ label, value, sub }) => (
        <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border-secondary)', borderRadius: 'var(--radius-md)', padding: '12px', textAlign: 'center' }}>
          <div style={{ fontSize: 11, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 4 }}>{label}</div>
          <div style={{ fontSize: 18, fontWeight: 700, fontFamily: 'var(--font-mono)', color: 'var(--text-primary)' }}>{value || '—'}</div>
          {sub && <div style={{ fontSize: 10, color: 'var(--text-faint)', marginTop: 2 }}>{sub}</div>}
        </div>
      );

      return (
        <SectionWrapper sectionId="quantitativeAnalysis" state={state} setState={setState}>
          {lr.timestamp ? (
            <>
              <div style={{ fontSize: 11, color: 'var(--text-faint)', marginBottom: 12 }}>
                Last simulation: {new Date(lr.timestamp).toLocaleString('en-GB')} — {(lr.iterations || 0).toLocaleString()} iterations
              </div>
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: 8 }}>Schedule Confidence</div>

                  <MetricCard label="P50" value={lr.scheduleP50 != null ? Math.round(lr.scheduleP50) + 'd' : '—'} sub="Most Likely" />
                  <MetricCard label="P80" value={lr.scheduleP80 != null ? Math.round(lr.scheduleP80) + 'd' : '—'} sub="Recommended" />
                  <MetricCard label="P90" value={lr.scheduleP90 != null ? Math.round(lr.scheduleP90) + 'd' : '—'} sub="Conservative" />
                </div>
              </div>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: 8 }}>Cost Confidence</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(100px, 1fr))', gap: 12 }}>
                  <MetricCard label="Deterministic" value={fmt(lr.deterministicCost)} sub="Base Budget" />
                  <MetricCard label="P50" value={fmt(lr.costP50)} sub="Most Likely" />
                  <MetricCard label="P80" value={fmt(lr.costP80)} sub="Recommended" />
                  <MetricCard label="P90" value={fmt(lr.costP90)} sub="Conservative" />
                </div>
              </div>
            </>

            <div style={{ padding: 20, textAlign: 'center', color: 'var(--text-muted)', fontStyle: 'italic', background: 'var(--bg-secondary)', borderRadius: 'var(--radius-lg)', marginBottom: 20 }}>
              Connect Integrated Analysis to see Monte Carlo simulation results (P50/P80 schedule and cost confidence levels).

            <RichTextEditor value={section.narrative} onChange={setNarrative} placeholder="Provide commentary on the quantitative analysis results, contingency recommendations, and confidence levels..." />

    const EstimatorProcurementEditor = ({ state, setState }) => {
      const { fields, setField, setNarrative, section } = useSection('procurement', state, setState);
      const items = fields.procurementItems || [];
      const sym = fields.estimatorCurrencySymbol || '£';
      const fmt = (v) => v != null ? sym + Number(v).toLocaleString('en-GB', { maximumFractionDigits: 2 }) : '—';

      return (
        <SectionWrapper sectionId="procurement" state={state} setState={setState}>
          {items.length > 0 ? (
            <>
              {fields.estimatorProjectName && (
                <div style={{ fontSize: 11, color: 'var(--text-faint)', marginBottom: 12 }}>
                  Source: <strong>{fields.estimatorProjectName}</strong>
                </div>
              )}
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, marginBottom: 16 }}>
                <thead>
                  <tr style={{ background: 'var(--bg-secondary)', textAlign: 'left' }}>
                    <th style={{ padding: '8px 10px', borderBottom: '2px solid var(--border-primary)', fontWeight: 600 }}>Category</th>
                    <th style={{ padding: '8px 10px', borderBottom: '2px solid var(--border-primary)', fontWeight: 600, textAlign: 'center' }}>Materials</th>
                    <th style={{ padding: '8px 10px', borderBottom: '2px solid var(--border-primary)', fontWeight: 600, textAlign: 'right' }}>Estimated Cost</th>
                    <th style={{ padding: '8px 10px', borderBottom: '2px solid var(--border-primary)', fontWeight: 600 }}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {items.map((item, i) => (
                    <tr key={i} style={{ borderBottom: '1px solid var(--border-primary)' }}>
                      <td style={{ padding: '8px 10px' }}>{item.description}</td>
                      <td style={{ padding: '8px 10px', textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 12 }}>{item.materialCount}</td>
                      <td style={{ padding: '8px 10px', textAlign: 'right', fontFamily: 'var(--font-mono)', fontSize: 12 }}>{item.estimatedCost}</td>
                      <td style={{ padding: '8px 10px' }}>
                        <span style={{ fontSize: 11, padding: '2px 8px', borderRadius: 'var(--radius-full)', background: 'var(--accent-light)', color: 'var(--accent-primary)', fontWeight: 600 }}>{item.status}</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr style={{ background: 'var(--bg-secondary)', fontWeight: 700 }}>
                    <td style={{ padding: '8px 10px' }}>Grand Total</td>
                    <td style={{ padding: '8px 10px', textAlign: 'center', fontFamily: 'var(--font-mono)', fontSize: 12 }}>{items.reduce((s, p) => s + (p.materialCount || 0), 0)}</td>
                    <td style={{ padding: '8px 10px', textAlign: 'right', fontFamily: 'var(--font-mono)', fontSize: 12 }}>{fields.estimatorTotal || '—'}</td>
                    <td style={{ padding: '8px 10px' }}></td>
                  </tr>
                </tfoot>
              </table>
            </>
          ) : (
            <div style={{ padding: 20, textAlign: 'center', color: 'var(--text-muted)', fontStyle: 'italic', background: 'var(--bg-secondary)', borderRadius: 'var(--radius-lg)', marginBottom: 20 }}>
              Connect the Estimator to see material categories and procurement costs.
            </div>
          )}

          <div className="form-group"><label className="form-label">Procurement Commentary</label>
            <RichTextEditor value={section.narrative} onChange={setNarrative} placeholder="Describe procurement strategy, make-or-buy decisions, vendor selection criteria, and contract types..." />
          </div>
        </SectionWrapper>
      );
    };

    // Section router
    const SECTION_EDITORS = {
      overview: OverviewEditor,
      scope: ScopeEditor,
      schedule: ScheduleEditor,
      budget: BudgetEditor,
      costBase: CostBaseEditor,
      team: TeamEditor,
      risk: RiskEditor,
      comms: CommsEditor,
      stakeholders: StakeholderEditor,
      change: ChangeEditor,
      success: SuccessEditor,
      evm: EvmEditor,
      quality: QualityEditor,
      quantitativeAnalysis: QuantitativeAnalysisEditor,
      procurement: EstimatorProcurementEditor,
    };

    const renderSection = (sectionId, state, setState) => {
      const Editor = SECTION_EDITORS[sectionId] || GenericEditor;
      if (Editor === GenericEditor) return <GenericEditor sectionId={sectionId} state={state} setState={setState} />;
      return <Editor state={state} setState={setState} />;
    };

    // ============================================
    // DASHBOARD
    // ============================================
    const Dashboard = ({ state, setState, onNavigate }) => {
      const activeSections = getActiveSections(state);
      const completed = activeSections.filter(id => state.sections[id]?.status === 'complete').length;
      const drafts = activeSections.filter(id => state.sections[id]?.status === 'draft').length;
      const empty = activeSections.filter(id => state.sections[id]?.status === 'empty').length;
      const pct = activeSections.length > 0 ? Math.round((completed / activeSections.length) * 100) : 0;

      // Check integrations
      const integrationStatus = Object.entries(INTEGRATION_KEYS).map(([key, storageKey]) => {
        let available = false;
        try { available = !!localStorage.getItem(storageKey); } catch (e) { }
        return { key, name: INTEGRATION_NAMES[key], available };
      });

      // Recent activity
      const recentSections = activeSections
        .filter(id => state.sections[id]?.lastModified)
        .sort((a, b) => new Date(state.sections[b].lastModified) - new Date(state.sections[a].lastModified))
        .slice(0, 5);

      return (
        <div style={{ animation: 'fadeIn 0.3s ease' }}>
          <div style={{ marginBottom: 24 }}>
            <h2 style={{ fontSize: 22, fontWeight: 700, margin: '0 0 4px' }}>{state.meta.name || 'Untitled Project'}</h2>
            <p style={{ fontSize: 13, color: 'var(--text-muted)', margin: 0 }}>
              Plan Status: <span className={`plan-status-badge ${state.meta.status.toLowerCase().replace(' ', '-')}`}>{state.meta.status}</span>
              {state.meta.modified && <span style={{ marginLeft: 12, fontSize: 11, color: 'var(--text-faint)' }}>Last modified: {new Date(state.meta.modified).toLocaleDateString('en-GB')}</span>}
            </p>
          </div>

          {/* Stats */}
          <div className="dashboard-grid">
            <div className="stat-card">
              <div className="stat-card-label">Plan Completeness</div>
              <div className="stat-card-value">{pct}%</div>
              <div className="completeness-bar"><div className="completeness-bar-fill" style={{ width: pct + '%' }} /></div>
              <div className="stat-card-sub">{completed} of {activeSections.length} sections complete</div>
            </div>
            <div className="stat-card">
              <div className="stat-card-label">Sections</div>
              <div style={{ display: 'flex', gap: 16, marginTop: 8 }}>
                <div><div style={{ fontSize: 24, fontWeight: 700, color: 'var(--success)' }}>{completed}</div><div style={{ fontSize: 11, color: 'var(--text-faint)' }}>Complete</div></div>
                <div><div style={{ fontSize: 24, fontWeight: 700, color: 'var(--warning)' }}>{drafts}</div><div style={{ fontSize: 11, color: 'var(--text-faint)' }}>Draft</div></div>
                <div><div style={{ fontSize: 24, fontWeight: 700, color: 'var(--text-faint)' }}>{empty}</div><div style={{ fontSize: 11, color: 'var(--text-faint)' }}>Empty</div></div>
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-card-label">Integrations</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginTop: 8 }}>
                {integrationStatus.map(i => (
                  <div key={i.key} className="integration-card" style={{ padding: '6px 10px', border: 'none', background: 'transparent' }}>
                    <div className={`integration-dot ${i.available ? 'available' : 'unavailable'}`} />
                    <span style={{ fontSize: 12, color: i.available ? 'var(--text-primary)' : 'var(--text-faint)' }}>{i.name}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Section Status Grid */}
          <div style={{ marginBottom: 24 }}>
            <h3 style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-secondary)', margin: '0 0 12px' }}>Sections</h3>
            <div className="section-status-grid">
              {activeSections.map(id => {
                const def = SECTION_DEFS[id];
                const sec = state.sections[id];
                return (
                  <div key={id} className="section-status-card" onClick={() => onNavigate(id)}>
                    <div className={`sidebar-item-status ${sec?.status || 'empty'}`} />
                    <Icon name={def.icon} size={14} />
                    <span style={{ fontSize: 13, flex: 1 }}>{def.name}</span>
                    <span style={{ fontSize: 10, color: 'var(--text-faint)', textTransform: 'uppercase' }}>{sec?.status || 'empty'}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Recent Activity */}
          {recentSections.length > 0 && (
            <div>
              <h3 style={{ fontSize: 14, fontWeight: 600, color: 'var(--text-secondary)', margin: '0 0 12px' }}>Recent Activity</h3>
              {recentSections.map(id => (
                <div key={id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid var(--border-secondary)', cursor: 'pointer' }} onClick={() => onNavigate(id)}>
                  <Icon name={SECTION_DEFS[id].icon} size={14} />
                  <span style={{ fontSize: 13, flex: 1 }}>{SECTION_DEFS[id].name}</span>
                  <span style={{ fontSize: 11, color: 'var(--text-faint)' }}>{new Date(state.sections[id].lastModified).toLocaleDateString('en-GB')}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // PREVIEW MODE
    // ============================================
    const PreviewMode = ({ state, onNavigate }) => {
      const activeSections = getActiveSections(state);
      const filledSections = activeSections.filter(id => state.sections[id]?.status !== 'empty');

      const renderFieldValue = (val) => {
        if (Array.isArray(val)) return val.filter(v => v).map((v, i) => <li key={i}>{typeof v === 'object' ? JSON.stringify(v) : v}</li>);
        return val;
      };

      return (
        <div className="preview-mode">
          <div className="preview-cover">
            <h1>{state.meta.name || 'Untitled Project'}</h1>
            <div className="subtitle">Project Management Plan</div>
            <div className="meta">
              {state.meta.author && <div>Author: {state.meta.author}</div>}
              <div>Status: {state.meta.status} | Version: {state.meta.version}</div>
              <div>Created: {new Date(state.meta.created).toLocaleDateString('en-GB')} | Last Modified: {new Date(state.meta.modified).toLocaleDateString('en-GB')}</div>
            </div>
          </div>

          <div className="preview-toc">
            <h2>Table of Contents</h2>
            {filledSections.map((id, i) => (
              <div key={id} className="preview-toc-item" onClick={() => onNavigate(id)}>
                <span>{i + 1}. {SECTION_DEFS[id].name}</span>
              </div>
            ))}
          </div>

          {filledSections.map((id, i) => {
            const def = SECTION_DEFS[id];
            const sec = state.sections[id];
            const fields = sec.fields || {};
            return (
              <div key={id} className="preview-section">
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <h2>{i + 1}. {def.name}</h2>
                  <span className="preview-edit-link no-print" onClick={() => onNavigate(id)}>Edit</span>
                </div>
                {Object.entries(fields).map(([key, val]) => {
                  if (!val || (Array.isArray(val) && val.length === 0)) return null;
                  const label = key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
                  if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'object') {
                    const cols = Object.keys(val[0]);
                    return (
                      <div key={key} style={{ marginBottom: 16 }}>
                        <div className="field-label">{label}</div>
                        <table className="data-table" style={{ fontSize: 12 }}>
                          <thead><tr>{cols.map(c => <th key={c}>{c.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase())}</th>)}</tr></thead>
                          <tbody>{val.map((row, ri) => <tr key={ri}>{cols.map(c => <td key={c}>{row[c]}</td>)}</tr>)}</tbody>
                        </table>
                      </div>
                    );
                  }
                  return (
                    <div key={key} style={{ marginBottom: 12 }}>
                      <div className="field-label">{label}</div>
                      <div className="field-value">
                        {Array.isArray(val) ? <ul style={{ margin: 0, paddingLeft: 20 }}>{renderFieldValue(val)}</ul> : val}
                      </div>
                    </div>
                  );
                })}
                {sec.narrative && <div className="field-value" dangerouslySetInnerHTML={{ __html: sec.narrative }} />}
              </div>
            );
          })}
        </div>
      );
    };

    // ============================================
    // EXPORT FUNCTIONS
    // ============================================
    const exportJSON = (state) => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(state.meta.name || 'pmplan').replace(/\s+/g, '_')}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    const importJSON = (file, setState) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.meta && data.sections) {
            setState(data);
          }
        } catch (err) { alert('Invalid JSON file.'); }
      };
      reader.readAsText(file);
    };

    const saveVersion = (state) => {
      try {
        const versions = JSON.parse(localStorage.getItem(VERSIONS_KEY) || '[]');
        const versionName = prompt('Version name:', `v${state.meta.version} — ${new Date().toLocaleDateString('en-GB')}`);
        if (!versionName) return;
        versions.push({ name: versionName, date: new Date().toISOString(), data: state });
        localStorage.setItem(VERSIONS_KEY, JSON.stringify(versions));
        alert(`Version "${versionName}" saved.`);
      } catch (e) { alert('Failed to save version.'); }
    };

    // ============================================
    // SETTINGS DRAWER
    // ============================================
    const SettingsDrawer = ({ isOpen, onClose, state, setState }) => {
      const fileRef = useRef();

      const setTheme = (t) => setState(prev => ({ ...prev, settings: { ...prev.settings, theme: t } }));
      const toggleSection = (id) => {
        setState(prev => {
          const enabled = prev.settings.enabledSections.includes(id)
            ? prev.settings.enabledSections.filter(s => s !== id)
            : [...prev.settings.enabledSections, id];
          return { ...prev, settings: { ...prev.settings, enabledSections: enabled } };
        });
      };
      const loadPreset = (key) => {
        const preset = TEMPLATE_PRESETS[key];
        if (confirm(`Load "${preset.name}" template? This will update enabled sections.`)) {
          setState(prev => ({ ...prev, settings: { ...prev.settings, enabledSections: [...preset.enabledSections] } }));
        }
      };

      return (
        <>
          <div className={`drawer-overlay ${isOpen ? 'open' : ''}`} onClick={onClose} />
          <div className={`drawer ${isOpen ? 'open' : ''}`}>
            <div className="drawer-header">
              <h2>Settings</h2>
              <button className="drawer-close" onClick={onClose}><Icon name="x" /></button>
            </div>
            <div className="drawer-body">
              {/* Project Meta */}
              <div className="drawer-section">
                <div className="drawer-section-title">Project Details</div>
                <div className="form-group"><label className="form-label">Project Name</label><input className="input-refined" value={state.meta.name} onChange={e => setState(prev => ({ ...prev, meta: { ...prev.meta, name: e.target.value } }))} /></div>
                <div className="form-group"><label className="form-label">Author</label><input className="input-refined" value={state.meta.author} onChange={e => setState(prev => ({ ...prev, meta: { ...prev.meta, author: e.target.value } }))} /></div>
                <div className="form-group"><label className="form-label">Version</label><input className="input-refined" value={state.meta.version} onChange={e => setState(prev => ({ ...prev, meta: { ...prev.meta, version: e.target.value } }))} /></div>
                <div className="form-group"><label className="form-label">Status</label>
                  <select className="select-refined" style={{ width: '100%' }} value={state.meta.status} onChange={e => setState(prev => ({ ...prev, meta: { ...prev.meta, status: e.target.value } }))}>
                    {PLAN_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>

              {/* Theme */}
              <div className="drawer-section">
                <div className="drawer-section-title">Theme</div>
                <div style={{ display: 'flex', gap: 8 }}>
                  {THEMES.map(t => (
                    <button key={t.id} className={`btn btn-sm ${state.settings.theme === t.id ? 'btn-primary' : 'btn-secondary'}`} onClick={() => setTheme(t.id)}>{t.name}</button>
                  ))}
                </div>
              </div>

              {/* Template Presets */}
              <div className="drawer-section">
                <div className="drawer-section-title">Template Presets</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {Object.entries(TEMPLATE_PRESETS).map(([key, preset]) => (
                    <button key={key} className="btn btn-secondary btn-sm" onClick={() => loadPreset(key)} style={{ justifyContent: 'flex-start', textAlign: 'left' }}>
                      <strong>{preset.name}</strong><span style={{ color: 'var(--text-faint)', marginLeft: 8, fontSize: 11 }}>{preset.description}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Extended Sections Toggle */}
              <div className="drawer-section">
                <div className="drawer-section-title">Extended Sections (Tier 2)</div>
                {TIER2_IDS.map(id => (
                  <div key={id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 0' }}>
                    <span style={{ fontSize: 13 }}>{SECTION_DEFS[id].name}</span>
                    <label className="toggle-switch"><input type="checkbox" checked={state.settings.enabledSections.includes(id)} onChange={() => toggleSection(id)} /><span className="toggle-slider" /></label>
                  </div>
                ))}
              </div>

              <div className="drawer-section">
                <div className="drawer-section-title">Specialist Sections (Tier 3)</div>
                {TIER3_IDS.map(id => (
                  <div key={id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 0' }}>
                    <span style={{ fontSize: 13 }}>{SECTION_DEFS[id].name}</span>
                    <label className="toggle-switch"><input type="checkbox" checked={state.settings.enabledSections.includes(id)} onChange={() => toggleSection(id)} /><span className="toggle-slider" /></label>
                  </div>
                ))}
              </div>

              {/* Data Management */}
              <div className="drawer-section">
                <div className="drawer-section-title">Data</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  <button className="btn btn-secondary btn-sm" onClick={() => exportJSON(state)}><Icon name="download" size={14} /> Export JSON</button>
                  <button className="btn btn-secondary btn-sm" onClick={() => fileRef.current?.click()}><Icon name="upload" size={14} /> Import JSON</button>
                  <input ref={fileRef} type="file" accept=".json" style={{ display: 'none' }} onChange={e => { if (e.target.files[0]) importJSON(e.target.files[0], setState); }} />
                  <button className="btn btn-secondary btn-sm" onClick={() => saveVersion(state)}><Icon name="save" size={14} /> Save Version</button>
                  <button className="btn btn-danger btn-sm" onClick={() => { if (confirm('Clear all plan data and start fresh?')) setState(createDefaultState()); }}>New Project</button>
                </div>
              </div>
            </div>
          </div>
        </>
      );
    };

    // ============================================
    // HELPERS
    // ============================================
    const getActiveSections = (state) => {
      return [...TIER1_IDS, ...state.settings.enabledSections.filter(id => !TIER1_IDS.includes(id))];
    };

    // ============================================
    // MAIN APP
    // ============================================
    const App = () => {
      const loadSaved = () => {
        try { const s = localStorage.getItem(STORAGE_KEY); if (s) return JSON.parse(s); } catch (e) { }
        return createDefaultState();
      };

      const [state, setState] = useState(loadSaved);
      const [activeView, setActiveView] = useState('dashboard'); // 'dashboard' | 'preview' | sectionId
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [moreOpen, setMoreOpen] = useState(false);

      // On mount: apply shared suite theme if available
      useEffect(() => {
        const shared = localStorage.getItem('coffeecup-theme');
        if (shared && shared !== state.settings.theme) setState(prev => ({ ...prev, settings: { ...prev.settings, theme: shared } }));
      }, []);

      // Theme — sync shared key
      useEffect(() => { document.documentElement.setAttribute('data-theme', state.settings.theme); localStorage.setItem('coffeecup-theme', state.settings.theme); }, [state.settings.theme]);

      // Auto-save
      useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }, [state]);

      // Keyboard shortcuts
      useEffect(() => {
        const handler = (e) => {
          if (e.ctrlKey && e.key === 'p') { e.preventDefault(); window.print(); }
        };
        document.addEventListener('keydown', handler);
        return () => document.removeEventListener('keydown', handler);
      }, []);

      const activeSections = getActiveSections(state);
      const enabledExtended = state.settings.enabledSections.filter(id => !TIER1_IDS.includes(id));

      const navigate = (view) => setActiveView(view);

      return (
        <div className="app-layout">
          {/* Sidebar */}
          <nav className={`sidebar ${sidebarCollapsed ? 'collapsed' : ''}`}>
            <div className="sidebar-header">
              <div className="sidebar-header-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /></svg>
              </div>
              <div className="sidebar-header-text">
                <h1>PMPlan</h1>
                <p>{state.meta.name || 'Untitled Project'}</p>
              </div>
              <button className="sidebar-collapse-btn" onClick={() => setSidebarCollapsed(!sidebarCollapsed)} title={sidebarCollapsed ? 'Expand' : 'Collapse'}>
                <Icon name={sidebarCollapsed ? 'chevron-right' : 'chevron-left'} size={14} />
              </button>
            </div>

            <div className="sidebar-nav">
              {/* Dashboard */}
              <div className={`sidebar-item ${activeView === 'dashboard' ? 'active' : ''}`} onClick={() => navigate('dashboard')} title="Dashboard">
                <div className="sidebar-item-icon"><Icon name="home" /></div>
                <span className="sidebar-item-label">Dashboard</span>
              </div>

              <div className="sidebar-divider" />
              <div className="sidebar-section-label">Core Sections</div>

              {/* Tier 1 sections */}
              {TIER1_IDS.map(id => {
                const def = SECTION_DEFS[id];
                const sec = state.sections[id];
                return (
                  <div key={id} className={`sidebar-item ${activeView === id ? 'active' : ''}`} onClick={() => navigate(id)} title={def.name}>
                    <div className="sidebar-item-icon"><Icon name={def.icon} /></div>
                    <span className="sidebar-item-label">{def.name}</span>
                    <div className={`sidebar-item-status ${sec?.status || 'empty'}`} />
                  </div>
                );
              })}

              {/* Extended sections */}
              {enabledExtended.length > 0 && (
                <>
                  <div className="sidebar-divider" />
                  <div className={`sidebar-more-toggle ${moreOpen ? 'open' : ''}`} onClick={() => setMoreOpen(!moreOpen)}>
                    <Icon name="chevron-right" size={12} />
                    <span className="sidebar-item-label">Extended ({enabledExtended.length})</span>
                  </div>
                  {moreOpen && enabledExtended.map(id => {
                    const def = SECTION_DEFS[id];
                    const sec = state.sections[id];
                    return (
                      <div key={id} className={`sidebar-item ${activeView === id ? 'active' : ''}`} onClick={() => navigate(id)} title={def.name}>
                        <div className="sidebar-item-icon"><Icon name={def.icon} /></div>
                        <span className="sidebar-item-label">{def.name}</span>
                        <div className={`sidebar-item-status ${sec?.status || 'empty'}`} />
                      </div>
                    );
                  })}
                </>
              )}

              <div className="sidebar-divider" />

              {/* Preview */}
              <div className={`sidebar-item ${activeView === 'preview' ? 'active' : ''}`} onClick={() => navigate('preview')} title="Preview">
                <div className="sidebar-item-icon"><Icon name="eye" /></div>
                <span className="sidebar-item-label">Preview</span>
              </div>
            </div>

            {/* Sidebar Footer */}
            <div className="sidebar-footer">
              <div className="sidebar-item" onClick={() => setDrawerOpen(true)} title="Settings">
                <div className="sidebar-item-icon"><Icon name="settings" /></div>
                <span className="sidebar-item-label">Settings</span>
              </div>
            </div>
          </nav>

          {/* Main Content */}
          <div className="main-content">
            <header className="app-header">
              <span className="app-header-title">
                {activeView === 'dashboard' ? 'Dashboard' : activeView === 'preview' ? 'Preview' : SECTION_DEFS[activeView]?.name || ''}
              </span>
              <span className="app-header-spacer" />
              <span className={`plan-status-badge ${state.meta.status.toLowerCase().replace(' ', '-')}`}>{state.meta.status}</span>
              <div className="theme-selector">
                <label>Theme</label>
                <select className="select-refined" style={{ padding: '4px 28px 4px 8px', fontSize: 12 }} value={state.settings.theme} onChange={e => setState(prev => ({ ...prev, settings: { ...prev.settings, theme: e.target.value } }))}>
                  {THEMES.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                </select>
              </div>
              <button className="settings-btn" onClick={() => setDrawerOpen(true)} title="Settings"><Icon name="settings" /></button>
            </header>

            <div className="content-area">
              {activeView === 'dashboard' && <Dashboard state={state} setState={setState} onNavigate={navigate} />}
              {activeView === 'preview' && <PreviewMode state={state} onNavigate={navigate} />}
              {activeView !== 'dashboard' && activeView !== 'preview' && SECTION_DEFS[activeView] && renderSection(activeView, state, setState)}
            </div>
          </div>

          {/* Settings Drawer */}
          <SettingsDrawer isOpen={drawerOpen} onClose={() => setDrawerOpen(false)} state={state} setState={setState} />
        </div>
      );
    };

    // ============================================
    // MOUNT
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
