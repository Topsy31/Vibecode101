<!DOCTYPE html>
<html lang="en" data-theme="blueprint">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeCup — Quality Register</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b8956a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 11.08V12a10 10 0 1 1-5.93-9.14'%3E%3C/path%3E%3Cpolyline points='22 4 12 14.01 9 11.01'%3E%3C/polyline%3E%3C/svg%3E">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            /* Blueprint Theme (Default) */
            --bg-primary: #fafaf9;
            --bg-secondary: #f5f5f4;
            --bg-card: #ffffff;
            --bg-hover: #e7e5e4;

            --border-primary: #d6d3d1;
            --border-secondary: #e7e5e4;
            --border-accent: #b8956a;

            --text-primary: #292524;
            --text-secondary: #57534e;
            --text-muted: #78716c;
            --text-faint: #a8a29e;

            --accent-primary: #b8956a;
            --accent-hover: #9f7d54;
            --accent-light: #f5f0eb;

            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --info: #3b82f6;

            --font-primary: 'DM Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;

            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        [data-theme="fun"] {
            --bg-primary: #fff0f7;
            --bg-secondary: #fce7f3;
            --bg-card: #ffffff;
            --bg-hover: #fbcfe8;
            --border-primary: #f9a8d4;
            --border-secondary: #fbcfe8;
            --border-accent: #d946ef;
            --text-primary: #831843;
            --text-secondary: #db2777;
            --text-muted: #be185d;
            --text-faint: #fda4af;
            --accent-primary: #d946ef;
            --accent-hover: #c026d3;
            --accent-light: #fdf4ff;
            --font-primary: 'Nunito', sans-serif;
            --radius-md: 20px;
            --radius-lg: 24px;
        }

        [data-theme="dark"] {
            --bg-primary: #18181b;
            --bg-secondary: #27272a;
            --bg-card: #1f1f22;
            --bg-hover: #3f3f46;
            --border-primary: #3f3f46;
            --border-secondary: #27272a;
            --border-accent: #6366f1;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --text-faint: #52525b;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #1e1b4b;
        }

        [data-theme="traditional"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #e9ecef;
            --bg-card: #ffffff;
            --bg-hover: #dee2e6;
            --border-primary: #ced4da;
            --border-secondary: #dee2e6;
            --border-accent: #0d6efd;
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-muted: #6c757d;
            --text-faint: #adb5bd;
            --accent-primary: #0d6efd;
            --accent-hover: #0b5ed7;
            --accent-light: #e7f1ff;
            --radius-sm: 2px;
            --radius-md: 4px;
            --radius-lg: 4px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-primary);
            transition: background-color 0.2s, color 0.2s;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            border: 1px solid var(--accent-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .input-refined {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            padding: 0.5rem 0.75rem;
            width: 100%;
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        .input-refined:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .tab-active {
            border-bottom: 2px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .badge {
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-neutral {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons ---
        const IconCheckCircle = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconList = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
        const IconAlertTriangle = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        const IconAward = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>;
        const IconPlus = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconSettings = ({ size = 20 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconChevronDown = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;

        // --- Components ---

        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 animate-fade-in">
                    <div className="card w-96 p-6 space-y-4">
                        <h3 className="text-lg font-bold">{title}</h3>
                        <p className="text-secondary">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onClose} className="btn btn-secondary">Cancel</button>
                            <button onClick={() => { onConfirm(); onClose(); }} className="btn btn-danger">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CriteriaModule = ({ criteria, setCriteria }) => {
            const [newCriterion, setNewCriterion] = useState({ id: '', category: 'Inspection', description: '', method: 'Visual', tolerance: '' });

            const add = () => {
                if (!newCriterion.description) return;
                setCriteria([...criteria, { ...newCriterion, id: Date.now().toString() }]);
                setNewCriterion({ id: '', category: 'Inspection', description: '', method: 'Visual', tolerance: '' });
            };

            const remove = (id) => setCriteria(criteria.filter(c => c.id !== id));

            return (
                <div className="space-y-6">
                    <div className="card p-4">
                        <h3 className="text-sm font-bold text-secondary uppercase tracking-wide mb-3">Add Quality Standard</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                            <select className="input-refined" value={newCriterion.category} onChange={e => setNewCriterion({ ...newCriterion, category: e.target.value })}>
                                <option>Inspection</option>
                                <option>Functionality</option>
                                <option>Performance</option>
                                <option>Compliance</option>
                                <option>Usability</option>
                            </select>
                            <input type="text" className="input-refined md:col-span-2" placeholder="Description of standard..." value={newCriterion.description} onChange={e => setNewCriterion({ ...newCriterion, description: e.target.value })} />
                            <button onClick={add} className="btn btn-primary"><IconPlus size={18} /> Add Standard</button>
                        </div>
                    </div>

                    <div className="card p-0">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-[var(--bg-secondary)] text-[var(--text-muted)] uppercase text-xs">
                                <tr>
                                    <th className="px-6 py-3">Category</th>
                                    <th className="px-6 py-3">Description</th>
                                    <th className="px-6 py-3">Method</th>
                                    <th className="px-6 py-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-[var(--border-secondary)]">
                                {criteria.length === 0 ? (
                                    <tr><td colSpan="4" className="px-6 py-8 text-center text-[var(--text-muted)] italic">No quality standards defined. Add one above.</td></tr>
                                ) : (
                                    criteria.map(c => (
                                        <tr key={c.id}>
                                            <td className="px-6 py-3 font-medium">{c.category}</td>
                                            <td className="px-6 py-3">{c.description}</td>
                                            <td className="px-6 py-3"><span className="badge badge-neutral">{c.method}</span></td>
                                            <td className="px-6 py-3 text-right">
                                                <button onClick={() => remove(c.id)} className="btn-ghost p-1 rounded hover:text-[var(--danger)]"><IconTrash /></button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const DefectsModule = ({ defects, setDefects }) => {
            const [newDefect, setNewDefect] = useState({ id: '', description: '', severity: 'Minor', status: 'Open', dateLogged: new Date().toISOString().split('T')[0] });

            const add = () => {
                if (!newDefect.description) return;
                setDefects([...defects, { ...newDefect, id: Date.now().toString() }]);
                setNewDefect({ ...newDefect, description: '' });
            };

            const updateStatus = (id, newStatus) => {
                setDefects(defects.map(d => d.id === id ? { ...d, status: newStatus, dateResolved: newStatus === 'Closed' ? new Date().toISOString().split('T')[0] : null } : d));
            };

            return (
                <div className="space-y-6">
                    <div className="card p-4">
                        <h3 className="text-sm font-bold text-secondary uppercase tracking-wide mb-3">Log Defect</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                            <input type="text" className="input-refined md:col-span-2" placeholder="Detect description..." value={newDefect.description} onChange={e => setNewDefect({ ...newDefect, description: e.target.value })} />
                            <select className="input-refined" value={newDefect.severity} onChange={e => setNewDefect({ ...newDefect, severity: e.target.value })}>
                                <option>Critical</option>
                                <option>Major</option>
                                <option>Minor</option>
                                <option>Cosmetic</option>
                            </select>
                            <button onClick={add} className="btn btn-primary"><IconPlus size={18} /> Log Defect</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {['Open', 'In Progress', 'Closed'].map(status => (
                            <div key={status} className="space-y-3">
                                <div className="flex items-center justify-between text-sm font-semibold text-[var(--text-secondary)]">
                                    <span>{status}</span>
                                    <span className="badge badge-neutral">{defects.filter(d => d.status === status).length}</span>
                                </div>
                                <div className="space-y-3 min-h-[200px] bg-[var(--bg-secondary)] p-3 rounded-lg border border-[var(--border-secondary)]">
                                    {defects.filter(d => d.status === status).map(def => (
                                        <div key={def.id} className="card p-3 shadow-sm bg-[var(--bg-card)]">
                                            <div className="flex justify-between items-start mb-2">
                                                <span className={`badge ${def.severity === 'Critical' ? 'badge-danger' : def.severity === 'Major' ? 'badge-warning' : 'badge-info'}`}>{def.severity}</span>
                                                <div className="flex gap-1">
                                                    {status !== 'Open' && <button onClick={() => updateStatus(def.id, 'Open')} className="text-xs hover:text-[var(--accent-primary)]" title="Move to Open">←</button>}
                                                    {status !== 'Closed' && <button onClick={() => updateStatus(def.id, status === 'Open' ? 'In Progress' : 'Closed')} className="text-xs hover:text-[var(--accent-primary)]" title="Advance">→</button>}
                                                </div>
                                            </div>
                                            <p className="text-sm leading-tight">{def.description}</p>
                                            <div className="mt-2 text-xs text-[var(--text-muted)]">Logged: {def.dateLogged}</div>
                                        </div>
                                    ))}
                                    {defects.filter(d => d.status === status).length === 0 && <div className="text-xs text-center p-4 text-[var(--text-faint)]">No items</div>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SignOffModule = ({ approvals, setApprovals }) => {
            const [signer, setSigner] = useState({ name: '', role: 'Client', notes: '' });

            const sign = () => {
                if (!signer.name) return;
                setApprovals([...approvals, { id: Date.now().toString(), ...signer, date: new Date().toISOString().split('T')[0], status: 'Approved' }]);
                setSigner({ name: '', role: 'Client', notes: '' });
            };

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="card p-6 md:col-span-1 border-[var(--border-accent)]">
                            <h3 className="text-lg font-bold mb-4">Acceptance Sign-Off</h3>
                            <p className="text-sm text-[var(--text-secondary)] mb-4">Formal acceptance of deliverables.</p>
                            <div className="space-y-3">
                                <input type="text" className="input-refined" placeholder="Signer Name" value={signer.name} onChange={e => setSigner({ ...signer, name: e.target.value })} />
                                <select className="input-refined" value={signer.role} onChange={e => setSigner({ ...signer, role: e.target.value })}>
                                    <option>Client</option>
                                    <option>Sponsor</option>
                                    <option>Project Manager</option>
                                    <option>QA Lead</option>
                                </select>
                                <textarea className="input-refined" rows="3" placeholder="Condition notes..." value={signer.notes} onChange={e => setSigner({ ...signer, notes: e.target.value })}></textarea>
                                <button onClick={sign} className="btn btn-primary w-full"><IconAward /> Sign Off</button>
                            </div>
                        </div>

                        <div className="md:col-span-2 space-y-4">
                            <h3 className="text-lg font-bold">Approval Log</h3>
                            {approvals.length === 0 ? (
                                <div className="p-8 border-2 border-dashed border-[var(--border-secondary)] rounded-lg text-center text-[var(--text-muted)]">No formal sign-offs yet.</div>
                            ) : (
                                <div className="grid grid-cols-1 gap-3">
                                    {approvals.map(app => (
                                        <div key={app.id} className="card p-4 flex items-center gap-4 bg-[var(--bg-secondary)]">
                                            <div className="h-12 w-12 rounded-full bg-[var(--success)]/20 text-[var(--success)] flex items-center justify-center">
                                                <IconCheckCircle size={24} />
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex justify-between">
                                                    <h4 className="font-bold">{app.name}</h4>
                                                    <span className="text-xs font-mono text-[var(--text-muted)]">{app.date}</span>
                                                </div>
                                                <div className="text-sm text-[var(--text-secondary)]">{app.role}</div>
                                                {app.notes && <div className="text-xs text-[var(--text-muted)] mt-1 italic">"{app.notes}"</div>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ChecklistsModule = ({ checklists, setChecklists }) => {
            // Simple implementation: List of clickable items
            const [newItem, setNewItem] = useState('');

            const addItem = () => {
                if (!newItem) return;
                setChecklists([...checklists, { id: Date.now().toString(), text: newItem, done: false }]);
                setNewItem('');
            };

            const toggle = (id) => {
                setChecklists(checklists.map(c => c.id === id ? { ...c, done: !c.done } : c));
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="card p-4 flex gap-2">
                        <input type="text" className="input-refined flex-1" placeholder="Add inspection item..." value={newItem} onChange={e => setNewItem(e.target.value)} onKeyDown={e => e.key === 'Enter' && addItem()} />
                        <button onClick={addItem} className="btn btn-primary">Add</button>
                    </div>

                    <div className="space-y-2">
                        {checklists.map(item => (
                            <div key={item.id} className={`card p-3 flex items-center gap-3 cursor-pointer select-none transition-colors ${item.done ? 'bg-[var(--bg-secondary)]' : 'hover:border-[var(--accent-primary)]'}`} onClick={() => toggle(item.id)}>
                                <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${item.done ? 'bg-[var(--success)] border-[var(--success)] text-white' : 'border-[var(--border-primary)]'}`}>
                                    {item.done && <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"></polyline></svg>}
                                </div>
                                <span className={item.done ? 'line-through text-[var(--text-muted)]' : 'text-[var(--text-primary)]'}>{item.text}</span>
                            </div>
                        ))}
                        {checklists.length === 0 && <div className="text-center text-[var(--text-muted)] mt-8">List is empty.</div>}
                    </div>
                </div>
            );
        }

        // --- Main App ---

        function App() {
            const [theme, setTheme] = useState(localStorage.getItem('coffeecup-theme') || 'blueprint');
            const [activeTab, setActiveTab] = useState('criteria');

            // Data State
            const [criteria, setCriteria] = useState([]);
            const [defects, setDefects] = useState([]);
            const [approvals, setApprovals] = useState([]);
            const [checklists, setChecklists] = useState([]);

            // Theme Sync
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('coffeecup-theme', theme);
            }, [theme]);

            // Load Data
            useEffect(() => {
                const saved = localStorage.getItem('quality-project');
                if (saved) {
                    const data = JSON.parse(saved);
                    setCriteria(data.criteria || []);
                    setDefects(data.defects || []);
                    setApprovals(data.approvals || []);
                    setChecklists(data.checklists || []);
                }
            }, []);

            // Auto-Save
            useEffect(() => {
                localStorage.setItem('quality-project', JSON.stringify({
                    criteria, defects, approvals, checklists, lastModified: new Date().toISOString()
                }));
            }, [criteria, defects, approvals, checklists]);

            return (
                <div className="min-h-screen p-6 md:p-12 max-w-7xl mx-auto animate-fade-in">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row gap-6 mb-8 items-start md:items-center justify-between">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center text-white shadow-lg">
                                <IconCheckCircle size={24} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight">Quality Register</h1>
                                <p className="text-[var(--text-muted)]">Control, Assurance & Acceptance</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <select className="input-refined text-sm py-1.5" value={theme} onChange={e => setTheme(e.target.value)}>
                                <option value="blueprint">Architectural Blueprint</option>
                                <option value="fun">Fun & Vibrant</option>
                                <option value="dark">Dark Mode</option>
                                <option value="traditional">Traditional</option>
                            </select>
                        </div>
                    </div>

                    {/* Navigation */}
                    <div className="flex gap-6 border-b border-[var(--border-secondary)] mb-8 overflow-x-auto">
                        <button onClick={() => setActiveTab('criteria')} className={`pb-3 px-1 text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'criteria' ? 'tab-active' : 'text-[var(--text-muted)] hover:text-[var(--text-primary)]'}`}>Quality Criteria</button>
                        <button onClick={() => setActiveTab('checklists')} className={`pb-3 px-1 text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'checklists' ? 'tab-active' : 'text-[var(--text-muted)] hover:text-[var(--text-primary)]'}`}>Inspection Checklists</button>
                        <button onClick={() => setActiveTab('defects')} className={`pb-3 px-1 text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'defects' ? 'tab-active' : 'text-[var(--text-muted)] hover:text-[var(--text-primary)]'}`}>Defect Log</button>
                        <button onClick={() => setActiveTab('approvals')} className={`pb-3 px-1 text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'approvals' ? 'tab-active' : 'text-[var(--text-muted)] hover:text-[var(--text-primary)]'}`}>Sign-Off</button>
                    </div>

                    {/* Content */}
                    <div className="animate-fade-in">
                        {activeTab === 'criteria' && <CriteriaModule criteria={criteria} setCriteria={setCriteria} />}
                        {activeTab === 'checklists' && <ChecklistsModule checklists={checklists} setChecklists={setChecklists} />}
                        {activeTab === 'defects' && <DefectsModule defects={defects} setDefects={setDefects} />}
                        {activeTab === 'approvals' && <SignOffModule approvals={approvals} setApprovals={setApprovals} />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
